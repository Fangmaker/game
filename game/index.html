<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070b16">
<link rel="icon" href="data:,">
<link rel="manifest" href="manifest.webmanifest">
<title>小王子 · B-612</title>
<style>
  :root{
    --sand:#e8c795;
    --cream:#f4ead9;
    --rose:#d1564f;
    --night:#070b16;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--night);}
  body{
    font-family:"Songti SC","STSong","Noto Serif SC",Georgia,"Times New Roman",serif;
    color:var(--cream);
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(115% 85% at 50% 46%,rgba(0,0,0,0) 42%,rgba(3,6,14,.62) 100%);
  }

  /* ---------- 顶部计数 ---------- */
  #chips{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 12px);
    display:flex;gap:6px;pointer-events:none;z-index:6;
  }
  .chip{
    display:flex;align-items:center;gap:5px;
    padding:5px 9px 5px 8px;border-radius:999px;
    background:rgba(9,14,26,.42);
    border:1px solid rgba(244,234,217,.14);
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    font-size:11.5px;letter-spacing:.5px;color:rgba(244,234,217,.86);
    line-height:1;
  }
  .chip svg{width:13px;height:13px;display:block;opacity:.9}
  .chip b{font-weight:400;font-variant-numeric:tabular-nums;min-width:8px;text-align:center}

  /* ---------- 生存状态条（血/渴/体力） ---------- */
  #vitals{
    position:fixed;left:50%;transform:translateX(-50%);
    top:calc(env(safe-area-inset-top,0px) + 12px);
    width:150px;display:flex;flex-direction:column;gap:4px;z-index:6;pointer-events:none;
  }
  .vit{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.7px;
    color:rgba(244,234,217,.55);text-shadow:0 1px 5px rgba(0,0,0,.9)}
  .vit i{font-style:normal;width:9px;text-align:center;opacity:.8;font-size:10px}
  .vit .bar{flex:1;height:4px;border-radius:99px;background:rgba(8,12,22,.55);
    box-shadow:inset 0 0 0 1px rgba(244,234,217,.12);overflow:hidden}
  .vit .bar span{display:block;height:100%;width:100%;border-radius:99px;
    transition:width .16s linear,background .3s}
  #vHp .bar span{background:linear-gradient(90deg,#b8493f,#e8856f)}
  #vTh .bar span{background:linear-gradient(90deg,#2f6f96,#7fc3e8)}
  #vSt .bar span{background:linear-gradient(90deg,#6c7d3e,#c2d885)}
  #vitals.dry #vTh .bar span{background:linear-gradient(90deg,#a8482f,#e07a4a);animation:drypulse 1.1s infinite}
  #vitals.hurt{animation:hurtflash .32s}
  /* 等级 / 经验（第三批） */
  #lvBadge{display:flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.7px;
    color:rgba(255,214,154,.92);text-shadow:0 1px 5px rgba(0,0,0,.9)}
  #lvBadge b{font-weight:600;font-size:10px;min-width:26px}
  #lvBadge .xp{flex:1;height:3px;border-radius:99px;background:rgba(8,12,22,.55);
    box-shadow:inset 0 0 0 1px rgba(255,214,154,.18);overflow:hidden}
  #lvBadge .xp span{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#c9a35b,#ffe0a8);transition:width .2s linear}
  #lvBadge.up b{animation:lvpop .6s}
  @keyframes lvpop{0%{transform:scale(1.9);color:#fff}100%{transform:scale(1)}}
  /* 口渴条本身可点：点一下喝一口水壶 */
  #vTh{pointer-events:auto;cursor:pointer;margin:-4px -6px;padding:4px 6px}
  @keyframes drypulse{0%,100%{opacity:1}50%{opacity:.45}}
  @keyframes hurtflash{0%{filter:brightness(2.2) saturate(1.6)}100%{filter:none}}

  /* ---------- 罗盘 ---------- */
  #compass{
    position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);
    width:54px;display:flex;flex-direction:column;align-items:center;gap:1px;
    z-index:6;pointer-events:none;
  }
  #compass svg{width:54px;height:54px;display:block;overflow:visible}
  #cdis{
    font-size:10px;letter-spacing:.6px;color:rgba(244,234,217,.5);
    font-variant-numeric:tabular-nums;white-space:nowrap;
    text-shadow:0 1px 6px rgba(0,0,0,.9);
  }
  #cdis.home{color:rgba(232,199,149,.85)}

  /* ---------- 任务 ---------- */
  #quests{
    position:fixed;left:calc(env(safe-area-inset-left,0px) + 14px);
    top:calc(env(safe-area-inset-top,0px) + 96px);
    width:168px;display:flex;flex-direction:column;gap:5px;z-index:5;pointer-events:none;
  }
  .q{
    font-size:11.5px;line-height:1.34;letter-spacing:.4px;
    color:rgba(244,234,217,.6);
    display:flex;gap:6px;align-items:flex-start;
    text-shadow:0 1px 8px rgba(0,0,0,.9);
    transition:color .5s ease,opacity .5s ease;
  }
  .q i{
    flex:0 0 5px;height:5px;margin-top:4.5px;border-radius:0;
    background:rgba(232,199,149,.5);transform:rotate(45deg);
    font-style:normal;transition:background .4s ease;
  }
  .q.done{color:rgba(244,234,217,.26)}
  .q.done i{background:rgba(159,177,132,.55)}
  @keyframes qflash{
    0%{opacity:.15;transform:translateX(-5px)}
    40%{opacity:1;transform:none;color:#ffe6b8}
    100%{color:rgba(244,234,217,.3)}
  }
  .q.flash{animation:qflash .95s ease}
  .q.flash i{background:#e8c795;box-shadow:0 0 9px rgba(232,199,149,.95)}

  /* ---------- 提示 / toast ---------- */
  #toast{
    position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 17%);
    transform:translate(-50%,8px);
    font-size:14.5px;letter-spacing:1px;
    color:rgba(248,238,220,.94);
    text-shadow:0 2px 14px rgba(0,0,0,.8);
    opacity:0;transition:opacity .5s ease,transform .5s ease;
    pointer-events:none;z-index:7;white-space:normal;text-align:center;line-height:1.4;
    max-width:88vw;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}
  /* 任务 / 解锁提示：放到画面下方居中，避免压住左上角任务条 */
  #toast.quest{
    top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);
    padding:10px 16px;border-radius:12px;
    background:rgba(9,14,26,.62);border:1px solid rgba(232,199,149,.3);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    text-shadow:0 1px 8px rgba(0,0,0,.7);
  }

  /* ---------- 摇杆 ---------- */
  #joy{
    position:fixed;
    left:calc(env(safe-area-inset-left,0px) + 24px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    width:112px;height:112px;border-radius:50%;
    border:1px solid rgba(244,234,217,.16);
    background:radial-gradient(circle at 50% 50%,rgba(244,234,217,.05),rgba(244,234,217,.015));
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    touch-action:none;z-index:5;opacity:.9;
    transition:opacity .3s ease;
  }
  #knob{
    position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
    border-radius:50%;
    background:radial-gradient(circle at 38% 32%,rgba(248,238,220,.34),rgba(232,199,149,.13));
    border:1px solid rgba(244,234,217,.3);
    transition:transform .06s linear;
  }
  #joy.idle{opacity:.55}

  /* ---------- 动作按钮 ---------- */
  #act{
    position:fixed;
    right:calc(env(safe-area-inset-right,0px) + 26px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 34px);
    width:74px;height:74px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:radial-gradient(circle at 40% 32%,rgba(209,86,79,.30),rgba(209,86,79,.08));
    border:1px solid rgba(240,190,170,.45);
    color:#fbeadd;font-family:inherit;
    opacity:0;transform:scale(.82);pointer-events:none;
    transition:opacity .22s ease,transform .22s ease,background .2s;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    z-index:6;
  }
  #act.on{opacity:1;transform:scale(1);pointer-events:auto;}
  #act:active{transform:scale(.93);background:radial-gradient(circle at 40% 32%,rgba(209,86,79,.5),rgba(209,86,79,.15));}
  #act svg{width:22px;height:22px}
  #act em{font-style:normal;font-size:11px;letter-spacing:1.5px;opacity:.92}
  #act .k{
    position:absolute;top:-8px;right:-4px;
    font-size:9.5px;letter-spacing:.5px;
    padding:2px 5px;border-radius:4px;
    background:rgba(7,11,22,.72);border:1px solid rgba(244,234,217,.2);
    color:rgba(244,234,217,.8);
  }
  body.touch #act .k{display:none;}

  /* ---------- 技能按钮 ---------- */
  #skill{
    position:fixed;
    right:calc(env(safe-area-inset-right,0px) + 96px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 122px);
    width:64px;height:64px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    background:radial-gradient(circle at 40% 32%,rgba(232,199,149,.26),rgba(232,199,149,.06));
    border:1px solid rgba(232,199,149,.48);
    color:#fbeadd;font-family:inherit;
    z-index:6;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:opacity .2s,background .2s;
  }
  #skill:active{transform:scale(.94)}
  #skill .k{
    position:absolute;top:-8px;right:-4px;
    font-size:9.5px;padding:2px 5px;border-radius:4px;
    background:rgba(7,11,22,.72);border:1px solid rgba(244,234,217,.2);
    color:rgba(244,234,217,.8);
  }
  #skill em{font-style:normal;font-size:10px;letter-spacing:.5px;opacity:.95;max-width:56px;text-align:center;line-height:1.1}
  #skill b{font-size:13px;font-weight:500;letter-spacing:.5px;color:#ffd9a0}
  #skill.cool{opacity:.92}
  #skill.cool em{opacity:.5}
  #skillRing{
    position:absolute;inset:-4px;border-radius:50%;pointer-events:none;
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
  }
  body.touch #skill .k{display:none;}

  /* ---------- 底部提示 ---------- */
  #hint{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    transform:translateX(-50%);
    font-size:12px;letter-spacing:2px;color:rgba(244,234,217,.5);
    pointer-events:none;z-index:4;
    transition:opacity 1.2s ease;white-space:nowrap;
  }
  #hint.hide{opacity:0}

  /* ---------- 开场 ---------- */
  #boot{
    position:fixed;inset:0;z-index:20;background:#070b16;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    transition:opacity 1s ease;
  }
  #boot.off{opacity:0;pointer-events:none}
  #boot .t{font-size:15px;letter-spacing:8px;color:rgba(244,234,217,.72);text-indent:8px}
  #boot .l{width:76px;height:1px;background:linear-gradient(90deg,transparent,rgba(232,199,149,.65),transparent)}

  #err{
    position:fixed;left:12px;right:12px;bottom:12px;z-index:99;
    font:12px/1.5 Consolas,monospace;color:#ffb4a8;
    background:rgba(40,10,12,.9);padding:8px 10px;border-radius:6px;display:none;
    white-space:pre-wrap;max-height:40vh;overflow:auto;
  }
  /* ---------- 工具（挖 / 放） ---------- */
  #tools{
    position:fixed;
    right:calc(env(safe-area-inset-right,0px) + 26px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 122px);
    display:flex;flex-direction:column;gap:8px;z-index:6;
  }
  .tool{
    width:58px;height:58px;border-radius:50%;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    background:radial-gradient(circle at 40% 30%,rgba(232,199,149,.20),rgba(232,199,149,.05));
    border:1px solid rgba(232,199,149,.30);color:#f4ead9;font-family:inherit;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:transform .12s ease,opacity .2s ease,background .2s;
  }
  .tool svg{width:21px;height:21px;display:block}
  .tool em{font-style:normal;font-size:10px;letter-spacing:1.5px;opacity:.86}
  .tool:active{transform:scale(.92);background:radial-gradient(circle at 40% 30%,rgba(232,199,149,.42),rgba(232,199,149,.13));}
  /* 变灰：只压图标和文字，别把“原因”小条一起压透明（否则等于没写） */
  .tool.off{border-color:rgba(232,199,149,.13);background:rgba(16,22,34,.30)}
  .tool.off svg,.tool.off em{opacity:.30}
  /* 变灰时必须写清原因，避免“按钮坏了”的误判：一条提示挂在工具组上方 */
  #toolWhy{
    display:none;position:absolute;right:0;bottom:calc(100% + 6px);
    padding:3px 8px;border-radius:6px;white-space:nowrap;
    font-size:10px;letter-spacing:.6px;color:#f0d7a8;
    background:rgba(8,12,22,.80);border:1px solid rgba(232,199,149,.22);
    text-shadow:0 1px 2px rgba(0,0,0,.85);pointer-events:none;
  }
  #toolWhy.on{display:block}
  .tool .k{
    position:absolute;top:-6px;left:-4px;
    font-size:9.5px;letter-spacing:.5px;padding:2px 5px;border-radius:4px;
    background:rgba(7,11,22,.75);border:1px solid rgba(244,234,217,.18);
    color:rgba(244,234,217,.78);
  }
  body.touch .tool .k{display:none;}

  /* ---------- 物品栏 ---------- */
  #inv{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
    display:flex;gap:8px;z-index:6;
  }
  .slot{
    width:46px;height:46px;border-radius:11px;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:rgba(9,14,26,.52);border:1px solid rgba(244,234,217,.16);
    color:var(--cream);font-family:inherit;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:border-color .2s ease,background .2s ease,transform .12s ease,opacity .2s ease;
  }
  .slot svg{width:26px;height:26px;display:block}
  .slot b{
    position:absolute;right:5px;bottom:2px;font-size:10.5px;font-weight:400;
    font-variant-numeric:tabular-nums;color:rgba(244,234,217,.92);
    text-shadow:0 1px 3px rgba(0,0,0,.9);
  }
  .slot .num{position:absolute;left:5px;top:2px;font-size:8.5px;color:rgba(244,234,217,.4)}
  .slot.sel{border-color:rgba(232,199,149,.9);background:rgba(232,199,149,.16);}
  .slot.empty{opacity:.42}
  .slot:active{transform:scale(.93)}
  body.touch .slot .num{display:none}
  body.touch #hint{display:none}

  /* ---------- 工坊 ---------- */
  #craftBtn{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 74px);
    padding:5px 13px;border-radius:11px;z-index:6;
    font-family:inherit;font-size:11px;letter-spacing:1px;
    color:rgba(244,234,217,.86);
    background:rgba(9,14,26,.55);border:1px solid rgba(232,199,149,.22);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  #craftBtn b{color:#f0d7a8;font-weight:400;margin-left:5px}
  #craftBtn:active{transform:translateX(-50%) scale(.95)}
  #craft{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);
    width:min(92vw,392px);max-height:74vh;overflow:auto;z-index:20;
    padding:14px 14px 12px;border-radius:16px;
    background:rgba(8,12,22,.92);border:1px solid rgba(232,199,149,.22);
    box-shadow:0 18px 48px rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;
    display:flex;flex-direction:column;gap:8px;
  }
  #craft.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  #craft h3{margin:0 0 2px;font-size:13px;font-weight:400;letter-spacing:2px;color:#f0d7a8}
  #craft .mats{display:flex;gap:10px;font-size:10.5px;color:rgba(244,234,217,.62)}
  #craftList{display:flex;flex-direction:column;gap:7px}
  .rc{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:10px;
      background:rgba(244,234,217,.045);border:1px solid rgba(244,234,217,.10)}
  .rc .nm{font-size:12px;color:#f4ead9}
  .rc .ct{font-size:10px;color:rgba(244,234,217,.55)}
  .rc .own{font-size:10px;color:#f0d7a8}
  .rc .grow{flex:1}
  .rc button{
    font-family:inherit;font-size:11px;padding:5px 9px;border-radius:8px;
    color:#10141f;background:#e8c795;border:0;
  }
  .rc button.b2{background:rgba(232,199,149,.16);color:#f0d7a8;
    border:1px solid rgba(232,199,149,.34)}
  .rc button:disabled{opacity:.30}
  #craft .tip{font-size:10px;color:rgba(244,234,217,.45);line-height:1.5}
  #craft .x{align-self:flex-end;font-size:11px;color:rgba(244,234,217,.6);
    background:none;border:0;padding:2px 4px;font-family:inherit}

  /* ---------- 角色 / 换装 ---------- */
  #lookBtn{
    position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);
    top:calc(env(safe-area-inset-top,0px) + 50px);
    width:36px;height:36px;border-radius:50%;z-index:6;
    display:flex;align-items:center;justify-content:center;
    background:rgba(9,14,26,.46);border:1px solid rgba(244,234,217,.18);
    color:rgba(244,234,217,.86);font-family:inherit;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  #lookBtn svg{width:19px;height:19px}
  #lookBtn:active{background:rgba(232,199,149,.22)}
  #look{
    position:fixed;inset:0;z-index:24;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(3,6,14,.52);opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  #look.on{opacity:1;pointer-events:auto}
  #look .panel{
    width:min(440px,100%);max-height:82%;overflow:auto;
    background:linear-gradient(180deg,rgba(12,18,32,.97),rgba(7,11,22,.99));
    border-top:1px solid rgba(232,199,149,.18);
    border-radius:18px 18px 0 0;
    padding:15px 16px calc(env(safe-area-inset-bottom,0px) + 15px);
    box-shadow:0 -12px 40px rgba(0,0,0,.5);
  }
  #look .h{font-size:12px;letter-spacing:5px;color:rgba(232,199,149,.8);text-align:center;margin-bottom:12px;text-indent:5px}
  .chars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
  .ccard{
    padding:9px 3px 8px;border-radius:10px;border:1px solid rgba(244,234,217,.12);
    background:rgba(244,234,217,.04);color:rgba(244,234,217,.72);
    font-family:inherit;font-size:11.5px;letter-spacing:1px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:background .18s,border-color .18s,color .18s;
  }
  .ccard i{width:17px;height:17px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.18)}
  .ccard.on{border-color:rgba(232,199,149,.82);background:rgba(232,199,149,.15);color:#f4ead9}
  .ccard.lock{opacity:.6;border-style:dashed;color:rgba(244,234,217,.5)}
  .ccard.lock i{background:rgba(244,234,217,.07);border-color:rgba(244,234,217,.16)}
  .ccard .req{font-size:9px;line-height:1.15;letter-spacing:0;color:rgba(232,199,149,.55);max-width:100%;word-break:break-word;text-align:center}
  #lockTip{font-size:10px;letter-spacing:1px;color:rgba(244,234,217,.34);text-align:center;margin:-6px 0 10px}
  @keyframes lookpulse{0%{box-shadow:0 0 0 0 rgba(232,199,149,.62)}70%{box-shadow:0 0 0 13px rgba(232,199,149,0)}100%{box-shadow:0 0 0 0 rgba(232,199,149,0)}}
  #lookBtn.new{animation:lookpulse 1.4s ease 2;border-color:rgba(232,199,149,.9);color:#ffe6b8}
  .orow{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .orow .lbl{flex:0 0 44px;font-size:11px;letter-spacing:1px;color:rgba(244,234,217,.5)}
  .opts{display:flex;gap:6px;flex-wrap:wrap}
  .opt{min-width:34px;height:27px;padding:0 9px;border-radius:7px;border:1px solid rgba(244,234,217,.15);background:rgba(244,234,217,.05);color:rgba(244,234,217,.7);font-family:inherit;font-size:11px;letter-spacing:1px}
  .opt.on{border-color:rgba(232,199,149,.9);background:rgba(232,199,149,.18);color:#f4ead9}
  .opt.sw{width:27px;padding:0;border-radius:50%}
  #lookClose{width:100%;margin-top:6px;padding:11px;border-radius:10px;border:1px solid rgba(232,199,149,.48);background:rgba(232,199,149,.16);color:#f4ead9;font-family:inherit;font-size:13px;letter-spacing:5px;text-indent:5px}

  /* ---------- 联机 ---------- */
  #netBtn{
    position:fixed;right:calc(env(safe-area-inset-right,0px) + 54px);
    top:calc(env(safe-area-inset-top,0px) + 50px);
    width:36px;height:36px;border-radius:50%;z-index:6;
    display:flex;align-items:center;justify-content:center;
    background:rgba(9,14,26,.46);border:1px solid rgba(244,234,217,.18);
    color:rgba(244,234,217,.86);font-family:inherit;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  #netBtn svg{width:19px;height:19px}
  #netBtn:active{background:rgba(232,199,149,.22)}
  #netBtn.live{border-color:rgba(159,201,137,.7);background:rgba(159,201,137,.16)}
  #net{
    position:fixed;inset:0;z-index:25;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(3,6,14,.52);opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  #net.on{opacity:1;pointer-events:auto}
  #net .panel{
    width:min(420px,100%);max-height:82%;overflow:auto;touch-action:pan-y;
    background:linear-gradient(180deg,rgba(12,18,32,.97),rgba(7,11,22,.99));
    border-top:1px solid rgba(232,199,149,.18);
    border-radius:18px 18px 0 0;
    padding:15px 16px calc(env(safe-area-inset-bottom,0px) + 15px);
    box-shadow:0 -12px 40px rgba(0,0,0,.5);
  }
  #net .h{font-size:12px;letter-spacing:5px;color:rgba(232,199,149,.8);text-align:center;margin-bottom:14px;text-indent:5px}
  .nrow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .nrow .lbl{flex:0 0 46px;font-size:11px;letter-spacing:1px;color:rgba(244,234,217,.5)}
  .nrow input{
    flex:1;min-width:0;height:38px;border-radius:9px;padding:0 10px;outline:none;
    border:1px solid rgba(244,234,217,.18);background:rgba(244,234,217,.06);
    color:var(--cream);font-family:inherit;font-size:16px;letter-spacing:.5px;
    touch-action:auto;-webkit-user-select:text;user-select:text;
  }
  .nrow input:focus{border-color:rgba(232,199,149,.66);background:rgba(232,199,149,.10)}
  #netStatus{font-size:11.5px;letter-spacing:.6px;color:rgba(244,234,217,.55);margin:2px 0 12px;min-height:16px;line-height:1.45}
  #netStatus.ok{color:rgba(159,201,137,.94)}
  #netStatus.warn{color:rgba(232,199,149,.94)}
  #netGo{width:100%;padding:11px;border-radius:10px;border:1px solid rgba(232,199,149,.48);background:rgba(232,199,149,.16);color:#f4ead9;font-family:inherit;font-size:13px;letter-spacing:5px;text-indent:5px}
  #netGo.danger{border-color:rgba(209,86,79,.55);background:rgba(209,86,79,.16)}
  #netClose{width:100%;margin-top:8px;padding:9px;border-radius:10px;border:1px solid rgba(244,234,217,.16);background:rgba(244,234,217,.05);color:rgba(244,234,217,.7);font-family:inherit;font-size:12px;letter-spacing:3px;text-indent:3px}

  @media (orientation:landscape) and (max-height:520px){
    #joy{width:84px;height:84px;left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
    #knob{width:36px;height:36px;margin:-18px 0 0 -18px}
    #act{width:76px;height:76px;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
    #tools{right:calc(env(safe-area-inset-right,0px) + 100px);bottom:calc(env(safe-area-inset-bottom,0px) + 108px);gap:6px}
    .tool{width:46px;height:46px}
    #skill{right:calc(env(safe-area-inset-right,0px) + 96px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:54px;height:54px}
    #quests{top:calc(env(safe-area-inset-top,0px) + 62px);gap:2px}
    .q{font-size:10px}
    #inv{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
    .slot{width:40px;height:40px}
  }

  @media (max-height:560px){
    #joy{width:92px;height:92px}
    #knob{width:40px;height:40px;margin:-20px 0 0 -20px}
    #act{width:64px;height:64px}
    #tools{bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
    .tool{width:50px;height:50px}
    #quests{top:calc(env(safe-area-inset-top,0px) + 88px);gap:3px}
    .q{font-size:10.5px}
  }
</style>
</head>

<script>
(function(){
'use strict';

/* ---------------------------------------------------------------- 错误兜底 */
var errBox = document.getElementById('err');
window.addEventListener('error', function(e){
  errBox.style.display = 'block';
  errBox.textContent += (e.message || e) + '\n' + ((e.error && e.error.stack) ? e.error.stack + '\n' : '');
});

var V3 = THREE.Vector3, QT = THREE.Quaternion;
var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
var lerp = function(a,b,t){ return a+(b-a)*t; };
var damp = function(a,b,lambda,dt){ return lerp(a,b,1-Math.exp(-lambda*dt)); };
var sstep = function(a,b,x){ var t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

/* ---------------------------------------------------------------- 渲染器 */
var canvas = document.getElementById('scene');
var renderer;
try{
  renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:false, powerPreference:'high-performance'});
}catch(err){
  errBox.style.display='block';
  errBox.textContent = '当前浏览器无法创建 WebGL 上下文：' + err.message;
  return;
}
if (THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(56, 1, 0.05, 4000);

/* ---------------------------------------------------------------- 工具 */
function discTexture(inner, outer){
  var s = 64, c = document.createElement('canvas');
  c.width = c.height = s;
  var ctx = c.getContext('2d');
  var g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0, inner);
  g.addColorStop(0.32, outer);
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  var t = new THREE.CanvasTexture(c);
  t.needsUpdate = true;
  return t;
}
var starTex = discTexture('rgba(255,255,255,1)', 'rgba(255,255,255,.55)');
var glowTex = discTexture('rgba(255,246,224,1)', 'rgba(255,196,120,.55)');

function dirFromLatLon(latDeg, lonDeg){
  var la = THREE.MathUtils.degToRad(latDeg), lo = THREE.MathUtils.degToRad(lonDeg);
  return new V3(Math.cos(la)*Math.cos(lo), Math.sin(la), Math.cos(la)*Math.sin(lo)).normalize();
}
function standOn(obj, dir, offset, spin){
  obj.position.copy(dir).multiplyScalar(PLANET_R + offset);
  var q = new QT().setFromUnitVectors(new V3(0,1,0), dir);
  if (spin) q.multiply(new QT().setFromAxisAngle(new V3(0,1,0), spin));
  obj.quaternion.copy(q);
}
/* 以 baseDir 为原点，在切平面上偏移 (dx,dz)，返回球面方向 */
function dirNear(baseDir, dx, dz){
  var up = baseDir.clone().normalize();
  var ref = Math.abs(up.y) > 0.9 ? new V3(1,0,0) : new V3(0,1,0);
  var tx = new V3().crossVectors(ref, up).normalize();
  var tz = new V3().crossVectors(up, tx).normalize();
  return up.multiplyScalar(PLANET_R).addScaledVector(tx, dx).addScaledVector(tz, dz).normalize();
}
/* 沿球面走 dist 距离 */
function stepDir(up, moveDir, dist){
  var th = dist / PLANET_R;
  return up.clone().multiplyScalar(Math.cos(th)).addScaledVector(moveDir, Math.sin(th)).normalize();
}
var hash = function(x,y,z){
  var n = Math.sin(x*12.9898 + y*78.233 + z*37.719) * 43758.5453;
  return n - Math.floor(n);
};

/* ---------------------------------------------------------------- 世界常量 */
var PLANET_R = 20;
var HOME_DIR   = dirFromLatLon(16, -30);    // 灯塔与井
var SPAWN_DIR  = dirFromLatLon(32, -2);
var ROSE_DIR   = dirFromLatLon(46, -23);
var LEDGE_DIR  = dirFromLatLon(-4, -20);
var OASIS_DIR  = dirFromLatLon(-10, -120);  // 绿洲水塘
var ASH_DIR    = dirFromLatLon(-30, 70);    // 火山灰地貌
var VOLC_DIRS  = [
  { dir: dirFromLatLon(-16, 74),  active: true,  scale: 1.10, spin: 0.4 },
  { dir: dirFromLatLon(52, -100), active: true,  scale: 1.02, spin: 1.9 },
  { dir: dirFromLatLon(-38, -148),active: false, scale: 0.95, spin: 0.8 }
];
var BAOB_SPOTS = [
  [22,-60],[-4,-110],[24,-88],[-30,60],[52,96],
  [-52,140],[10,170],[-62,-10],[40,-120],[5,40]
];
var SHARD_DIRS = [
  [-70,-120],[-55,-40],[-30,-160],[0,-95],[12,-135],[58,-170],
  [70,-60],[45,120],[18,148],[-20,100],[-45,170],[62,60]
];

/* ---------------------------------------------------------------- 天空 */
var skyUni = {
  uTop:  { value: new THREE.Color('#050812') },
  uMid:  { value: new THREE.Color('#142244') },
  uBot:  { value: new THREE.Color('#2c3a5e') },
  uSun:  { value: new THREE.Color('#ffc78a') },
  uSunDir:{ value: new V3(0.6, 0.3, 0.74).normalize() },
  uGlow: { value: 1.0 }
};
var sky = new THREE.Mesh(
  new THREE.SphereGeometry(1400, 32, 20),
  new THREE.ShaderMaterial({
    uniforms: skyUni,
    side: THREE.BackSide,
    depthWrite: false,
    vertexShader: [
      'varying vec3 vDir;',
      'void main(){',
      '  vDir = normalize(position);',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uBot;',
      'uniform vec3 uSun; uniform vec3 uSunDir; uniform float uGlow;',
      'varying vec3 vDir;',
      'void main(){',
      '  float h = clamp(vDir.y*0.5+0.5, 0.0, 1.0);',
      '  vec3 col = mix(uBot, uMid, smoothstep(0.0, 0.52, h));',
      '  col = mix(col, uTop, smoothstep(0.48, 1.0, h));',
      '  float d = max(dot(normalize(vDir), normalize(uSunDir)), 0.0);',
      '  col += uSun * pow(d, 20.0) * 0.55 * uGlow;',
      '  col += uSun * pow(d, 3.0) * 0.10 * uGlow;',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n')
  })
);
sky.renderOrder = -10;
scene.add(sky);

/* 星星 */
var starMat;
(function makeStars(){
  var n = 1400, pos = new Float32Array(n*3);
  for (var i=0;i<n;i++){
    var u = Math.random()*2-1, th = Math.random()*Math.PI*2, r = 900;
    var s = Math.sqrt(1-u*u);
    pos[i*3]   = Math.cos(th)*s*r;
    pos[i*3+1] = u*r;
    pos[i*3+2] = Math.sin(th)*s*r;
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  starMat = new THREE.PointsMaterial({
    size: 2.9, map: starTex, transparent: true, opacity: .9, fog: false,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: false,
    color: new THREE.Color('#cfe0ff')
  });
  var stars = new THREE.Points(g, starMat);
  stars.renderOrder = -9;
  scene.add(stars);
})();

/* 太阳 */
var sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: new THREE.Color('#ffd9a6'), fog: false,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
}));
sunSprite.scale.set(150, 150, 1);
sunSprite.renderOrder = -8;
scene.add(sunSprite);
var sunHalo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: new THREE.Color('#ffb070'), fog: false,
  transparent: true, opacity: .35, blending: THREE.AdditiveBlending, depthWrite: false
}));

/* ---------------------------------------------------------------- 地形：球面瓦片高度场 */
var TILE_DETAIL = 20;
var DIG_STEP  = 0.30;   // 每挖一层下沉
var DIG_DEPTH = 2.10;   // 旧版挖穿深度：只留给旧存档分档用
var CORE_R    = PLANET_R - 5.40;      // 实心内核半径：始终留 5.10 的挖掘厚度 + 0.30 缓冲
var DIG_DEPTH_MAX = PLANET_R - CORE_R - 0.30;   // 5.10：挖到内核的物理边界（17 铲），星球变大后深度不变
var CR_R      = 0.72;   // 坑口半径：挖出来的是圆口，不是一个三角面
var CR_PUNCH  = 0.50;   // 归一化半径小于这里 = 已经挖穿的通洞
var craters   = [];     // 圆坑：{ c: 球面方向, d: 深度, p: 是否挖穿 }
var tileVerts = [];
var tiles = [];
var baseMesh, baseGeo, overMesh, overGeo, coreMesh;

/* 稳定伪随机：给土加颗粒感，同一位置每次一样 */
function vhash(a, b, c){
  var s = Math.sin(a*127.1 + b*311.7 + c*74.7) * 43758.5453;
  return s - Math.floor(s);
}

/* 平滑值噪声：低频连续，避免逐面高对比色块 */
function snoise3(x, y, z){
  var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  var xf = x - xi, yf = y - yi, zf = z - zi;
  var u = xf*xf*(3 - 2*xf), v = yf*yf*(3 - 2*yf), w = zf*zf*(3 - 2*zf);
  var h = function(i, j, k){ return hash(xi+i, yi+j, zi+k); };
  var x00 = h(0,0,0) + (h(1,0,0) - h(0,0,0)) * u;
  var x10 = h(0,1,0) + (h(1,1,0) - h(0,1,0)) * u;
  var x01 = h(0,0,1) + (h(1,0,1) - h(0,0,1)) * u;
  var x11 = h(0,1,1) + (h(1,1,1) - h(0,1,1)) * u;
  var y0 = x00 + (x10 - x00) * v;
  var y1 = x01 + (x11 - x01) * v;
  return y0 + (y1 - y0) * w;
}

/* 统一地表色板：低饱和暖沙，只有绿洲/火山灰两块低对比度的变化 */
var _gSand = new THREE.Color('#cfba96');
var _gPale = new THREE.Color('#e2d4ba');
var _gDark = new THREE.Color('#b39c7c');
var _gMoss = new THREE.Color('#94a180');
var _gAsh  = new THREE.Color('#8a8076');
function groundColorAt(d, out){
  var n1 = snoise3(d.x*2.4 + 9.1, d.y*2.4, d.z*2.4);
  var n2 = snoise3(d.x*6.2, d.y*6.2 + 3.7, d.z*6.2);
  var n3 = snoise3(d.x*13.0, d.y*13.0, d.z*13.0 + 5.2);
  out.copy(_gSand).lerp(_gPale, clamp(n1*1.15, 0, 1)*0.75);
  out.lerp(_gDark, clamp((n2 - 0.45)*1.6, 0, 1)*0.30);
  out.lerp(_gMoss, sstep(0.52, 0.96, d.dot(OASIS_DIR))*0.62);
  out.lerp(_gAsh,  sstep(0.55, 0.97, d.dot(ASH_DIR))*0.78);
  return out.multiplyScalar(0.965 + n3*0.07);
}

function buildTiles(){
  var geo = new THREE.IcosahedronGeometry(PLANET_R, TILE_DETAIL);
  var pos = geo.attributes.position;
  var triN = pos.count/3;
  var vmap = Object.create(null);

  function vid(x,y,z){
    var k = x.toFixed(4)+'|'+y.toFixed(4)+'|'+z.toFixed(4);
    var id = vmap[k];
    if (id === undefined){
      id = tileVerts.length;
      tileVerts.push(new V3(x,y,z).normalize());
      vmap[k] = id;
    }
    return id;
  }

  var raw = [];
  for (var t=0;t<triN;t++){
    var ia = vid(pos.getX(t*3),   pos.getY(t*3),   pos.getZ(t*3));
    var ib = vid(pos.getX(t*3+1), pos.getY(t*3+1), pos.getZ(t*3+1));
    var ic = vid(pos.getX(t*3+2), pos.getY(t*3+2), pos.getZ(t*3+2));
    raw.push([ia, ib, ic]);
  }
  geo.dispose();

  var tmp = new THREE.Color();
  var cd = new V3();

  for (var i=0;i<raw.length;i++){
    var A = tileVerts[raw[i][0]], B = tileVerts[raw[i][1]], C = tileVerts[raw[i][2]];
    cd.copy(A).add(B).add(C).normalize();
    groundColorAt(cd, tmp);
    tiles.push({ v: raw[i], c: cd.clone(), col: tmp.clone(), h: 0, removed: false, nbr: [-1,-1,-1] });
  }

  /* 邻接：边 k 是 v[(k+1)%3]-v[(k+2)%3]，对面就是 v[k] */
  var edgeMap = Object.create(null);
  for (var tt=0; tt<tiles.length; tt++){
    var V = tiles[tt].v;
    for (var k=0;k<3;k++){
      var i0 = V[(k+1)%3], i1 = V[(k+2)%3];
      var key = i0 < i1 ? i0+'_'+i1 : i1+'_'+i0;
      var arr = edgeMap[key] || (edgeMap[key] = []);
      arr.push(tt*3 + k);
    }
  }
  for (var key2 in edgeMap){
    var e = edgeMap[key2];
    if (e.length === 2){
      var t0 = Math.floor(e[0]/3), k0 = e[0]%3;
      var t1 = Math.floor(e[1]/3), k1 = e[1]%3;
      tiles[t0].nbr[k0] = t1;
      tiles[t1].nbr[k1] = t0;
    }
  }

  /* 双面：挖穿之后能从洞里看见星球另一侧的内壁。地表改平滑着色，不再一块块三角面 */
  var mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, flatShading: false, side: THREE.DoubleSide });
  baseGeo = new THREE.BufferGeometry();
  baseGeo.setAttribute('position', new THREE.Float32BufferAttribute([], 3));
  baseGeo.setAttribute('color', new THREE.Float32BufferAttribute([], 3));
  baseMesh = new THREE.Mesh(baseGeo, mat);
  baseMesh.name = 'base';
  scene.add(baseMesh);

  var mat2 = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, flatShading: true, side: THREE.DoubleSide });
  overGeo = new THREE.BufferGeometry();
  overGeo.setAttribute('position', new THREE.Float32BufferAttribute([], 3));
  overGeo.setAttribute('color', new THREE.Float32BufferAttribute([], 3));
  overMesh = new THREE.Mesh(overGeo, mat2);
  overMesh.name = 'over';
  scene.add(overMesh);

  /* ---- 实心内核：挖开/挖穿看到的是更深的土，不是虚空 ---- */
  var cg = new THREE.IcosahedronGeometry(CORE_R, 3);
  var cp = cg.getAttribute('position');
  var cc = [];
  var cA = new THREE.Color('#6b533a'), cB = new THREE.Color('#57422e'),
      cC = new THREE.Color('#453425'), cD = new THREE.Color('#33281d');
  for (var ci=0; ci<cp.count; ci+=3){
    var mx = (cp.getX(ci)+cp.getX(ci+1)+cp.getX(ci+2))/3;
    var my = (cp.getY(ci)+cp.getY(ci+1)+cp.getY(ci+2))/3;
    var mz = (cp.getZ(ci)+cp.getZ(ci+1)+cp.getZ(ci+2))/3;
    var t = clamp((my/CORE_R)*0.5+0.5, 0, 1);          /* 上 -> 下 */
    var band = t < 0.30 ? cA : t < 0.52 ? cB : t < 0.74 ? cC : cD;
    var gn = 0.86 + 0.30*vhash(ci*0.37, t*3.1, mx*2.3); /* 颗粒感 */
    for (var q=0;q<3;q++) cc.push(band.r*gn, band.g*gn, band.b*gn);
  }
  cg.setAttribute('color', new THREE.Float32BufferAttribute(cc, 3));
  cg.computeVertexNormals();
  coreMesh = new THREE.Mesh(cg, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 1, metalness: 0, flatShading: true,
    side: THREE.DoubleSide, emissive: new THREE.Color('#1d150e'), emissiveIntensity: 0.55
  }));
  coreMesh.name = 'core';
  scene.add(coreMesh);
}
buildTiles();

var soilTmp = new THREE.Color();
/* 土层：越深颜色越沉、越暗，挖开能看出层 */
function soilColor(h){
  var d = -h;
  if (h > 0) return soilTmp.setStyle('#8a6a45');
  if (d < 0.34) return soilTmp.setStyle('#6d4f33');   /* 表土 */
  if (d < 0.70) return soilTmp.setStyle('#7b5a39');   /* 亚层土 */
  if (d < 1.10) return soilTmp.setStyle('#8a7150');   /* 碎石层 */
  if (d < 1.50) return soilTmp.setStyle('#6b6155');   /* 岩层 */
  if (d < 2.10) return soilTmp.setStyle('#4e463c');   /* 深岩 */
  return soilTmp.setStyle('#3a322a');                  /* 基岩 */
}

/* 连续土色：从表土到基岩平滑过渡，避免一层一层的大色片 */
var _soilStops = [
  [0.00, new THREE.Color('#5b3d22')],
  [0.17, new THREE.Color('#6a4928')],
  [0.35, new THREE.Color('#7b5b38')],
  [0.54, new THREE.Color('#5e4c37')],
  [0.76, new THREE.Color('#4a3a29')],
  [1.05, new THREE.Color('#342618')]
];
function soilGrad(depth, out){
  var d = clamp(depth / DIG_DEPTH_MAX, 0, 1.05);
  for (var i=1;i<_soilStops.length;i++){
    if (d <= _soilStops[i][0]){
      var a = _soilStops[i-1], b = _soilStops[i];
      var t = (d - a[0]) / (b[0] - a[0]);
      return out.copy(a[1]).lerp(b[1], clamp(t, 0, 1));
    }
  }
  return out.copy(_soilStops[_soilStops.length-1][1]);
}

/* 落在圆口内的地面顶点：沿大圆推到坑沿（半径 CR_R）上，口沿才是圆的 */
var _COS_IN = Math.cos((CR_R * 0.985) / PLANET_R);
var _snA = new V3(), _snT = new V3();
function snapToCraterRim(d){
  for (var i=0;i<craters.length;i++){
    var cr = craters[i];
    if (cr.c.dot(d) <= _COS_IN) continue;
    _snA.crossVectors(cr.c, d);
    if (_snA.lengthSq() < 1e-8) _snA.set(1, 0, 0).cross(cr.c);
    _snA.normalize();
    var t = CR_R / PLANET_R;
    _snT.copy(cr.c).multiplyScalar(Math.cos(t)).addScaledVector(_snA, Math.sin(t)).normalize();
    d.copy(_snT);
    return true;
  }
  return false;
}

function rebuildBase(){
  var p = [], c = [];
  var R = PLANET_R;
  var _sc = new THREE.Color();
  var _tA = new V3(), _tB = new V3(), _tC = new V3();

  /* 坑口附近自适应细分：细分到约 0.17 单位再贴沿，口沿才是一个圆而不是几个长直边 */
  function nearCrater(A, B, C, e){
    for (var i=0;i<craters.length;i++){
      var lim = Math.cos(Math.min(Math.PI, e * 0.8 + (CR_R * 1.8) / R));
      var cc = craters[i].c;
      if (cc.dot(A) > lim || cc.dot(B) > lim || cc.dot(C) > lim) return true;
    }
    return false;
  }
  function pushTri(A, B, C){
    _tA.copy(A); _tB.copy(B); _tC.copy(C);
    var inA = snapToCraterRim(_tA), inB = snapToCraterRim(_tB), inC = snapToCraterRim(_tC);
    if (inA && inB && inC) return;         /* 整块都在圆口里：不铺地面，露出坑壁 */
    p.push(_tA.x*R, _tA.y*R, _tA.z*R, _tB.x*R, _tB.y*R, _tB.z*R, _tC.x*R, _tC.y*R, _tC.z*R);
    /* 每个顶点自己算色：相邻三角形共用同一方向 → 颜色连续，没有拼贴接缝 */
    groundColorAt(_tA, _sc); c.push(_sc.r, _sc.g, _sc.b);
    groundColorAt(_tB, _sc); c.push(_sc.r, _sc.g, _sc.b);
    groundColorAt(_tC, _sc); c.push(_sc.r, _sc.g, _sc.b);
  }
  /* 坑口附近自适应细分：细分到 0.17 单位再贴沿，口沿才是一个圆而不是几个长直边 */
  /* A/B/C 是单位方向，边长按弧度算：0.17 / R ≈ 0.011 */
  function splitTri(A, B, C, d){
    var e = Math.max(A.distanceTo(B), B.distanceTo(C), C.distanceTo(A));
    if (d >= 5 || e <= 0.17 / R || !nearCrater(A, B, C, e)){ pushTri(A, B, C); return; }
    var mAB = A.clone().add(B).normalize();
    var mBC = B.clone().add(C).normalize();
    var mCA = C.clone().add(A).normalize();
    splitTri(A, mAB, mCA, d + 1);
    splitTri(mAB, B, mBC, d + 1);
    splitTri(mCA, mBC, C, d + 1);
    splitTri(mAB, mBC, mCA, d + 1);
  }
  for (var i=0;i<tiles.length;i++){
    var T = tiles[i];
    if (T.removed || T.h !== 0) continue;
    splitTri(tileVerts[T.v[0]], tileVerts[T.v[1]], tileVerts[T.v[2]], 0);
  }
  baseGeo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  baseGeo.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
  /* 法线直接取球面径向：整颗星球平滑受光，不再按三角形切面明暗 */
  var nrm = new Float32Array(p.length);
  for (var ni=0; ni<p.length; ni+=3){
    var _l = Math.sqrt(p[ni]*p[ni] + p[ni+1]*p[ni+1] + p[ni+2]*p[ni+2]) || 1;
    nrm[ni] = p[ni]/_l; nrm[ni+1] = p[ni+1]/_l; nrm[ni+2] = p[ni+2]/_l;
  }
  baseGeo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  baseGeo.computeBoundingSphere();
}

function rebuildOverlay(){
  var p = [], c = [];
  var R = PLANET_R;
  for (var i=0;i<tiles.length;i++){
    var T = tiles[i];
    if (T.removed || T.h === 0) continue;
    var A = tileVerts[T.v[0]], B = tileVerts[T.v[1]], C = tileVerts[T.v[2]];
    var rT = R + T.h;
    /* 顶面倒角 + 拆分：土堆从侧壁转到顶面不再是一个 90° 硬边，
       顶面也不再是“一整块大三角”，贴近看不会整屏一块土色面片 */
    var lip = Math.min(0.10, Math.max(0.028, T.h * 0.09));
    var rLip = rT - lip;
    var topC = soilColor(T.h), lipC = soilColor(T.h - lip);
    var cen = new V3().copy(A).add(B).add(C).normalize();
    var iA = new V3().copy(A).lerp(cen, 0.17).normalize();
    var iB = new V3().copy(B).lerp(cen, 0.17).normalize();
    var iC = new V3().copy(C).lerp(cen, 0.17).normalize();
    var gTop = 0.95 + 0.10*vhash(i * 0.37, T.h * 2.3, 5.9);
    var gLip = 0.90 + 0.14*vhash(i * 0.71, T.h * 1.7, 2.3);
    (function(tr, tg, tb, lr, lg, lb){
      /* 倒角环 */
      p.push(A.x*rLip, A.y*rLip, A.z*rLip, B.x*rLip, B.y*rLip, B.z*rLip, iB.x*rT, iB.y*rT, iB.z*rT);
      c.push(lr,lg,lb, lr,lg,lb, lr,lg,lb);
      p.push(A.x*rLip, A.y*rLip, A.z*rLip, iB.x*rT, iB.y*rT, iB.z*rT, iA.x*rT, iA.y*rT, iA.z*rT);
      c.push(lr,lg,lb, lr,lg,lb, lr,lg,lb);
      p.push(B.x*rLip, B.y*rLip, B.z*rLip, C.x*rLip, C.y*rLip, C.z*rLip, iC.x*rT, iC.y*rT, iC.z*rT);
      c.push(lr,lg,lb, lr,lg,lb, lr,lg,lb);
      p.push(B.x*rLip, B.y*rLip, B.z*rLip, iC.x*rT, iC.y*rT, iC.z*rT, iB.x*rT, iB.y*rT, iB.z*rT);
      c.push(lr,lg,lb, lr,lg,lb, lr,lg,lb);
      p.push(C.x*rLip, C.y*rLip, C.z*rLip, A.x*rLip, A.y*rLip, A.z*rLip, iA.x*rT, iA.y*rT, iA.z*rT);
      c.push(lr,lg,lb, lr,lg,lb, lr,lg,lb);
      p.push(C.x*rLip, C.y*rLip, C.z*rLip, iA.x*rT, iA.y*rT, iA.z*rT, iC.x*rT, iC.y*rT, iC.z*rT);
      c.push(lr,lg,lb, lr,lg,lb, lr,lg,lb);
      /* 顶面：绕中心拆成 3 块，中心微微隆起 */
      var mR = rT + 0.018;
      p.push(cen.x*mR, cen.y*mR, cen.z*mR, iA.x*rT, iA.y*rT, iA.z*rT, iB.x*rT, iB.y*rT, iB.z*rT);
      c.push(tr,tg,tb, tr,tg,tb, tr,tg,tb);
      p.push(cen.x*mR, cen.y*mR, cen.z*mR, iB.x*rT, iB.y*rT, iB.z*rT, iC.x*rT, iC.y*rT, iC.z*rT);
      c.push(tr,tg,tb, tr,tg,tb, tr,tg,tb);
      p.push(cen.x*mR, cen.y*mR, cen.z*mR, iC.x*rT, iC.y*rT, iC.z*rT, iA.x*rT, iA.y*rT, iA.z*rT);
      c.push(tr,tg,tb, tr,tg,tb, tr,tg,tb);
    })(topC.r*gTop, topC.g*gTop, topC.b*gTop, lipC.r*gLip, lipC.g*gLip, lipC.b*gLip);

    for (var k=0;k<3;k++){
      var j = T.nbr[k];
      if (j < 0) continue;
      if (tiles[j].removed) continue;         /* 打通的位置不砌墙 */
      var hN = tiles[j].h;
      var i0 = T.v[(k+1)%3], i1 = T.v[(k+2)%3];
      var a1 = tileVerts[i0], a2 = tileVerts[i1];
      /* 接缝兜底：邻格被打成圆坑时，墙要一直落到坑面，
         否则墙底和坑口之间会露出一条缝隙（从侧面能看穿） */
      var eMid = new V3().copy(a1).add(a2).normalize();
      for (var cj=0; cj<craters.length; cj++){
        var crj = craters[cj];
        var angE = Math.acos(clamp(eMid.dot(crj.c), -1, 1)) * PLANET_R;
        if (angE < CR_R){
          var sE = PLANET_R - craterDepth(crj, angE / CR_R);
          if (sE - R < hN) hN = sE - R;
        }
      }
      if (hN >= T.h - lip - 1e-4) continue;
      var wallTop = T.h - lip;
      /* 按土层分带砌墙：挖下去能看出一层一层的截面 */
      var y = hN;
      while (y < wallTop - 1e-4){
        var y2 = Math.min(wallTop, y + DIG_STEP);
        var sc = soilColor((y + y2) * 0.5);
        var gn = 0.84 + 0.30*vhash(i * 0.31 + k, y2 * 3.7, i0 * 0.13);
        var rA = R + y, rB = R + y2;
        var sr = sc.r*gn, sg = sc.g*gn, sb = sc.b*gn;
        p.push(a1.x*rA, a1.y*rA, a1.z*rA, a2.x*rA, a2.y*rA, a2.z*rA, a2.x*rB, a2.y*rB, a2.z*rB);
        c.push(sr,sg,sb, sr,sg,sb, sr,sg,sb);
        p.push(a1.x*rA, a1.y*rA, a1.z*rA, a2.x*rB, a2.y*rB, a2.z*rB, a1.x*rB, a1.y*rB, a1.z*rB);
        c.push(sr,sg,sb, sr,sg,sb, sr,sg,sb);
        y = y2;
      }
    }
  }

  /* ---- 挖穿的格子：补一圈向内收口的土层侧壁 + 洞底 ----
     之前对 removed 直接 continue，洞壁完全是空的，能直接看到球心方向；
     现在按邻格高度砌到坑底，并稍微向内收，形成“土壁收口”的坑道。 */
  var H_BOT = -DIG_DEPTH_MAX - 0.45;
  var _fa = new V3(), _fb = new V3(), _fc = new V3(), _fd = new V3();
  function taper(v, cc, s){
    return v.clone().multiplyScalar(1 - s).addScaledVector(cc, s).normalize();
  }
  for (var ri=0; ri<tiles.length; ri++){
    var RT = tiles[ri];
    if (!RT.removed) continue;
    var cc = RT.c;
    for (var rk=0; rk<3; rk++){
      var rj = RT.nbr[rk];
      if (rj >= 0 && tiles[rj].removed) continue;      /* 相邻也是洞，敞开连通 */
      var hTop = (rj >= 0) ? tiles[rj].h : 0;
      if (hTop <= H_BOT + 1e-4) continue;
      var e0 = tileVerts[RT.v[(rk+1)%3]], e1 = tileVerts[RT.v[(rk+2)%3]];
      var yy = hTop;
      while (yy > H_BOT + 1e-4){
        var yy2 = Math.max(H_BOT, yy - DIG_STEP);
        var f0 = (hTop - yy) / (hTop - H_BOT);
        var f1 = (hTop - yy2) / (hTop - H_BOT);
        var s0 = 0.52*f0, s1 = 0.52*f1;
        _fa.copy(taper(e0, cc, s0)); _fb.copy(taper(e1, cc, s0));
        _fc.copy(taper(e0, cc, s1)); _fd.copy(taper(e1, cc, s1));
        var rAA = R + yy, rBB = R + yy2;
        var sc2 = soilColor((yy + yy2) * 0.5);
        var gn2 = 0.82 + 0.32*vhash(ri * 0.23 + rk, yy2 * 4.1, s1 * 9.7);
        var sr2 = sc2.r*gn2, sg2 = sc2.g*gn2, sb2 = sc2.b*gn2;
        p.push(_fa.x*rAA, _fa.y*rAA, _fa.z*rAA, _fb.x*rAA, _fb.y*rAA, _fb.z*rAA, _fd.x*rBB, _fd.y*rBB, _fd.z*rBB);
        c.push(sr2,sg2,sb2, sr2,sg2,sb2, sr2,sg2,sb2);
        p.push(_fa.x*rAA, _fa.y*rAA, _fa.z*rAA, _fd.x*rBB, _fd.y*rBB, _fd.z*rBB, _fc.x*rBB, _fc.y*rBB, _fc.z*rBB);
        c.push(sr2,sg2,sb2, sr2,sg2,sb2, sr2,sg2,sb2);
        yy = yy2;
      }
    }
    /* 洞底封口：暗色土，避免从洞口直接看穿到内核 */
    var bA = taper(tileVerts[RT.v[0]], cc, 0.52), bB = taper(tileVerts[RT.v[1]], cc, 0.52), bC = taper(tileVerts[RT.v[2]], cc, 0.52);
    var rb = R + H_BOT;
    var bg = 0.72 + 0.18*vhash(ri*0.61, 3.3, 1.7);
    var bc = soilColor(H_BOT - 0.01);
    var br = bc.r*bg, bgc = bc.g*bg, bbc = bc.b*bg;
    p.push(bA.x*rb, bA.y*rb, bA.z*rb, bB.x*rb, bB.y*rb, bB.z*rb, bC.x*rb, bC.y*rb, bC.z*rb);
    c.push(br,bgc,bbc, br,bgc,bbc, br,bgc,bbc);
  }
  /* ---- 圆坑：碗形坑壁 + 口沿碎土 ----
     以前一个格子整块三角面塌下去：坑口是直角长直边、层级像大色片，还占掉半屏。
     现在按“圆心 + 半径 CR_R”的碗形剖面画，口沿是圆的，边缘撒一圈碎土块做过渡。 */
  var H_BOT2 = -DIG_DEPTH_MAX - 0.45;
  var _ct1 = new V3(), _ct2 = new V3(), _cg = new THREE.Color();
  var _cl0 = new V3(), _cl1 = new V3(), _cl2 = new V3(), _cl3 = new V3();
  var SEG = 24, RING = 8;
  for (var ci2=0; ci2<craters.length; ci2++){
    var CR = craters[ci2];
    _ct1.set(0,1,0).cross(CR.c);
    if (_ct1.lengthSq() < 1e-3) _ct1.set(1,0,0);
    _ct1.normalize();
    _ct2.crossVectors(CR.c, _ct1).normalize();
    var rows = [];
    var uList = [];
    for (var rg0=0; rg0<=RING; rg0++) uList.push(rg0 / RING);
    uList.push(1 + 0.11 / CR_R);        /* 平沿：压到地表下，盖住裁圆后地面开孔的毛边 */
    for (var rg=0; rg<uList.length; rg++){
      var u = uList[rg];
      var arc = u * CR_R / R;
      var row = [];
      for (var sg=0; sg<SEG; sg++){
        var th = sg / SEG * Math.PI * 2;
        var dir = new V3().copy(CR.c).multiplyScalar(Math.cos(arc))
          .addScaledVector(_ct1, Math.sin(arc)*Math.cos(th))
          .addScaledVector(_ct2, Math.sin(arc)*Math.sin(th)).normalize();
        var dep = u <= 1 ? craterDepth(CR, u) : 0;
        var rr = R - dep - (u > 1 ? 0.002 : (u >= 1 ? 0.004 : 0));
        soilGrad(dep, _cg);
        var gn3 = 0.96 + 0.08*vhash(ci2*0.7 + rg, sg*0.9, 4.3);
        row.push({ dir: dir, r: rr, cr: _cg.r*gn3, cg: _cg.g*gn3, cb: _cg.b*gn3 });
      }
      rows.push(row);
    }
    var startRing = CR.p ? Math.round(CR_PUNCH * RING) : 0;
    for (var rg2=startRing; rg2<uList.length-1; rg2++){
      var r0 = rows[rg2], r1 = rows[rg2+1];
      for (var sg2=0; sg2<SEG; sg2++){
        var s2 = (sg2+1) % SEG;
        var a0 = r0[sg2], a1 = r0[s2], b0 = r1[sg2], b1 = r1[s2];
        p.push(a0.dir.x*a0.r, a0.dir.y*a0.r, a0.dir.z*a0.r,
               a1.dir.x*a1.r, a1.dir.y*a1.r, a1.dir.z*a1.r,
               b1.dir.x*b1.r, b1.dir.y*b1.r, b1.dir.z*b1.r);
        c.push(a0.cr,a0.cg,a0.cb, a1.cr,a1.cg,a1.cb, b1.cr,b1.cg,b1.cb);
        p.push(a0.dir.x*a0.r, a0.dir.y*a0.r, a0.dir.z*a0.r,
               b1.dir.x*b1.r, b1.dir.y*b1.r, b1.dir.z*b1.r,
               b0.dir.x*b0.r, b0.dir.y*b0.r, b0.dir.z*b0.r);
        c.push(a0.cr,a0.cg,a0.cb, b1.cr,b1.cg,b1.cb, b0.cr,b0.cg,b0.cb);
      }
    }
    /* 挖穿：中间再往下接一段收口的井壁 + 洞底，不是直接露虚空 */
    if (CR.p){
      var topRow = rows[startRing];
      var yTop = R - craterDepth(CR, CR_PUNCH);
      var yBot = R + H_BOT2;
      var yy = yTop;
      while (yy > yBot + 1e-4){
        var yy2 = Math.max(yBot, yy - DIG_STEP);
        var f0 = (yTop - yy) / (yTop - yBot), f1 = (yTop - yy2) / (yTop - yBot);
        var q0 = 1 - 0.34*f0, q1 = 1 - 0.34*f1;
        soilGrad(-((yy + yy2)*0.5 - R), _cg);
        for (var sg3=0; sg3<SEG; sg3++){
          var s3 = (sg3+1) % SEG;
          var A0 = topRow[sg3].dir, A1 = topRow[s3].dir;
          var gn4 = 0.80 + 0.24*vhash(ci2*0.9 + sg3, yy2*3.1, 1.9);
          var cr4 = _cg.r*gn4, cg4 = _cg.g*gn4, cb4 = _cg.b*gn4;
          p.push(A0.x*yy*q0, A0.y*yy*q0, A0.z*yy*q0,
                 A1.x*yy*q0, A1.y*yy*q0, A1.z*yy*q0,
                 A1.x*yy2*q1, A1.y*yy2*q1, A1.z*yy2*q1);
          c.push(cr4,cg4,cb4, cr4,cg4,cb4, cr4,cg4,cb4);
          p.push(A0.x*yy*q0, A0.y*yy*q0, A0.z*yy*q0,
                 A1.x*yy2*q1, A1.y*yy2*q1, A1.z*yy2*q1,
                 A0.x*yy2*q1, A0.y*yy2*q1, A0.z*yy2*q1);
          c.push(cr4,cg4,cb4, cr4,cg4,cb4, cr4,cg4,cb4);
        }
        yy = yy2;
      }
      soilGrad(-H_BOT2, _cg);
      var bg2 = 0.66 + 0.18*vhash(ci2*0.5, 1.1, 7.3);
      var bcr = _cg.r*bg2, bcg = _cg.g*bg2, bcb = _cg.b*bg2;
      for (var sg4=0; sg4<SEG; sg4++){
        var s4 = (sg4+1) % SEG;
        var D0 = topRow[sg4].dir, D1 = topRow[s4].dir;
        p.push(CR.c.x*yBot*0.66, CR.c.y*yBot*0.66, CR.c.z*yBot*0.66,
               D0.x*yBot*0.66, D0.y*yBot*0.66, D0.z*yBot*0.66,
               D1.x*yBot*0.66, D1.y*yBot*0.66, D1.z*yBot*0.66);
        c.push(bcr,bcg,bcb, bcr,bcg,bcb, bcr,bcg,bcb);
      }
    }
    /* 口沿碎土：一圈大小不一的小土块，让圆口边缘有过渡 */
    var CN = 20;
    for (var ck=0; ck<CN; ck++){
      var th2 = (ck + 0.18 + 0.6*vhash(ci2, ck, 3.7)) / CN * Math.PI * 2;
      var uu = 0.88 + 0.16*vhash(ci2*1.3, ck*0.7, 5.1);
      var arc2 = uu * CR_R / R;
      var dirC = new V3().copy(CR.c).multiplyScalar(Math.cos(arc2))
        .addScaledVector(_ct1, Math.sin(arc2)*Math.cos(th2))
        .addScaledVector(_ct2, Math.sin(arc2)*Math.sin(th2)).normalize();
      var dep2 = uu < 1 ? craterDepth(CR, uu) : 0;
      var baseR = R - dep2;
      var sz = 0.035 + 0.055*vhash(ck*1.7, ci2, 2.9);
      var hgt = sz * (0.7 + 1.1*vhash(ck*0.3, 3.1, ci2));
      _cl0.copy(dirC).multiplyScalar(baseR);
      _cl1.set(0,1,0).cross(dirC);
      if (_cl1.lengthSq() < 1e-4) _cl1.set(1,0,0);
      _cl1.normalize();
      _cl2.crossVectors(dirC, _cl1).normalize();
      _cl3.copy(_cl0).addScaledVector(dirC, hgt);
      soilGrad(dep2 + 0.06, _cg);
      var gn5 = 1.35 + 0.25*vhash(ck*2.1, ci2*0.6, 8.1);
      var r5 = _cg.r*gn5, g5 = _cg.g*gn5, b5 = _cg.b*gn5;
      for (var e=0;e<3;e++){
        var ea = e/3*Math.PI*2, eb = (e+1)/3*Math.PI*2;
        var q1p = _cl0.clone().addScaledVector(_cl1, Math.cos(ea)*sz).addScaledVector(_cl2, Math.sin(ea)*sz);
        var q2p = _cl0.clone().addScaledVector(_cl1, Math.cos(eb)*sz).addScaledVector(_cl2, Math.sin(eb)*sz);
        p.push(_cl3.x,_cl3.y,_cl3.z, q1p.x,q1p.y,q1p.z, q2p.x,q2p.y,q2p.z);
        c.push(r5,g5,b5, r5,g5,b5, r5,g5,b5);
      }
    }
  }
  overGeo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  overGeo.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
  overGeo.computeVertexNormals();
  overGeo.computeBoundingSphere();
}

/* 地表“面片”的真实半径：球面换成三角面后，面片比 PLANET_R 低一点点，
   玫瑰/花园要是按 PLANET_R 摆就会浮空，所以直接对着地形打一条射线量。 */
var _surfRay = new THREE.Raycaster();
function surfaceRadiusAt(dir){
  _surfRay.set(dir.clone().multiplyScalar(PLANET_R + 2.5), dir.clone().negate());
  _surfRay.near = 0; _surfRay.far = 4.2;
  var hs = _surfRay.intersectObjects([baseMesh, overMesh], false);
  if (hs.length) return PLANET_R + 2.5 - hs[0].distance;
  var g = groundRadiusAt(dir);
  return g > 0 ? g : PLANET_R;
}
var plantedProps = [];
function reseatPlanted(){
  for (var i=0;i<plantedProps.length;i++){
    var pp = plantedProps[i];
    pp.obj.position.copy(pp.dir).multiplyScalar(surfaceRadiusAt(pp.dir) + pp.offset);
  }
}

var _lastTile = -1, _lastTileDir = new V3(0,0,1);
function findTile(dir){
  if (_lastTile >= 0 && _lastTileDir.dot(dir) > 0.9998) return _lastTile;
  var best = 0, bd = -2;
  for (var i=0;i<tiles.length;i++){
    var d = tiles[i].c.dot(dir);
    if (d > bd){ bd = d; best = i; }
  }
  _lastTile = best;
  _lastTileDir.copy(dir);
  return best;
}
/* 不吃缓存的精确查格：机位兜底不能因为缓存停在上一格上 */
function findTileExact(dir){
  var best = 0, bd = -2;
  for (var i=0;i<tiles.length;i++){
    var d = tiles[i].c.dot(dir);
    if (d > bd){ bd = d; best = i; }
  }
  return best;
}
/* 这一方向上“土的最高点”：含自身和三邻格，避免站在格边时算漏掉旁边的土柱 */
function camSoilTopAt(dir){
  var i = findTileExact(dir);
  var mx = PLANET_R + Math.max(0, tiles[i].h);
  for (var k=0;k<3;k++){
    var j = tiles[i].nbr[k];
    if (j >= 0) mx = Math.max(mx, PLANET_R + Math.max(0, tiles[j].h));
  }
  /* 水井/灯塔这类实心道具也算“顶面”，镜头不许停在它们的身体里 */
  if (solids){
    for (var si=0; si<solids.length; si++){
      var s = solids[si];
      if (s.kind === 'sheep') continue;
      if (s.kind === 'baobab' && (!s.ref || !s.ref.alive)) continue;
      if (Math.acos(clamp(dir.dot(s.up), -1, 1)) * PLANET_R < s.r0 + 0.10)
        mx = Math.max(mx, s.c.length() + s.h + 0.06);
    }
  }
  return Math.max(mx, camGroundRadiusAt(dir));
}

/* 坑的深度剖面：中间是平的坑底（够站人），外圈是收口的坑壁 */
function craterDepth(cr, u){
  var t = clamp((u - 0.5) * 2, 0, 1);
  return cr.d * (1 - t*t*(3 - 2*t));
}

/* 脚下地表的半径；挖穿（没有支撑）返回 -1 */
function groundRadiusAt(dir){
  var T = tiles[findTile(dir)];
  var base = T.removed ? -1 : PLANET_R + T.h;
  for (var i=0;i<craters.length;i++){
    var cr = craters[i];
    var ang = Math.acos(clamp(dir.dot(cr.c), -1, 1)) * PLANET_R;
    if (ang >= CR_R) continue;
    var u = ang / CR_R;
    if (cr.p && u < CR_PUNCH) return -1;              /* 挖穿的通洞 */
    var s = PLANET_R - craterDepth(cr, u);            /* 平底 + 收口坑壁 */
    if (s < base) base = s;
  }
  /* 造出来的石阶/土墙/木桥：踩得上去，也挡得住人 */
  if (typeof PARTS !== 'undefined' && PARTS.length && base > 0){
    for (var pi=0; pi<PARTS.length; pi++){
      var P = PARTS[pi];
      var pa = Math.acos(clamp(dir.dot(P.dir), -1, 1)) * PLANET_R;
      if (pa > P.r) continue;
      var top = P.g + P.h;
      if (top > base) base = top;
    }
  }
  return base;
}

/* 圆坑表面：返回该方向的坑面半径（负数 = 通洞） */
function craterRadiusAt(cr, dir){
  var ang = Math.acos(clamp(dir.dot(cr.c), -1, 1)) * PLANET_R;
  if (ang >= CR_R) return -1;
  var u = ang / CR_R;
  if (cr.p && u < CR_PUNCH) return -1;
  return PLANET_R - craterDepth(cr, u);
}

/* 脚下这处圆坑有多深（挖穿也算），给“坑内自动抬机位”用 */
function craterDepthUnder(dir){
  var deepest = 0;
  for (var i=0;i<craters.length;i++){
    var cr = craters[i];
    var ang = Math.acos(clamp(dir.dot(cr.c), -1, 1)) * PLANET_R;
    if (ang >= CR_R) continue;
    var dep = craterDepth(cr, ang / CR_R);
    if (dep > deepest) deepest = dep;
  }
  return deepest;
}

/* 镜头专用的地表半径：挖穿的通洞 / 挖空的瓦片对镜头算“有盖”，
   否则镜头会顺着洞钻进星体内部，看到整屏地形背面。 */
function camGroundRadiusAt(dir){
  var gr = groundRadiusAt(dir);
  if (gr > 0) return gr;
  return PLANET_R;
}

/* 镜头遮挡判断：地形瓦片 + 实心建筑/山体
   第三视角下镜头沿“角色头部 -> 期望机位”的线段采样，
   碰到地表或火山/灯塔等实心体就停在前一个安全点，镜头自动收紧。 */
var _occU = new V3(), _occP = new V3();
/* 镜头落进土块体积里时，沿径向顶到这一格的土面之上。
   抬升超过 4.5 的极端高塔不硬顶（否则镜头会瞬间飞到天顶），交给遮挡逻辑。 */
var _liftU = new V3();
function liftCameraOutOfSoil(){
  var cR = camera.position.length();
  if (cR < 1e-4) return;
  _liftU.copy(camera.position).divideScalar(cR);
  var need = camSoilTopAt(_liftU) + 0.26;
  if (cR < need && need - cR <= 4.5){
    camera.position.copy(_liftU).multiplyScalar(need);
  }
}
function cameraBlockedAt(p){
  var d = p.length();
  if (d < 1e-4) return true;
  _occU.copy(p).divideScalar(d);
  var gr = camGroundRadiusAt(_occU);
  if (gr > 0 && d < gr + 0.22) return true;
  for (var i=0;i<solids.length;i++){
    var s = solids[i];
    if (s.kind === 'baobab' && !s.ref.alive) continue;
    if (s.kind === 'sheep') continue;
    var up = s.up;
    var dx = p.x - s.c.x, dy = p.y - s.c.y, dz = p.z - s.c.z;
    var hh = dx*up.x + dy*up.y + dz*up.z;
    if (hh < -0.75 || hh > s.h + 0.45) continue;
    var tx = dx - up.x*hh, ty = dy - up.y*hh, tz = dz - up.z*hh;
    var dd = Math.sqrt(tx*tx + ty*ty + tz*tz);
    if (dd < solidRadiusAt(s, Math.max(hh, 0)) + 0.32) return true;
  }
  return false;
}
function occludeCamera(anchor, target){
  var seg = target.clone().sub(anchor);
  var len = seg.length();
  if (len < 1e-3) return target;
  /* 24 段采样：坑只有 1.4 宽，14 段时最后的安全点会落进坑壁里 */
  var N = 24, good = 0;
  for (var i=1;i<=N;i++){
    var t = i/N;
    _occP.copy(anchor).addScaledVector(seg, t);
    if (cameraBlockedAt(_occP)) break;
    good = t;
  }
  if (good >= 1) return target;
  return anchor.clone().addScaledVector(seg, Math.max(0.08, good - 0.02));
}

var terrainDirty = true;
function markTerrain(){ terrainDirty = true; }
rebuildBase();
rebuildOverlay();
terrainDirty = false;

/* ---------------------------------------------------------------- 大气辉光 */
(function makeAtmo(){
  var atmo = new THREE.Mesh(
    new THREE.SphereGeometry(PLANET_R*1.018, 48, 32),
    new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color('#6f92e8') } },
      side: THREE.BackSide, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: [
        'varying vec3 vN; varying vec3 vV;',
        'void main(){',
        '  vec4 mv = modelViewMatrix * vec4(position,1.0);',
        '  vN = normalize(normalMatrix * normal);',
        '  vV = normalize(-mv.xyz);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform vec3 uColor; varying vec3 vN; varying vec3 vV;',
        'void main(){',
        '  float f = pow(1.0 - max(dot(vN, vV), 0.0), 5.0);',
        '  gl_FragColor = vec4(uColor, f * 0.16);',
        '}'
      ].join('\n')
    })
  );
  atmo.renderOrder = -5;
  scene.add(atmo);
})();

/* ---------------------------------------------------------------- 草丛 / 碎石（实例化，控制绘制次数） */
var tuftMesh = null, tuftData = [];
(function makeTufts(){
  var N = 300;
  var geo = new THREE.ConeGeometry(0.075, 0.26, 4);
  var mat = new THREE.MeshStandardMaterial({ color: new THREE.Color('#8fa06a'), roughness: 1, flatShading: true });
  var mesh = new THREE.InstancedMesh(geo, mat, N);
  var m = new THREE.Matrix4(), qd = new QT(), q1 = new QT(), q2 = new QT();
  var p = new V3(), s = new V3(), d = new V3(), up0 = new V3(0,1,0);
  var col = new THREE.Color();
  var count = 0;
  for (var i=0;i<N*4 && count<N;i++){
    d.set(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1);
    if (d.length() < 0.25) continue;
    d.normalize();
    var mossy = sstep(0.2, 0.9, d.dot(OASIS_DIR));
    if (Math.random() > 0.30 + mossy*0.7) continue;
    qd.setFromUnitVectors(up0, d);
    q1.setFromEuler(new THREE.Euler((Math.random()-0.5)*0.6, Math.random()*6.28, (Math.random()-0.5)*0.6));
    q2.copy(qd).multiply(q1);
    p.copy(d).multiplyScalar(PLANET_R + 0.05);
    var sc = 0.8 + Math.random()*0.8;
    s.set(sc, sc, sc);
    m.compose(p, q2, s);
    mesh.setMatrixAt(count, m);
    col.setStyle('#8fa06a').lerp(new THREE.Color('#b3b984'), Math.random()*0.8);
    mesh.setColorAt(count, col);
    tuftData.push({ dir: d.clone(), sc: sc, rot: q1.clone() });
    count++;
  }
  mesh.count = count;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  scene.add(mesh);
  tuftMesh = mesh;
})();

/* 草跟着地形走：按当前地表半径重新落地、跟着坑壁/坡面转向；被挖掉的地方收掉 */
function updateTufts(){
  if (!tuftMesh) return;
  var m = new THREE.Matrix4(), qd = new QT(), q2 = new QT(), qId = new QT();
  var p = new V3(), bp = new V3(), s = new V3(), n = new V3();
  var e1 = new V3(), e2 = new V3(), a = new V3(), b = new V3();
  var c1 = new V3(), c2 = new V3(), up0 = new V3(0,1,0);
  var eps = 0.16 / PLANET_R;
  for (var i=0;i<tuftData.length;i++){
    var g = tuftData[i];
    var r0 = groundRadiusAt(g.dir);
    var hide = r0 < 0;
    for (var ci=0; !hide && ci<craters.length; ci++){
      var ang = Math.acos(clamp(g.dir.dot(craters[ci].c), -1, 1)) * PLANET_R;
      if (ang < CR_R) hide = true;
    }
    if (hide){
      p.copy(g.dir).multiplyScalar(PLANET_R);
      s.set(0.0001, 0.0001, 0.0001);
      m.compose(p, qId.identity(), s);
      tuftMesh.setMatrixAt(i, m);
      continue;
    }
    /* 用左右两个邻点的高度差估局部法线，让草顺着坡面/坑沿站 */
    a.set(0, 1, 0).cross(g.dir);
    if (a.lengthSq() < 1e-4) a.set(1, 0, 0);
    a.normalize();
    b.crossVectors(g.dir, a).normalize();
    c1.copy(g.dir).addScaledVector(a, eps).normalize();
    c2.copy(g.dir).addScaledVector(b, eps).normalize();
    var r1 = groundRadiusAt(c1), r2 = groundRadiusAt(c2);
    if (r1 < 0) r1 = r0;
    if (r2 < 0) r2 = r0;
    bp.copy(g.dir).multiplyScalar(r0);
    e1.copy(c1).multiplyScalar(r1).sub(bp);
    e2.copy(c2).multiplyScalar(r2).sub(bp);
    n.crossVectors(e1, e2);
    if (n.lengthSq() < 1e-8) n.copy(g.dir);
    else {
      n.normalize();
      if (n.dot(g.dir) < 0) n.negate();
    }
    qd.setFromUnitVectors(up0, n);
    q2.copy(qd).multiply(g.rot);
    p.copy(g.dir).multiplyScalar(r0 + 0.03);
    s.set(g.sc, g.sc, g.sc);
    m.compose(p, q2, s);
    tuftMesh.setMatrixAt(i, m);
  }
  tuftMesh.instanceMatrix.needsUpdate = true;
}

var baobabs = [];
var BAOB_MAX_LV = 4;          /* 4 级 = 成熟线（任务用），不是生长上限 */
var BAOB_LV_K = [0.55, 0.80, 1.06, 1.36, 1.72];   /* 0..4 级对应的整体尺寸倍率 */
/* 成熟线以上继续长：没有硬上限，只是越往后每次长得的比例越小 */
function baobabLvK(lv){
  lv = Math.max(0, lv|0);
  if (lv <= BAOB_MAX_LV) return BAOB_LV_K[lv];
  var extra = lv - BAOB_MAX_LV;
  return BAOB_LV_K[BAOB_MAX_LV] * Math.pow(1 + 0.14 * extra, 0.62);
}
function baobabBaseScale(lv){ return 1.25 * baobabLvK(lv); }
function applyBaobabScale(b, smooth){
  b.tscale = baobabBaseScale(b.lv);
  if (!smooth) b.root.scale.setScalar(b.tscale);
  /* 树越大，挡镜头/挡盖土的半径也跟着长 */
  for (var i=0;i<solids.length;i++){
    var s = solids[i];
    if (s.kind === 'baobab' && s.ref === b){
      s.r0 = Math.max(0.25, 0.20 * b.tscale);
      s.h = Math.max(1.35, 0.78 * b.tscale);
      break;
    }
  }
}
function baobabMaxLv(){
  var m = 0;
  for (var i=0;i<baobabs.length;i++) if (baobabs[i].alive && baobabs[i].lv > m) m = baobabs[i].lv;
  return m;
}
function baobabLvList(){
  var out = [];
  for (var i=0;i<baobabs.length;i++) out.push(baobabs[i].lv|0);
  return out;
}

/* ---------------------------------------------------------------- 实心碰撞体
   统一成“以 dir 为轴、顶面高 h、半径随高度线性变化”的锥台：
   火山用真实的锥体轮廓，柱子/树苗用圆柱（r0≈r1）。
   角色和小羊都走 collideSolids()，贴着表面推出去 = 自然绕行。 */
var solids = [];
function addSolid(dir, offset, h, r0, r1, kind, ref){
  solids.push({
    c: dir.clone().multiplyScalar(PLANET_R + offset),
    up: dir.clone(), h: h, r0: r0, r1: r1,
    kind: kind || '', ref: ref || null
  });
}
function solidRadiusAt(s, y){
  var t = clamp(y / s.h, 0, 1);
  return s.r0 + (s.r1 - s.r0) * t;
}
var _solidPos = new V3(), _solidTmp = new V3();
function collideSolids(pos, radius, ignoreSheep){
  var hit = false;
  for (var i=0;i<solids.length;i++){
    var s = solids[i];
    var up = s.up, cx = s.c.x, cy = s.c.y, cz = s.c.z;
    if (s.kind === 'baobab' && !s.ref.alive) continue;
    if (s.kind === 'sheep'){
      if (ignoreSheep || ride.on) continue;
      up = sheep.up;
      cx = up.x * sheep.r; cy = up.y * sheep.r; cz = up.z * sheep.r;
    }
    var dx = pos.x - cx, dy = pos.y - cy, dz = pos.z - cz;
    var h = dx*up.x + dy*up.y + dz*up.z;
    /* 只按“顶面高度”判定上下边界；不再在 h<-0.55 时整根跳过。
       否则站在坑里（或下落中）会直接从灯塔/水井/火山的底座穿过去。
       侧面碰撞按所在层半径计算，坑内同样有效。 */
    if (h > s.h + 0.02) continue;
    var tx = dx - up.x*h, ty = dy - up.y*h, tz = dz - up.z*h;
    var d = Math.sqrt(tx*tx + ty*ty + tz*tz);
    var rr = solidRadiusAt(s, Math.max(h, 0)) + radius;
    if (d >= rr) continue;
    if (d < 1e-5){
      _solidTmp.set(1,0,0).addScaledVector(up, -up.x);
      if (_solidTmp.lengthSq() < 1e-4) _solidTmp.set(0,0,1).addScaledVector(up, -up.z);
      _solidTmp.normalize();
      tx = _solidTmp.x; ty = _solidTmp.y; tz = _solidTmp.z;
      d = 1;
    }
    var k = rr / d;
    pos.set(cx + up.x*h + tx*k, cy + up.y*h + ty*k, cz + up.z*h + tz*k);
    hit = true;
  }
  return hit;
}

function PM(hex, rough){
  return new THREE.MeshStandardMaterial({ color: new THREE.Color(hex), roughness: rough===undefined?0.9:rough, flatShading: true });
}
function pmSph(r, m, ws, hs){ return new THREE.Mesh(new THREE.SphereGeometry(r, ws||10, hs||8), m); }
function pmCyl(rt, rb, h, seg, m){ return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m); }
function pmCone(r, h, seg, m){ return new THREE.Mesh(new THREE.ConeGeometry(r, h, seg||6), m); }
function pmBox(w, h, d, m){ return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); }
/* 五角星片：商人的星徽 / 账本封面 */
function pmStar(r, depth, m){
  var s = new THREE.Shape();
  for (var i=0;i<10;i++){
    var a = -Math.PI/2 + i*Math.PI/5;
    var rr = (i % 2 === 0) ? r : r*0.44;
    if (i === 0) s.moveTo(Math.cos(a)*rr, Math.sin(a)*rr);
    else s.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
  }
  s.closePath();
  var g = new THREE.ExtrudeGeometry(s, { depth: depth, bevelEnabled: false });
  g.center();
  return new THREE.Mesh(g, m);
}
/* 四肢：轴心在顶端，方便摆腿/挥手 */
function pmLimb(r, len, m){
  var g = new THREE.Group();
  var c = pmCyl(r*0.84, r, len, 5, m);
  c.position.y = -len*0.5;
  g.add(c);
  return g;
}
function pmRig(kind, camH){
  var g = new THREE.Group(), b = new THREE.Group();
  g.add(b);
  return { kind: kind, group: g, body: b, camH: camH, legs: [], arms: [], parts: {}, mats: {} };
}

/* ---- 蛇：盘绕身体、金/黄绿花纹、扁平三角头、竖瞳 ---- */
function buildSnake(){
  var R = pmRig('snake', 0.76);
  var body = R.body;
  var gold = PM('#c9a13b', .58), olive = PM('#8a9a3a', .9), dark = PM('#4d5a2a', .9);
  var eyeM = new THREE.MeshStandardMaterial({
    color: new THREE.Color('#f4cf58'), emissive: new THREE.Color('#8a6400'),
    emissiveIntensity: .45, roughness: .35, flatShading: true
  });
  var pupilM = PM('#171208', .35), tongueM = PM('#c94a55', .8);
  R.mats.scale = gold; R.mats.band = olive;

  /* 一条连续的螺旋：外圈盘进来，再从中心立起脖子，不留接缝 */
  var pts = [], turns = 2.55, N = 150;
  for (var i=0;i<=N;i++){
    var t = i/N;
    var a = t*turns*Math.PI*2 + 2.1;
    var rr = 0.300*(1 - t*0.55);
    pts.push(new V3(Math.cos(a)*rr, 0.050 + t*0.400, Math.sin(a)*rr));
  }
  pts.push(new V3(0.100, 0.505, 0.000));
  pts.push(new V3(-0.020, 0.600, 0.045));
  pts.push(new V3(0.025, 0.700, 0.095));
  pts.push(new V3(0.000, 0.790, 0.135));
  pts.push(new V3(-0.005, 0.845, 0.190));
  var spine = new THREE.CatmullRomCurve3(pts);
  var coil = new THREE.Group();
  coil.add(new THREE.Mesh(new THREE.TubeGeometry(spine, 300, 0.046, 8, false), gold));
  /* 尾尖：接在外圈起点，收成一个尖 */
  var tailP = spine.getPointAt(0.004), tailT = spine.getTangentAt(0.004).negate();
  var tailTip = new THREE.Mesh(new THREE.ConeGeometry(0.046, 0.18, 8), gold);
  tailTip.position.copy(tailP).addScaledVector(tailT, 0.085);
  tailTip.quaternion.setFromUnitVectors(new V3(0,1,0), tailT);
  coil.add(tailTip);
  body.add(coil);
  R.parts.coil = coil;

  /* 背脊上的菱形花纹：橄榄 / 深绿交替，顺着盘圈一路铺到脖子 */
  var plateGeo = new THREE.OctahedronGeometry(0.026, 0);
  for (var pi=0; pi<30; pi++){
    var pt = 0.02 + (pi/29)*0.93;
    var pp = spine.getPointAt(pt), tan = spine.getTangentAt(pt);
    var radial = new V3(pp.x, 0, pp.z);
    if (radial.lengthSq() < 1e-6) radial.set(0, 0, 1);
    radial.normalize();
    if (pt > 0.86) radial.set(0, 0, 1);
    var plate = new THREE.Mesh(plateGeo, pi % 2 ? dark : olive);
    plate.position.copy(pp).addScaledVector(radial, 0.036);
    plate.position.y += 0.008;
    plate.scale.set(0.72, 0.36, 1.30);
    plate.rotation.y = Math.atan2(tan.x, tan.z);
    coil.add(plate);
  }

  /* 扁平三角头：最宽处在头中段，眼睛鼓在两侧，竖瞳贴在外侧 */
  var headG = new THREE.Group();
  headG.position.set(-0.005, 0.876, 0.225);
  body.add(headG);
  R.parts.sway = headG;
  var skull = new THREE.Mesh(new THREE.OctahedronGeometry(0.118, 0), gold);
  skull.scale.set(0.88, 0.44, 1.42);
  headG.add(skull);
  var snout = new THREE.Mesh(new THREE.OctahedronGeometry(0.070, 0), gold);
  snout.scale.set(0.78, 0.40, 1.02);
  snout.position.set(0, -0.002, 0.132);
  headG.add(snout);
  var brow = new THREE.Mesh(new THREE.OctahedronGeometry(0.050, 0), dark);
  brow.scale.set(0.92, 0.20, 1.20);
  brow.position.set(0, 0.040, 0.004);
  headG.add(brow);
  [-1, 1].forEach(function(sx){
    var eye = pmSph(0.028, eyeM, 8, 6);
    eye.position.set(sx*0.072, 0.012, 0.048);
    eye.scale.set(0.90, 1.05, 0.78);
    headG.add(eye);
    var pu = pmBox(0.007, 0.030, 0.010, pupilM);
    pu.position.set(sx*0.092, 0.012, 0.050);
    headG.add(pu);
  });

  /* 分叉舌头 */
  var tongue = new THREE.Group();
  [-0.34, 0.34].forEach(function(a){
    var tb = pmBox(0.007, 0.005, 0.085, tongueM);
    tb.position.set(Math.sin(a)*0.036, 0, 0.042);
    tb.rotation.y = a;
    tongue.add(tb);
  });
  tongue.position.set(0, -0.020, 0.212);
  headG.add(tongue);
  R.parts.tongue = tongue;

  return R;
}

function applyOutfit(name, R, outfitCur){
  var local = !R;
  R = R || rigs[name]; if (!R) return;
  var o = outfitOf(name, outfitCur), rules = OUTFIT_RULES[name] || [];
  for (var ri=0; ri<rules.length; ri++){
    var r = rules[ri], v = o[r.axis], i;
    if (r.k === 'tint'){
      if (r.unless !== undefined && v === r.unless) continue;
      var tm = R.mats[r.mat]; if (!tm) continue;
      var tc = new THREE.Color(v);
      if (r.mul) tc.multiplyScalar(r.mul);
      tm.color.set(tc);
    } else if (r.k === 'show'){
      var sp = R.parts[r.part]; if (!sp) continue;
      var vis = true;
      if (r.on !== undefined) vis = (v === r.on);
      if (r.off !== undefined) vis = (v !== r.off);
      if (r.notAxes){
        for (i=0; i<r.notAxes.length; i++)
          if (o[r.notAxes[i][0]] === r.notAxes[i][1]) vis = false;
      }
      sp.visible = vis;
    } else if (r.k === 'scale'){
      var pp = R.parts[r.part]; if (!pp) continue;
      var sv = parseFloat(v) || 1;
      pp.scale.set(sv, sv, sv);
    } else if (r.k === 'palette'){
      var arr = R.mats[r.mats]; if (!arr) continue;
      var pal = r.map[v]; if (!pal) continue;
      for (i=0; i<arr.length; i++) arr[i].color.set(pal[i % pal.length]);
    } else if (r.k === 'emissive'){
      var em = R.mats[r.mat]; if (!em) continue;
      em.emissiveIntensity = (v === r.off) ? r.offVal : r.onVal;
    } else if (r.k === 'flag'){
      R[r.field] = (v !== r.off);
    }
  }
  if (local) netFull();
}

/* 记录每个角色四肢的基准角度（点灯人举灯的手臂不能被摆臂覆盖掉） */
function rigBase(R){
  if (R._base) return R._base;
  R._base = {
    legX: R.legs.map(function(l){ return l.rotation.x; }),
    legZ: R.legs.map(function(l){ return l.rotation.z; }),
    armX: R.arms.map(function(a){ return a.rotation.x; }),
    armZ: R.arms.map(function(a){ return a.rotation.z; })
  };
  return R._base;

function findNear(){
  var best = null, bestD = 1e9;
  for (var i=0;i<interactables.length;i++){
    var it = interactables[i];
    var d = playerPos.distanceTo(it.pos);
    if (d < it.radius && d < bestD){ bestD = d; best = it; }
  }
  /* 当天长出来的猴面包树苗 */
  for (var j=0;j<baobabs.length;j++){
    var b = baobabs[j];
    if (!b.alive) continue;
    var bd = playerPos.distanceTo(b.pos);
    if (bd < 2.4 && bd < bestD){
      bestD = bd;
      var _grown = (b.lv|0) >= BAOB_MAX_LV;
      best = { type:'baobab', obj: b.root, label:'浇水',
               icon:'water', radius: 2.4, pos: b.pos, ref: b, grown: _grown };
    }
  }
  /* 小羊：没交朋友时“叫它”，交了朋友就能骑 */
  var sd = playerPos.distanceTo(_sheepPos.copy(sheep.up).multiplyScalar(sheep.r));
  if (sd < 2.9 && sd < bestD){
    bestD = sd;
    if (sheep.friend) best = { type:'ride', label:'骑上', icon:'ride', radius: 2.9 };
    else best = { type:'sheep', label:'叫它', icon:'sheep', radius: 2.9 };
  }
  return best;
}

  });

function updateParticles(dt){
  for (var i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.life += dt;
    var t = p.life / p.max;
    if (t >= 1){
      scene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      particles.splice(i,1);
      continue;
    }
    if (!p.vel){
      var a = Math.random()*Math.PI*2;
      var sp = p.chunk ? 2.0 : (p.dust ? 0.6 : (p.spark ? 1.0 : 0.18));
      var tangent = new V3(Math.cos(a), 0, Math.sin(a));
      p.vel = tangent.multiplyScalar(sp*(0.6+Math.random()*0.8))
        .add(p.up.clone().multiplyScalar(p.chunk ? 1.8 : (p.dust ? 0.5 : 1.5)));
    }
    p.mesh.position.addScaledVector(p.vel, dt);
    if (p.chunk){
      p.vel.addScaledVector(p.up, -7.5*dt);
      p.mesh.rotation.x += 6*dt;
      p.mesh.rotation.z += 4*dt;
    } else if (!p.dust){
      p.vel.addScaledVector(p.up, -4.5*dt);
    } else {
      p.vel.multiplyScalar(1 - 2.2*dt);
    }
    p.mesh.material.opacity = (1-t) * (p.dust ? .85 : .9);
    if (!p.chunk) p.mesh.scale.setScalar(1 - t*0.5);
  }
}

var RECIPES = [
  { id:'stair',  name:'石阶', cost:[2,0,1,0], h:0.55, w:0.72, d:0.72, color:'#8d8275',
    desc:'能踩上去的台阶' },

    desc:'铺在坑口上的桥板' }
];
var PARTS = [];   /* 已造出来的物件：{ kind, dir, h, r, g, mesh } */
var _partMats = {};

function craftCostText(cost){
  var out = [];
  for (var i=0;i<4;i++) if (cost[i] > 0) out.push(MAT_NAME[i] + '×' + cost[i]);
  return out.join(' + ');
}
function canCraft(ri){
  var c = RECIPES[ri].cost;
  for (var i=0;i<4;i++) if (state.inv[i] < c[i]) return false;
  return true;
}
function doCraft(ri){
  if (!RECIPES[ri]) return false;
  if (!canCraft(ri)){ toast('材料不够：' + craftCostText(RECIPES[ri].cost) + '。'); return false; }
  var c = RECIPES[ri].cost;
  for (var i=0;i<4;i++) state.inv[i] -= c[i];
  state.parts[ri] = (state.parts[ri]|0) + 1;
  refreshInv(); refreshCraft();
  toast('做好了 1 个' + RECIPES[ri].name + '，点「造」摆到身前。');
  persist();
  return true;
}
/* 造：把做好的物件真正放到身前那格，并成为实心体（挡镜头、可踩） */
function buildPart(ri){
  if (!RECIPES[ri]) return false;
  if ((state.parts[ri]|0) <= 0){ toast('还没有做好的' + RECIPES[ri].name + '，先合成一个。'); return false; }
  if (ride.on){ toast('骑着羊造不了，先下来。'); return false; }
  if (sunset.active){ toast('太阳还没落完，先别动土。'); return false; }
  var def = RECIPES[ri];
  var dir = placeTargetDir();
  var g = groundRadiusAt(dir);
  if (g < 0){ toast('这格是通洞，放不了。'); return false; }
  if (crafterNear(dir, 0.9)){ toast('这里已经有东西了，换个地方。'); return false; }
  if (propAtDir(dir)){ toast('摆设旁边放不下，换个地方。'); return false; }
  if (craterNear(dir, CR_R*0.55)){ toast('坑口上放不稳，先填平或者换个地方。'); return false; }

  var up = dir.clone().normalize();
  var mesh = spawnPartMesh(ri, up, g);
  var r = Math.max(def.w, def.d) * 0.56;
  addSolid(up, 0, def.h, r, r, 'part', null);
  PARTS.push({ kind: ri, dir: up.clone(), h: def.h, r: r, g: g, mesh: mesh });
  state.parts[ri]--;
  state.placed++;
  gainXp(4);
  spawnDust(mesh.position.clone(), up);
  refreshCraft(); refreshInv(); checkQuests(); checkUnlocks(true);
  toast('造好了' + def.name + '（' + (state.parts[ri]|0) + ' 个' + def.name + '存货）。');
  netWorldPart(ri, up, g);
  persist();
  return true;
}
function spawnPartMesh(ri, up, g){
  var def = RECIPES[ri];
  var mesh = new THREE.Mesh(new THREE.BoxGeometry(def.w, def.h, def.d), _partMat(def));
  mesh.position.copy(up).multiplyScalar(g + def.h/2 - 0.015);
  mesh.quaternion.setFromUnitVectors(new V3(0,1,0), up);
  mesh.castShadow = true;
  scene.add(mesh);
  return mesh;
}
function _partMat(def){
  if (!_partMats[def.id]){
    _partMats[def.id] = new THREE.MeshStandardMaterial({
      color: new THREE.Color(def.color), roughness: .92, metalness: .04, flatShading: true });
  }
  return _partMats[def.id];
}
function crafterNear(dir, lim){
  for (var i=0;i<PARTS.length;i++){
    var P = PARTS[i];
    var ang = Math.acos(clamp(dir.dot(P.dir), -1, 1)) * PLANET_R;
    if (ang < lim) return P;
  }
  return null;
}
function partGroundAt(dir){
  var best = -1;
  for (var i=0;i<PARTS.length;i++){
    var P = PARTS[i];
    var ang = Math.acos(clamp(dir.dot(P.dir), -1, 1)) * PLANET_R;
    if (ang <= P.r){
      var top = P.g + P.h;
      if (top > best) best = top;
    }
  }
  return best;
}
