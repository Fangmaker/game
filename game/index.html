function placeTargetDir(){
  /* 用镜头朝向选目标格，站着不动也能判断盖在哪 */
  var f = camF.clone().applyAxisAngle(playerUp, camYaw);
  f.addScaledVector(playerUp, -f.dot(playerUp));
  if (f.lengthSq() < 1e-6) f.copy(heading);
  return stepDir(playerUp, f.normalize(), 0.92);
}

function updateGhost(){
  ghost.userData.why = '';
  if (ride.on || falling || sunset.active || (state.inv[0] + state.inv[1] <= 0)){
    ghost.visible = false;
    ghost.userData.ok = false;
    ghost.userData.why = 'idle';
    return;
  }
  var tgt = placeTargetDir();
  var T = tiles[findTile(tgt)];
  /* 和 placeAt 用同一套选坑规则：优先脚下的坑 */
  var cr = craterNear(playerUp, CR_R*0.92) || craterNear(tgt, CR_R + 0.45);
  /* 井口/灯塔底座上盖不了：不画预览，点下去会说明原因 */
  if (!cr && propAtDir(tgt)){ ghost.visible = false; ghost.userData.ok = false; ghost.userData.why = 'prop'; return; }
  var ok, rG;
  if (cr){
    ok = true;
    rG = craterRadiusAt(cr, tgt);
    if (rG < 0) rG = PLANET_R - DIG_DEPTH_MAX;
    rG += 0.02;
  } else {
    ok = true;   /* 堆土不再设高度上限 */
    rG = (T.removed ? PLANET_R - DIG_DEPTH_MAX : PLANET_R + T.h + DIG_STEP) + 0.02;
  }
  var A = tileVerts[T.v[0]], B = tileVerts[T.v[1]], C = tileVerts[T.v[2]];
  ghost.userData.ok = ok;
  /* 放不下就别画：以前放不下也会画一片红的，挖完一抬头整块半透明三角糊在地表上 */
  if (!ok){ ghost.visible = false; ghost.userData.why = 'noplace'; return; }
  /* 站在坑里时，这块瓦片预览会悬在头顶、糊在镜头上，像一片半透明三角墙戳向天空；
     预览落在脚面以下时同理，直接不画 */
  if (rG - playerR > 0.8 || rG < playerR - 0.06){ ghost.visible = false; ghost.userData.why = 'deep'; return; }
  _ghostMid.set((A.x+B.x+C.x)*rG/3, (A.y+B.y+C.y)*rG/3, (A.z+B.z+C.z)*rG/3);
  if (camera.position.distanceTo(_ghostMid) < 2.4){ ghost.visible = false; ghost.userData.why = 'near'; return; }
  /* 一格瓦片边长 4 个单位，整块铺出来等于糊住半屏；缩到一半当“落点标记” */
  var K = 0.5;
  var ax = A.x*rG, ay = A.y*rG, az = A.z*rG;
  var bx = B.x*rG, by = B.y*rG, bz = B.z*rG;
  var cx = C.x*rG, cy = C.y*rG, cz = C.z*rG;
  _ghostPos.setXYZ(0, _ghostMid.x + (ax-_ghostMid.x)*K, _ghostMid.y + (ay-_ghostMid.y)*K, _ghostMid.z + (az-_ghostMid.z)*K);
  _ghostPos.setXYZ(1, _ghostMid.x + (bx-_ghostMid.x)*K, _ghostMid.y + (by-_ghostMid.y)*K, _ghostMid.z + (bz-_ghostMid.z)*K);
  _ghostPos.setXYZ(2, _ghostMid.x + (cx-_ghostMid.x)*K, _ghostMid.y + (cy-_ghostMid.y)*K, _ghostMid.z + (cz-_ghostMid.z)*K);
  _ghostPos.needsUpdate = true;
  ghost.material.color.set('#a8e089');
  ghost.material.opacity = .4;
  ghost.visible = true;
}

function digAt(){
  if (ride.on){ toast('骑着羊挖不了，先下来。'); return; }
  if (sunset.active){ toast('太阳还没落完，土动不了，等一会儿。'); return; }
  /* 体力：一铲 6 点，满体力能连挖 16 铲；不够就歇一下（站定回 12/s，走动回 4/s） */
  if (state.stam < VIT_DIG_COST - 1e-6){
    toast('体力不够（还差 ' + Math.ceil(VIT_DIG_COST - state.stam) + ' 点），站定回口气再挖。');
    return;
  }
  state.stam = Math.max(0, state.stam - VIT_DIG_COST);
  refreshVitals();
  /* 找脚下最近的圆坑：同一个位置继续挖就往下加深，坑口不会越挖越散 */
  var cr = null;
  for (var i=0;i<craters.length;i++){
    var ang = Math.acos(clamp(playerUp.dot(craters[i].c), -1, 1)) * PLANET_R;
    if (ang < CR_R*0.92){ cr = craters[i]; break; }
  }
  if (cr && cr.p){ toast('这里已经挖穿了。'); return; }
  var deep = cr ? cr.d >= 1.05 : false;
  if (!cr){
    cr = { c: playerUp.clone(), d: 0, p: false };
    craters.push(cr);
  }
  cr.d = Math.min(DIG_DEPTH_MAX, cr.d + DIG_STEP);
  state.inv[deep ? 1 : 0]++;
  state.digs++;
  var hit = cr.c.clone().multiplyScalar(PLANET_R - cr.d + 0.16);
  /* 挖到矿脉：每 5 铲左右蹦一块矿石（深层更容易出） */
  var _oreOdds = deep ? 3 : 5;
  if (((state.digs * 7 + (cr.d * 10 | 0)) % _oreOdds) === 0){
    state.inv[3]++;
    toast('挖到一块' + ITEM_NAME[3] + '。可以去工坊换东西。');
    spawnSparkle(hit, playerUp.clone().negate(), 6, '#9fe6f7');
  }
  gainXp(XP_DIG);
  if (cr.d >= DIG_DEPTH_MAX - 1e-4){
    cr.d = DIG_DEPTH_MAX;
    cr.p = true;
    state.punched = true;
    spawnSparkle(hit, cr.c.clone().negate(), 18, '#cfe4ff');
    spawnDust(hit, cr.c.clone().negate());
    toast('挖穿了。洞那头是星球另一面的光。');
  } else {
    spawnDigDebris(hit, cr.c, deep);
    if (!deep && cr.d >= 1.05) toast('挖到岩层了。');
  }
  /* 商人被动「锱铢必较」：每铲都记账，多收 1 星尘；每 5 铲结一颗止渴丸 */
  if (activeRig.kind === 'merchant'){
    state.dust += 1;
    spawnCoins(hit, cr.c, 3);
    if (state.digs % 5 === 0){
      if (state.water < WATER_MAX) state.water += 1;
      else state.dust += 2;
      ringPulse('#e8c56a', 0.28, 2.2, 0.75);
      spawnCoins(hit, cr.c, 8);
      if (!cr.p) toast('商人结了笔账：这一铲多的，够一颗止渴丸。');
    }
  }
  markTerrain();
  refreshInv();
  refreshQuests();
  netDig();
  netWorldCrater(cr);       /* 洞的深度/是否挖穿，对方立刻能看到并重建坑壁 */
  persist();
}

/* 这块地皮上有没有实心道具（井/灯塔/玫瑰/火山/活着的猴面包树），有就不许往上堆土 */
function propAtDir(dir){
  for (var i=0;i<solids.length;i++){
    var s = solids[i];
    if (s.kind === 'sheep') continue;
    if (s.kind === 'baobab' && (!s.ref || !s.ref.alive)) continue;
    var ang = Math.acos(clamp(dir.dot(s.up), -1, 1)) * PLANET_R;
    if (ang < s.r0 + 0.30) return s;
  }
  return null;
}

/* 找离某方向 lim 以内的圆坑（lim 是球面距离，不是角度） */
function craterNear(dir, lim){
  for (var i=0;i<craters.length;i++){
    var ang = Math.acos(clamp(dir.dot(craters[i].c), -1, 1)) * PLANET_R;
    if (ang < lim) return craters[i];
  }
  return null;
}

function placeAt(){
  if (ride.on){ toast('骑着羊盖不了，先下来。'); return; }
  if (sunset.active){ toast('太阳还没落完，土动不了，等一会儿。'); return; }
  /* 木材/矿石是合成材料，不能当土盖 */
  if (state.sel >= 2){
    if (state.inv[0] > 0){ setSel(0); toast('木材/矿石要在工坊里用，切回' + ITEM_NAME[0] + '。'); }
    else toast('木材/矿石不能直接盖，去工坊做成石阶、土墙或木桥。');
    return;
  }
  if (state.inv[state.sel] <= 0){
    var other = 1 - state.sel;
    if (state.inv[other] > 0){ setSel(other); toast('换成了' + ITEM_NAME[other] + '。'); }
    else toast('背包里没有土了（挖土会往背包里存），先去挖两铲。');
    return;
  }
  var tgt = placeTargetDir();
  /* 优先填自己脚下的坑：站在坑底按“盖土”，本来就该把这个坑填起来，
     而不是在坑沿旁边竖一根土柱（那根柱子会横穿坑壁，看起来就是穿模） */
  var cr = craterNear(playerUp, CR_R*0.92) || craterNear(tgt, CR_R + 0.45);
  var tIdx = -1;
  if (!cr){
    /* 井口/灯塔底座上堆土 = 把道具埋进去，人也跟着站进土里，直接拦住并说明原因 */
    var pr = propAtDir(tgt);
    if (pr){
      var pn = { well:'水井', beacon:'灯塔', rose:'玫瑰', volcano:'火山口', baobab:'猴面包树' }[pr.kind] || '这里的摆设';
      toast(pn + '上不能堆土，换个地方盖。');
      return;
    }
  }
  if (cr){
    if (cr.p){
      cr.p = false;
      cr.d = DIG_DEPTH_MAX - DIG_STEP;       /* 先把通洞封上 */
    } else if (cr.d <= DIG_STEP + 1e-4){
      var idx = craters.indexOf(cr);
      if (idx >= 0) craters.splice(idx, 1);   /* 一层土就填平了 */
    } else {
      cr.d = cr.d - DIG_STEP;
    }
  } else {
    tIdx = findTile(tgt);
    var T = tiles[tIdx];
    if (T.removed){
      T.removed = false;
      T.h = -DIG_DEPTH_MAX;
    } else {
      T.h = T.h + DIG_STEP;
    }
  }
  /* 盖的是自己脚下这一格时，地面会顶上来：人立刻跟上去，
     不能等 7/s 的平滑抬升，否则连点几层整个人就埋进土里了 */
  var gNow = groundRadiusAt(playerUp);
  if (gNow > playerR + 0.005){
    playerR = gNow;
    playerVR = 0;
    falling = false;
  }
  /* 新土如果顶到镜头所在的那一格，把机位抬到土面上，别让镜头埋进土块里 */
  liftCameraOutOfSoil();
  state.inv[state.sel]--;
  state.placed++;
  gainXp(XP_PLACE);
  var gp = Math.max(groundRadiusAt(tgt), PLANET_R - DIG_DEPTH_MAX) + 0.12;
  spawnDust(tgt.clone().multiplyScalar(gp), tgt);
  markTerrain();
  refreshInv();
  refreshQuests();
  if (cr) netWorldCrater(cr);       /* 填坑：深度回退 / 封上通洞 */
  else if (tIdx >= 0) netWorldTile(tIdx);   /* 堆土块：对方同步长出这一块 */
  persist();
}

/* ---------------------------------------------------------------- 玻璃罩碎裂 */
var domeBreak = 0;
function breakDome(instant){
  if (!roseDome || !roseDome.visible) return;
  if (instant){

    if (roseDomeRing) roseDomeRing.visible = false;
    return;
  }

/* ---------------------------------------------------------------- 动作 */
/* 长按动作键：拔掉成熟的猴面包树（点按是浇水，两者分开，浇水不再被"拔掉"抢走） */
function pullBaobab(b){
  if (!b || !b.alive) return;
  if ((b.lv|0) < BAOB_MAX_LV){ toast('还没成熟，先浇水把它养大。'); return; }
  var bi = baobabs.indexOf(b);
  var upB = b.pos.clone().normalize();
  b.alive = false;
  b.anim = 0.0001;
  treeCount++;
  state.treesPulled++;
  state.dust += 2;
  state.inv[2] = (state.inv[2]|0) + 3;      /* 树干当木材 */
  if (bi >= 0 && state.pulledToday.indexOf(bi) < 0) state.pulledToday.push(bi);
  spawnDust(b.pos.clone(), upB);
  toast('拔掉了一棵猴面包树。+2 星尘、+3 木材');
  refreshChips();
  refreshQuests();
  refreshInv();
  netWorldTree(bi);       /* 对方那棵也一起消失 */
  persist();
  nearTarget = null;
  actBtn.classList.remove('on');
}
function doAction(){
  if (sunset.active) return;
  if (attackNearby()) return;
  if (ride.on){ dismount(); return; }
  if (!nearTarget) return;
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch(e){} }

  if (nearTarget.type === 'rose'){
    if (state.roseStage >= 3 && state.garden >= GARDEN_N){
      toast('玫瑰说：这里已经够美了。');
      return;
    }
    if (state.water <= 0){
      toast('水壶空了。回井边打点水吧。');
      return;
    }
    state.water--;
    var upR = ROSE_DIR.clone();
    if (state.roseStage < 3){
      applyRoseStage(state.roseStage + 1, false);
      spawnDroplets(roseGroup.position.clone().addScaledVector(upR, 0.9), upR);
      if (state.roseStage === 1) toast('玫瑰抬起头。');
      else if (state.roseStage === 2) toast('玫瑰说：你真好。');
      else {
        breakDome(false);
        toast('玫瑰开了。玻璃罩碎了。');
      }
    } else {
      applyGarden(state.garden + 1, false);
      state.dust += 2;
      spawnDroplets(roseGroup.position.clone().addScaledVector(upR, 0.5), upR);
      spawnSparkle(roseGroup.position.clone().addScaledVector(upR, 0.6), upR, 8, '#ffd9a0');
      toast('旁边又开了一朵。+2 星尘');
    }
    refreshChips();
    refreshQuests();
    netWorldGarden();       /* 玫瑰阶段 / 花园朵数，对方也开 */
    persist();
  }
  else if (nearTarget.type === 'baobab'){
    var b = nearTarget.ref;
    if (!b.alive) return;
    var bi = baobabs.indexOf(b);
    var upB = b.pos.clone().normalize();
    /* 一直浇、一直长：成熟线以上不再封顶，只是长势变缓 */
    if (state.water <= 0){ toast('水壶空了，先去井边或水塘打水。'); return; }
    state.water--;
    var _wasMature = (b.lv|0) >= BAOB_MAX_LV;
    b.lv = Math.max(0, (b.lv|0) + 1);
    if (bi >= 0) state.baobabLv[bi] = b.lv;
    applyBaobabScale(b, true);
    spawnDroplets(b.pos.clone().addScaledVector(upB, 0.35 * b.tscale), upB);
    spawnSparkle(b.pos.clone().addScaledVector(upB, 0.7 * b.tscale), upB, 6, '#cfe8a8');
    refreshChips();
    netWorldTreeWater(bi, b.lv);
    if (!_wasMature && b.lv >= BAOB_MAX_LV){
      state.treesMatured = (state.treesMatured|0) + 1;
      state.dust += 3;
      toast('猴面包树长成了，抖落 3 星尘。还能继续浇，长成多大都可以。', 'quest');
      refreshQuests();
    } else if (b.lv > BAOB_MAX_LV){
      toast('又长高了一截（第 ' + b.lv + ' 级，已成熟）。长按动作键可以拔掉。');
    } else {
      toast('浇了水，树苗长大了（' + b.lv + '/' + BAOB_MAX_LV + '）。');
    }
    persist();
  }
  else if (nearTarget.type === 'sunset'){
    if (sunset.active) return;
    startSunset();
  }
  else if (nearTarget.type === 'sheep'){
    sheep.friend = true;
    state.sheepFriend = true;
    state.dust += 3;
    var upS = sheep.up.clone();
    spawnSparkle(sheep.up.clone().multiplyScalar(PLANET_R + 0.6), upS, 14, '#ffe3ac');
    toast('小羊愿意跟着你了。+3 星尘');
    refreshChips();
    refreshQuests();
    persist();
    nearTarget = null;
    actBtn.classList.remove('on');
  }
  else if (nearTarget.type === 'ride'){
    mount();
  }
  else if (nearTarget.type === 'well' || nearTarget.type === 'pond'){
    var upW = nearTarget.pos.clone().normalize();
    var wantDrink = state.thirst < VIT_TH_MAX - 0.5;
    var wantFill = state.water < WATER_MAX;
    if (!wantDrink && !wantFill){
      toast('不渴，水壶也是满的。');
      return;
    }
    if (wantFill) state.water = WATER_MAX;
    if (wantDrink){ drinkFull(); gainXp(XP_WELL); }
    spawnDroplets(nearTarget.pos.clone().addScaledVector(upW, 0.4), upW);
    toast(wantDrink && wantFill ? '喝饱了，水壶也灌满了。' : (wantDrink ? '喝饱了。' : '水壶灌满了。'));
    refreshChips();
    persist();
  }
}

/* ---------------------------------------------------------------- 日落 / 天数 */
var skyBase = {
  top: new THREE.Color('#050812'), mid: new THREE.Color('#142244'), bot: new THREE.Color('#2c3a5e')
};
var skyDusk = {
  top: new THREE.Color('#1a1026'), mid: new THREE.Color('#5a2f45'), bot: new THREE.Color('#d0703a')
};

var baseElev = 0.34, sunAzimuth = new V3(0.62, 0, 0.785).normalize();

function applySky(mix, elev){
  skyUni.uTop.value.copy(skyBase.top).lerp(skyDusk.top, mix);
  skyUni.uMid.value.copy(skyBase.mid).lerp(skyDusk.mid, mix);
  skyUni.uBot.value.copy(skyBase.bot).lerp(skyDusk.bot, mix);
  skyUni.uSun.value.copy(new THREE.Color('#ffd7a0')).lerp(new THREE.Color('#ff7a35'), mix);
  skyUni.uGlow.value = 1.0 + mix*1.6;

  var sd = new V3(sunAzimuth.x*Math.cos(elev), Math.sin(elev), sunAzimuth.z*Math.cos(elev)).normalize();
  skyUni.uSunDir.value.copy(sd);

  sunSprite.position.copy(sd).multiplyScalar(1000);
  sunHalo.position.copy(sd).multiplyScalar(1010);
  sunSprite.material.color.copy(new THREE.Color('#ffdcae')).lerp(new THREE.Color('#ff8a44'), mix);
  sunHalo.material.opacity = 0.28 + mix*0.25;

  sunLight.position.copy(sd).multiplyScalar(60);
  sunLight.intensity = lerp(1.15, 0.85, mix);
  sunLight.color.copy(new THREE.Color('#ffd9ae')).lerp(new THREE.Color('#ff9a5c'), mix);
  hemi.intensity = lerp(0.72, 0.50, mix);
  fillLight.intensity = lerp(0.62, 0.44, mix);
}

function startSunset(){
  sunset.active = true;
  sunset.t = 0;
  state.sunsets++;
  state.day = state.sunsets + 1;
  refreshChips();
  toast('第 ' + state.sunsets + ' 次看日落。');
}
function updateSunset(dt){
  if (!sunset.active){
    var br = 1.0 + Math.sin(elapsed*0.6)*0.04;
    sunSprite.scale.setScalar(150*br);
    return;
  }
  sunset.t += dt * (activeRig.kind === 'lamplighter' ? 1.25 : 1);
  var p = clamp(sunset.t/sunset.dur, 0, 1);
  var k = Math.sin(p*Math.PI);
  var mix = Math.pow(k, 0.75);
  var elev = lerp(baseElev, -0.10, Math.pow(k, 0.9));
  applySky(mix, elev);
  skystate.mix = mix;
  if (p >= 1){
    sunset.active = false;
    newDay();
    toast('第 ' + state.day + ' 天。太阳又升起来了。');
  }
}
var skystate = { mix: 0 };

/* ---------------------------------------------------------------- 一天的任务：树苗重生 */
function treesForDay(day){
  return Math.min(BAOB_SPOTS.length, 5 + day*2);
}
function resetDayTrees(instant){
  var n = treesForDay(state.day);
  for (var i=0;i<baobabs.length;i++){
    var b = baobabs[i];
    var on = i < n;
    var pulled = state.pulledToday.indexOf(i) >= 0;
    if (on && !pulled && !b.alive){
      b.alive = true;
      b.anim = 0;
      b.grow = instant ? 1 : 0;
      b.root.visible = true;
      b.inner.scale.setScalar(instant ? 1 : 0.0001);
      applyBaobabScale(b, false);
    } else if (on && pulled){
      b.alive = false;
      b.root.visible = false;
      applyBaobabScale(b, false);
    } else if (!on && b.alive){
      b.alive = false;
      b.root.visible = false;
    }
    if (b.alive && instant) b.inner.scale.setScalar(1);
  }
}
function newDay(){
  state.pulledToday = [];
  resetDayTrees(false);
  refreshQuests();
  persist();
}
resetDayTrees(true);

/* ---------------------------------------------------------------- 任务面板 */
var questsEl = document.getElementById('quests');

/* 任务定义：done 判定与「已完成」的显示分开写，完成瞬间发奖励、弹提示、行内闪一下。
   奖励只发一次（state.qClaimed 落盘），每日任务重做只更新进度、不重复给星尘。 */
var QDEFS = [
  { id:'rose',   label:'给玫瑰浇水',       dust:6,  xp:25, when:function(){ return state.roseStage >= 3; } },
  { id:'garden', label:'在玫瑰旁种花',     dust:8,  xp:30, when:function(){ return state.garden >= GARDEN_N; } },
  { id:'dig',    label:'挖穿脚下的星球',   dust:5,  xp:40, when:function(){ return !!state.punched; } },
  { id:'place',  label:'把挖出来的土盖回去', dust:3, xp:15, when:function(){ return state.placed >= 3; } },
  { id:'trees',  label:'把猴面包树浇到成熟', dust:4,  xp:20, when:function(){
      return (state.treesMatured|0) >= 1;
    } },
  { id:'shards', label:'收齐十二枚星光',   dust:20, xp:60, when:function(){
      if (!shards.length) return false;
      for (var i=0;i<shards.length;i++) if (!shards[i].taken) return false;
      return true;
    } },
  { id:'sheep',  label:'找到星球背面的小羊', dust:4, xp:25, when:function(){ return !!state.sheepFriend; } },
  { id:'fall',   label:'掉到星球的另一面', dust:5,  xp:40, when:function(){ return !!state.fell; } }
];
var qPrimed = false;
function qClaimed(id){ return state.qClaimed.indexOf(id) >= 0; }
function questRowFlash(id){
  for (var i=0;i<questsEl.children.length;i++){
    var el = questsEl.children[i];
    if (el.dataset.id === id){
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
    }
  }
}
function checkQuests(){
  var primed = qPrimed;
  var got = 0;
  for (var i=0;i<QDEFS.length;i++){
    var d = QDEFS[i];
    if (qClaimed(d.id) || !d.when()) continue;
    state.qClaimed.push(d.id);
    if (!primed) continue;             /* 首帧只登记老进度，不补发奖励 */
    state.dust += d.dust;
    got++;
    refreshChips();
    questRowFlash(d.id);
    spawnSparkle(playerPos, playerUp, 10, '#ffe0a8');
    ringPulse('#ffe0a8', 0.45, 4.4, 0.9);
    toast('任务完成：' + d.label + '　+' + d.dust + ' 星尘 · +' + d.xp + ' 经验', 'quest');
    if (d.xp) gainXp(d.xp);
  }
  qPrimed = true;
  if (got) persist();
}

function refreshQuests(){
  var items = [];
  if (state.roseStage < 3){
    items.push({ id:'rose', done:false, html:'给玫瑰浇水 <b>' + state.roseStage + '/3</b>' });
  } else if (state.garden < GARDEN_N){
    items.push({ id:'garden', done:false, html:'在玫瑰旁种花 <b>' + state.garden + '/' + GARDEN_N + '</b>' });
  } else {
    items.push({ id:'garden', done:true, html:'玫瑰开满了' });
  }

  var mxLv = baobabMaxLv();
  if ((state.treesMatured|0) < 1){
    items.push({ id:'trees', done:false, html:'把猴面包树浇到成熟 <b>' + Math.min(mxLv, BAOB_MAX_LV) + '/' + BAOB_MAX_LV + '</b>' });
  } else {
    items.push({ id:'trees', done:true, html:'猴面包树长成了 <b>LV ' + mxLv + '</b>' });
  }

  var got = 0;
  for (var s=0;s<shards.length;s++) if (shards[s].taken) got++;
  items.push({ id:'shards', done:got >= shards.length, html:'收集星光碎片 <b>' + got + '/' + shards.length + '</b>' });

  if (!state.sheepFriend) items.push({ id:'sheep', done:false, html:'在星球背面找到小羊' });

  /* 挖土 / 建造：目标链最后一段，做完有明确变化 */
  if (!state.punched){
    var digNeed = Math.round(DIG_DEPTH_MAX / DIG_STEP);   /* 17：5.1/0.3 的浮点偏差不能 ceil 成 18 */
    items.push({ id:'dig', done:false, html:'挖穿脚下的星球 <b>' + Math.min(state.digs, digNeed) + '/' + digNeed + '</b>' });
  } else if (!state.fell){
    items.push({ id:'fall', done:false, html:'从挖穿的洞里掉下去' });
  } else {
    items.push({ id:'fall', done:true, html:'从星球另一头爬出来了' });
  }
  items.push(state.placed < 3
    ? { id:'place', done:false, html:'把挖出来的土盖回去 <b>' + state.placed + '/3</b>' }
    : { id:'place', done:true, html:'土块搭起来了' });

  /* 顺序：玫瑰 → 挖穿 → 盖土 → 树苗 → 星光 → 小羊，最多显示 4 条 */
  var order = ['rose', 'garden', 'dig', 'fall', 'place', 'trees', 'shards', 'sheep'];
  items.sort(function(a, b){ return order.indexOf(a.id) - order.indexOf(b.id); });

  var html = '';
  var shown = 0;
  for (var j=0;j<items.length && shown<4;j++){
    var it = items[j];
    html += '<div class="q' + (it.done ? ' done' : '') + '" data-id="' + it.id + '"><i></i><span>' + it.html + '</span></div>';
    shown++;
  }
  questsEl.innerHTML = html;

  checkQuests();
  checkUnlocks(false);
}

/* 角色解锁：条件达成即入列，提示一次并点亮右上角旅伴按钮 */
function checkUnlocks(quiet){
  var got = [];

function joyMove(e){
  if (!joy.active || e.pointerId !== joy.id) return;
  var r = joyEl.getBoundingClientRect();
  var cx = r.left + r.width/2, cy = r.top + r.height/2;
  var dx = (e.clientX - cx) / (r.width*0.42);
  var dy = (e.clientY - cy) / (r.height*0.42);
  var len = Math.hypot(dx, dy);
  if (len > 1){ dx /= len; dy /= len; }
  joy.x = dx; joy.y = -dy;
  knobEl.style.transform = 'translate(' + (dx*r.width*0.32) + 'px,' + (dy*r.height*0.32) + 'px)';
  e.preventDefault();
}
function joyEnd(e){
  if (e.pointerId !== joy.id) return;
  joy.active = false; joy.id = null;
  joy.x = 0; joy.y = 0;

  joyEl.classList.add('idle');
}

/* ---------------------------------------------------------------- 地形同步

   对方走进去会掉下去（高度算的是自己那份），却看不到任何变化。
   这里把地形当“世界状态”同步：
     - 本人每次改动只发一条增量（q:c/q:t/q:p/q:g）
     - 刚连上 / 有人进来时发一次全量（q:all），后加入的一方立刻对上当前地形

function worldSnapshot(){
  var mods = [];
  for (var i=0;i<tiles.length;i++){

  }

    t: 'world', q: 'all',
    cr: craters.map(function(cr){
      return [+cr.c.x.toFixed(4), +cr.c.y.toFixed(4), +cr.c.z.toFixed(4), +cr.d.toFixed(3), cr.p ? 1 : 0];
    }),
    tl: mods,

    rs: state.roseStage, gd: state.garden

}
function netWorld(msg){

  try { ws.send(JSON.stringify(msg)); return true; } catch(e){ return false; }
}
function netWorldAll(){ return netWorld(worldSnapshot()); }
function netWorldCrater(cr){
  if (!cr) return false;
  return netWorld({ t:'world', q:'c',
    c:[+cr.c.x.toFixed(4), +cr.c.y.toFixed(4), +cr.c.z.toFixed(4)],
    d:+cr.d.toFixed(3), p: cr.p ? 1 : 0 });
}
function netWorldTile(i){
  var T = tiles[i];
  if (!T) return false;
  return netWorld({ t:'world', q:'t', i:i, h:+T.h.toFixed(3), r: T.removed ? 1 : 0 });
}
function netWorldTree(i){ return netWorld({ t:'world', q:'p', i:i }); }
function netWorldTreeWater(i, lv){ return netWorld({ t:'world', q:'w', i:i, lv:lv|0 }); }
/* 建造同步：对方也把这块阶/墙/桥立起来 */
function netWorldPart(kind, dir, g){
  return netWorld({ t:'world', q:'b', k: kind|0,
    u: [+dir.x.toFixed(4), +dir.y.toFixed(4), +dir.z.toFixed(4)], g: +g.toFixed(3) });
}
function netApplyPart(kind, u, g){
  if (!RECIPES[kind|0] || !Array.isArray(u) || u.length < 3) return false;
  var up = new V3(+u[0], +u[1], +u[2]);
  if (up.lengthSq() < 1e-6) return false;
  up.normalize();
  if (crafterNear(up, 0.6)) return false;
  var def = RECIPES[kind|0];
  var gg = +g || PLANET_R;
  var mesh = spawnPartMesh(kind|0, up, gg);
  var r = Math.max(def.w, def.d) * 0.56;
  addSolid(up, 0, def.h, r, r, 'part', null);
  PARTS.push({ kind: kind|0, dir: up.clone(), h: def.h, r: r, g: gg, mesh: mesh });
  return true;
}
function netWorldGarden(){ return netWorld({ t:'world', q:'g', rs: state.roseStage, gd: state.garden }); }

var _wv = new V3();
function netCraterNear(dir){
  for (var i=0;i<craters.length;i++){
    var ang = Math.acos(clamp(dir.dot(craters[i].c), -1, 1)) * PLANET_R;
    if (ang < CR_R*0.92) return craters[i];
  }
  return null;
}
function netApplyCrater(c, d, p){
  if (!Array.isArray(c) || c.length < 3) return false;
  _wv.set(+c[0] || 0, +c[1] || 0, +c[2] || 0);
  if (_wv.lengthSq() < 0.1) return false;
  _wv.normalize();
  var nd = clamp(+d || 0, 0, DIG_DEPTH_MAX);
  var cr = netCraterNear(_wv);
  if (!cr){
    craters.push({ c: _wv.clone(), d: nd, p: !!p });
    return true;
  }
  if (Math.abs(cr.d - nd) > 1e-4 || !!cr.p !== !!p){
    cr.d = nd; cr.p = !!p;
    return true;
  }
  return false;
}
function netApplyTree(i){
  i = i | 0;
  if (i < 0 || i >= baobabs.length) return;
  if (state.pulledToday.indexOf(i) < 0) state.pulledToday.push(i);
  var b = baobabs[i];
  if (b.alive){ b.alive = false; b.root.visible = false; }
  refreshQuests();
  persist();
}
/* 对方浇水的进度：把树直接放到对应等级，并补上它这一天该在的位置 */
function netApplyTreeLv(i, lv){
  i = i | 0;
  if (i < 0 || i >= baobabs.length) return false;
  var b = baobabs[i];
  var n = Math.max(0, lv|0);           /* 对方浇到多高就同步多高，没有上限 */
  if (n === (b.lv|0)) return false;
  b.lv = n;
  if (!b.alive && state.pulledToday.indexOf(i) < 0){
    b.alive = true;
    b.root.visible = true;
    b.grow = 1;
    b.inner.scale.setScalar(1);
  }
  state.baobabLv[i] = n;
  applyBaobabScale(b, true);
  return true;
}
function netApplyWorld(m){
  if (!m || m.q === 'req') return;
  var dirty = false;
  if (m.q === 'all'){
    if (Array.isArray(m.cr)) m.cr.forEach(function(c){
      if (Array.isArray(c) && netApplyCrater([c[0], c[1], c[2]], c[3], c[4])) dirty = true;
    });
    if (Array.isArray(m.tl)) m.tl.forEach(function(t){
      if (!Array.isArray(t)) return;
      var T = tiles[t[0]];
      if (!T) return;
      var h = +t[1] || 0, rm = !!t[2];
      if (T.h !== h || T.removed !== rm){ T.h = h; T.removed = rm; dirty = true; }
    });
    if (Array.isArray(m.bb)) m.bb.forEach(function(i){ netApplyTree(i); });
    if (Array.isArray(m.bl)) m.bl.forEach(function(lv, i){ if (netApplyTreeLv(i, lv)) dirty = true; });
    if (typeof m.rs === 'number' && m.rs > state.roseStage){ applyRoseStage(m.rs, true); dirty = true; }
    if (typeof m.gd === 'number' && m.gd > state.garden){ applyGarden(m.gd, true); dirty = true; }
  } else if (m.q === 'c'){
    if (netApplyCrater(m.c, m.d, m.p)) dirty = true;
  } else if (m.q === 't'){
    var T2 = tiles[m.i];
    if (T2){
      var h2 = +m.h || 0, r2 = !!m.r;
      if (T2.h !== h2 || T2.removed !== r2){ T2.h = h2; T2.removed = r2; dirty = true; }
    }
  } else if (m.q === 'p'){
    netApplyTree(m.i);
  } else if (m.q === 'w'){
    if (netApplyTreeLv(m.i, m.lv)) dirty = true;
  } else if (m.q === 'g'){
    if (typeof m.rs === 'number' && m.rs > state.roseStage){ applyRoseStage(m.rs, true); dirty = true; }
    if (typeof m.gd === 'number' && m.gd > state.garden){ applyGarden(m.gd, true); dirty = true; }
  } else if (m.q === 'b'){
    netApplyPart(m.k|0, m.u, m.g);
  }
  if (dirty){
    markTerrain();          /* 下一帧重建 base + overlay，坑/土块/井口一起刷新 */
    refreshChips();
    refreshQuests();
    persist();              /* 顺手落盘：刷新页面后对方的改动也还在 */
  }
}

function defaultServer(){
  var h = location.hostname;
  if (location.protocol === 'file:' || !h) return 'ws://localhost:18201/ws';
  /* GitHub Pages 只有静态文件、没有后端，必须手填隧道地址 */
  if (/(^|\.)github\.io$/i.test(h)) return '';
  /* 纯静态端口（旧用法）与房间服务分开，WS 仍在 18201 */
  if (location.port === '18100') return 'ws://' + h + ':18201/ws';
  /* 网关同源：页面和 WS 一个端口，https 页面自动是 wss */
  return (location.protocol === 'https:' ? 'wss://' : 'ws://') + h +
         (location.port ? ':' + location.port : '') + '/ws';
}
function normalizeServer(v){
  v = (v || '').trim();
  if (!v) return defaultServer();
  if (!/^wss?:\/\//i.test(v)) v = (location.protocol === 'https:' ? 'wss://' : 'ws://') + v;
  try {
    var u = new URL(v);
    /* 只在明文 ws 且没写端口时补 18201；wss 走 443，隧道地址不能加端口 */
    if (!u.port && u.protocol === 'ws:') u.port = '18201';

function netDispose(root){
  var seen = [];
  root.traverse(function(o){
    if (o.geometry) o.geometry.dispose();
    var ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (var i=0;i<ms.length;i++){
      if (seen.indexOf(ms[i]) < 0){ seen.push(ms[i]); ms[i].dispose(); }
    }
  });
}

/* 远端角色：独立建一套 rig，换装只作用于这套材质 */

  if (rm.R){ netGroup.remove(rm.R.group); netDispose(rm.R.group); }
  var build = RIG_BUILDERS[char] || RIG_BUILDERS.prince;

  );

    r: PLANET_R, tR: PLANET_R, f: new V3(0,0,1), tF: new V3(0,0,1),
    q: new QT(), _initQ: false, mv: 0, tMv: 0, phase: 0, ride: false, digT: 0,
    hp: VIT_HP_MAX, th: VIT_TH_MAX,

function netApplyState(m){

  }

  if (typeof m.th === 'number') rm.th = clamp(m.th, 0, VIT_TH_MAX);

function netStartFade(rm){

    var ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (var i=0;i<ms.length;i++){
      var mm = ms[i];
      if (!rm.fadeMats.some(function(e){ return e.m === mm; })){
        rm.fadeMats.push({ m: mm, t: mm.transparent, d: mm.depthWrite, o: mm.opacity });

function netFadeAll(){

function netPoseRemote(rm){
  var R = rm.R, B = rigBase(R), i, j, P, k;
  R.body.rotation.x = 0;
  R.body.rotation.z = Math.sin(rm.phase) * 0.035 * rm.mv;
  R.body.position.y = Math.sin(rm.phase * 2) * 0.034 * rm.mv;
  if (rm.ride){
    P = RIDE_POSE[R.kind] || RIDE_POSE.prince;
    R.body.position.y = P.lift;
    if (P.type === 'fox'){
      for (i=0;i<R.legs.length;i++){ R.legs[i].rotation.x = B.legX[i] + P.fold; R.legs[i].rotation.z = B.legZ[i]; }
    } else if (P.type === 'rose'){
      for (i=0;i<R.legs.length;i++){
        R.legs[i].rotation.x = B.legX[i] - P.fold;
        R.legs[i].rotation.z = B.legZ[i] + (i === 0 ? P.spread : -P.spread);
      }
    } else if (P.type === 'snake'){
      if (R.parts.coil) R.parts.coil.scale.set(1, P.coilY, 1);
      if (R.parts.sway) R.parts.sway.rotation.x = P.swayX;
    } else {
      for (i=0;i<R.legs.length;i++){
        R.legs[i].rotation.x = B.legX[i] - P.fold;
        R.legs[i].rotation.z = B.legZ[i] + (i === 0 ? P.spread : -P.spread);
      }
      for (j=0;j<R.arms.length;j++) R.arms[j].rotation.x = B.armX[j] - P.armFold;
    }

    for (i=0;i<R.legs.length;i++){
      var sgn = (i === 0 || i === 3) ? 1 : -1;
      R.legs[i].rotation.x = B.legX[i] + Math.sin(rm.phase) * 0.58 * sgn * rm.mv;
      R.legs[i].rotation.z = B.legZ[i];
    }
  } else {
    if (R.legs[0]) R.legs[0].rotation.x = B.legX[0] + Math.sin(rm.phase) * 0.55 * rm.mv;
    if (R.legs[1]) R.legs[1].rotation.x = B.legX[1] - Math.sin(rm.phase) * 0.55 * rm.mv;
    for (i=0;i<R.legs.length;i++) R.legs[i].rotation.z = B.legZ[i];
    for (j=0;j<R.arms.length;j++){
      R.arms[j].rotation.x = B.armX[j] + (j === 0 ? -1 : 1) * Math.sin(rm.phase) * 0.42 * rm.mv;
    }
  }

    k = Math.sin((rm.digT / 0.45) * Math.PI);
    R.body.rotation.x = -0.6 * k;
    for (j=0;j<R.arms.length;j++) R.arms[j].rotation.x -= 1.05 * k;
  }
  if (R.parts.cape) R.parts.cape.rotation.x = 0.07 + Math.sin(rm.phase * 2.6) * 0.03 + rm.mv * 0.16;
  if (R.parts.streamers) R.parts.streamers.rotation.x = Math.sin(rm.phase * 2.2) * 0.06 + rm.mv * 0.22;
  if (R.parts.tail && !rm.ride) R.parts.tail.rotation.x = -0.22 + Math.sin(rm.phase * 2.2) * 0.05 + rm.mv * 0.10;
  if (R.parts.book && !rm.ride) R.parts.book.rotation.z = 0.08 + Math.sin(rm.phase * 1.1) * 0.02;
}
function netUpdateRemotes(dt){
  var ids = Object.keys(netRemotes);
  for (var i=0;i<ids.length;i++){
    var rm = netRemotes[ids[i]];
    if (rm.fading){
      rm.fade -= dt / 0.55;
      if (rm.fade <= 0){
        if (rm.R){ netGroup.remove(rm.R.group); netDispose(rm.R.group); }
        delete netRemotes[ids[i]];
        continue;
      }
      for (var fi=0; fi<rm.fadeMats.length; fi++) rm.fadeMats[fi].m.opacity = rm.fadeMats[fi].o * rm.fade;
      continue;
    }
    if (!rm.hasState || !rm.R) continue;
    var R = rm.R;
    /* 掉穿星球时 up 会瞬间翻到对面（点积 ≈ -1）。按帧 lerp 会让远程角色从地壳里
       横着扫出来，看起来就是“横躺、半个身子埋进地面”。这种大跳直接切过去。 */
    var snap = rm.up.dot(rm.tUp) < 0.2;
    if (snap){
      rm.up.copy(rm.tUp);
      rm.r = rm.tR;
      rm.f.copy(rm.tF);
      if (rm.f.lengthSq() < 1e-8) rm.f.set(0, 0, 1);
      rm.f.normalize();
    } else {
      rm.up.lerp(rm.tUp, 1 - Math.exp(-12*dt));
      if (rm.up.lengthSq() < 1e-8) rm.up.copy(rm.tUp); else rm.up.normalize();
      rm.r = damp(rm.r, rm.tR, 12, dt);
    }

    _rnV1.copy(rm.tF).addScaledVector(rm.up, -rm.tF.dot(rm.up));
    if (_rnV1.lengthSq() < 1e-8) _rnV1.set(0,0,1).addScaledVector(rm.up, -rm.up.z);
    if (_rnV1.lengthSq() < 1e-8) _rnV1.set(1,0,0);
    _rnV1.normalize();
    rm.f.lerp(_rnV1, 1 - Math.exp(-14*dt));
    if (rm.f.lengthSq() < 1e-8) rm.f.copy(_rnV1); else rm.f.normalize();

    _rnV2.crossVectors(rm.up, rm.f);
    _rnM.makeBasis(_rnV2, rm.up, rm.f);
    _rnQ.setFromRotationMatrix(_rnM);
    if (!rm._initQ || snap){ rm.q.copy(_rnQ); rm._initQ = true; }
    else rm.q.slerp(_rnQ, 1 - Math.exp(-14*dt));

    rm.mv = damp(rm.mv, rm.tMv, 8, dt);
    rm.phase += dt * 10.5 * rm.mv;
    if (rm.digT > 0) rm.digT = Math.max(0, rm.digT - dt);
    netPoseRemote(rm);
    R.group.position.copy(rm.up).multiplyScalar(rm.r).addScaledVector(rm.up, -0.04);
    R.group.quaternion.copy(rm.q);
    R.group.visible = true;
  }
}

/* 15–20Hz 上行，只带变化量大的字段；1.5s 无变化补一帧全量当保活 */
function netSend(force){
  var ws = NET.ws;
  if (!ws || ws.readyState !== 1) return;
  var now = performance.now();
  var stale = (now - NET.lastSend) > 1500;
  var f = _nF.set(0,0,1).applyQuaternion(headingQ).normalize();
  var of = outfitOf(state.char), ofs = JSON.stringify(of);
  var mvq = Math.round(moveAmount * 20) / 20;
  var moved = NET.lastU.distanceToSquared(playerUp) > 3e-6;
  var turned = NET.lastF.dot(f) < 0.99975;
  var alted = Math.abs(NET.lastR - playerR) > 0.02;
  var gait = Math.abs(NET.lastMv - mvq) > 0.001;
  var charCh = NET.lastCh !== state.char;
  var outfitCh = NET.lastOf !== ofs;
  var rideCh = NET.lastRd !== ride.on;
  var digCh = NET.lastDg !== NET.digSeq;
  var hpQ = Math.round(state.hp / 5) * 5, thQ = Math.round(state.thirst / 5) * 5;
  var vitCh = NET.lastHp !== hpQ || NET.lastTh !== thQ;
  if (!(force || NET.full || stale || moved || turned || alted || gait || charCh || outfitCh || rideCh || digCh || vitCh)) return;

  var msg = { t: 'state' };
  if (force || NET.full || stale || moved || turned || alted){
    msg.u = [+playerUp.x.toFixed(4), +playerUp.y.toFixed(4), +playerUp.z.toFixed(4)];
    msg.f = [+f.x.toFixed(3), +f.y.toFixed(3), +f.z.toFixed(3)];
    msg.r = +playerR.toFixed(2);
  }
  if (force || NET.full || charCh) msg.ch = state.char;
  if (force || NET.full || outfitCh) msg.of = of;
  if (force || NET.full || gait) msg.mv = mvq;
  if (force || NET.full || rideCh) msg.rd = ride.on ? 1 : 0;
  if (digCh) msg.dg = NET.digSeq;
  if (force || NET.full || stale || vitCh){ msg.hp = hpQ; msg.th = thQ; }
  try { ws.send(JSON.stringify(msg)); NET.lastSend = now; } catch(e){ return; }
  NET.full = false;
  NET.lastU.copy(playerUp); NET.lastF.copy(f); NET.lastR = playerR;
  NET.lastMv = mvq; NET.lastCh = state.char; NET.lastOf = ofs;
  NET.lastRd = ride.on; NET.lastDg = NET.digSeq;
  NET.lastHp = hpQ; NET.lastTh = thQ;
}

function netConnect(){
  var room = (netRoomEl.value || '').trim();
  if (!room){ toast('先给房间起个名字。'); netRoomEl.focus(); return; }
  NET.room = room;
  NET.mixed = (location.protocol === 'https:' && /^ws:\/\//i.test((netServerEl.value || '').trim()));
  NET.server = normalizeServer(netServerEl.value);
  if (!NET.server){
    NET.on = false;
    NET.failReason = '还没有公网地址：先启动隧道，把地址填进上面（见 net/README.md）';
    netUi();
    return;
  }
  netServerEl.value = NET.server;
  try { localStorage.setItem('b612.net.v1', JSON.stringify({ room: room, server: NET.server })); } catch(e){}
  NET.on = true; NET.retry = 0; NET.failReason = ''; NET.everConnected = false; NET.failShown = '';
  if (NET.retryTimer){ clearTimeout(NET.retryTimer); NET.retryTimer = null; }
  netEl.classList.remove('on');
  if (NET.mixed){
    NET.on = false;
    NET.failReason = netFailHint();
    netUi();
    return;
  }
  netUi();
  netOpen();
}
function netDisconnect(){
  NET.on = false;
  NET.failReason = '';
  if (NET.openTimer){ clearTimeout(NET.openTimer); NET.openTimer = null; }
  if (NET.retryTimer){ clearTimeout(NET.retryTimer); NET.retryTimer = null; }
  var ws = NET.ws;
  NET.ws = null; NET.connected = false;
  if (ws){
    ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null;
    try { ws.close(); } catch(e){}
  }
  netFadeAll();
  netUi();
}
function netRetryLater(){
  if (!NET.on || NET.retryTimer) return;
  if (NET.retry >= 4){
    NET.on = false;
    NET.failReason = netFailHint();
    netUi();
    return;
  }
  var delay = Math.min(3000, 250 * Math.pow(1.6, Math.min(NET.retry, 6)));
  NET.retry++;
  netUi();
  NET.retryTimer = setTimeout(function(){
    NET.retryTimer = null;
    if (NET.on) netOpen();
  }, delay);
}
function netOpen(){
  if (!NET.on) return;
  var url;
  try {
    url = new URL(NET.server);
    url.searchParams.set('room', NET.room);
    url.searchParams.set('name', state.char);
  } catch(e){
    NET.on = false; NET.failReason = '服务器地址不对，检查一下填的地址'; netUi(); return;
  }
  var ws;
  try { ws = new WebSocket(url.toString()); } catch(e){
    NET.on = false; NET.failReason = netFailHint(); netUi(); return;
  }
  NET.ws = ws; NET.connected = false; NET.acc = 0; NET.full = true;
  if (NET.openTimer){ clearTimeout(NET.openTimer); NET.openTimer = null; }
  NET.openTimer = setTimeout(function(){
    NET.openTimer = null;
    if (NET.ws !== ws || NET.connected) return;
    try { ws.onopen = ws.onclose = ws.onerror = null; ws.close(); } catch(e){}
    NET.ws = null; NET.connected = false;
    if (NET.retryTimer){ clearTimeout(NET.retryTimer); NET.retryTimer = null; }
    NET.on = false;
    NET.failReason = netFailHint();
    netFadeAll();
    netUi();
  }, 5000);
  ws.onopen = function(){
    if (NET.ws !== ws) return;
    if (NET.openTimer){ clearTimeout(NET.openTimer); NET.openTimer = null; }
    NET.retry = 0;
    NET.lastMsg = performance.now();
    NET.pingAt = performance.now();
    netSend(true);
  };
  ws.onmessage = function(ev){
    if (NET.ws !== ws) return;
    if (typeof ev.data !== 'string') return;
    NET.lastMsg = performance.now();
    var m;
    try { m = JSON.parse(ev.data); } catch(e){ return; }
    if (m.t === 'welcome'){
      NET.connected = true;
      NET.everConnected = true;
      NET.failReason = '';
      NET.peerId = m.id;
      netSend(true);
      netUi();
      /* 房间里已经有人：先要一份地形全量，别让后进来的一方看到“原样的星球” */
      if (Array.isArray(m.peers) && m.peers.length) netWorld({ t:'world', q:'req' });
      if (!NET.joinedOnce){ NET.joinedOnce = true; toast('联机已连上：' + NET.room); }
    } else if (m.t === 'peer-join'){
      netSend(true);
      netWorldAll();          /* 新同伴进来：把当前地形（坑/土块/树/花）一次性交给他 */
      netUi();
    } else if (m.t === 'world'){
      if (m.q === 'req') netWorldAll();
      else netApplyWorld(m);
    } else if (m.t === 'peer-leave'){
      var rm = netRemotes[String(m.id)];
      if (rm) netStartFade(rm);
      netUi();
    } else if (m.t === 'state'){
      netApplyState(m);
      if (Object.keys(netRemotes).length !== NET.uiCount) netUi();
    }
  };
  ws.onclose = function(){
    if (NET.ws !== ws) return;
    if (NET.openTimer){ clearTimeout(NET.openTimer); NET.openTimer = null; }
    NET.ws = null; NET.connected = false;
    netFadeAll();
    if (NET.everConnected){
      netUi();
      netRetryLater();
    } else {
      NET.on = false;
      NET.failReason = netFailHint();
      netUi();
    }
  };

}
function netTick(dt){
  netUpdateRemotes(dt);
  if (!NET.on || !NET.ws || NET.ws.readyState !== 1) return;
  var now = performance.now();
  NET.acc += dt;
  if (NET.acc >= 0.06){ NET.acc = 0; netSend(false); }
  if (now - NET.pingAt > 10000){
    NET.pingAt = now;
    try { NET.ws.send('{"t":"ping"}'); } catch(e){}
  }
  if (now - NET.lastMsg > 25000){ try { NET.ws.close(); } catch(e){} }
}

/* 大招阶梯：每个角色的技能都带一段范围攻击（原先纯辅助的角色由此补上输出）。
   伤害 = 基础 × 阶数（Ⅰ/Ⅱ/Ⅲ 分别在 1 / 4 / 7 级），冷却每阶缩 12%，击退按角色手感给。 */
var SKILL_ATK = {
  prince:      { r: 5.0, d: 8,  c: '#ffd27a', k: 0.35 },
  fox:         { r: 5.4, d: 7,  c: '#e8a866', k: 0.30 },
  king:        { r: 6.0, d: 9,  c: '#c9a35b', k: 0.40 },
  lamplighter: { r: 5.6, d: 8,  c: '#ffcf7a', k: 0.35 },
  rose:        { r: 3.4, d: 12, c: '#d7f0b8', k: 0.55 },
  snake:       { r: 4.2, d: 10, c: '#e6cf7a', k: 0.45 },
  merchant:    { r: 3.6, d: 7,  c: '#ffe6a8', k: 0.30 },
  geographer:  { r: 6.0, d: 9,  c: '#f2dfa8', k: 0.40 }
};
function skillCdOf(name){
  var S = SKILL_DEFS[name];
  if (!S) return 0;
  return Math.round(S.cd * (1 - (skillTier() - 1) * 0.12));
}
function skillBlast(){
  var A = SKILL_ATK[state.char];
  if (!A || !MOB_ENABLED) return 0;
  var tier = skillTier(), dmg = A.d * tier, hit = 0;
  for (var i = mobs.length - 1; i >= 0; i--){
    var m = mobs[i];
    if (m.dead) continue;
    if (mobDist(m) > A.r) continue;
    m.hp -= dmg;
    m.hurt = 0.20;
    m.lunge = 0.25;
    m.atkCd = Math.max(m.atkCd, 0.7);
    var away = new V3().crossVectors(playerUp, m.up);
    if (away.lengthSq() < 1e-6) away.copy(heading);
    away.normalize();
    var nudged = stepDir(m.up, away, A.k);
    if (groundRadiusAt(nudged) > 0) m.up.copy(nudged);
    spawnSparkle(m.up.clone().multiplyScalar(m.r + 0.55), m.up, 10, A.c);
    hit++;
    if (m.hp <= 0) killMob(m);
  }
  ringPulse(A.c, 0.35, A.r, 0.7);
  return hit;
}

/* 一次性扩散光环 */
var fx = [];
function ringPulse(color, r0, r1, life){
  var m = new THREE.MeshBasicMaterial({
    color: new THREE.Color(color), transparent: true, opacity: .8,
    side: THREE.DoubleSide, depthWrite: false
  });
  var mesh = new THREE.Mesh(new THREE.RingGeometry(0.88, 1.0, 32), m);
  mesh.position.copy(playerPos).addScaledVector(playerUp, 0.05);
  mesh.quaternion.setFromUnitVectors(new V3(0,0,1), playerUp);
  mesh.scale.setScalar(r0);
  scene.add(mesh);
  fx.push({ mesh: mesh, t: 0, life: life, r0: r0, r1: r1 });
}
function updateFx(dt){
  for (var i=fx.length-1; i>=0; i--){
    var f = fx[i];
    f.t += dt;
    var p = Math.min(1, f.t / f.life);
    f.mesh.scale.setScalar(f.r0 + (f.r1 - f.r0) * p);
    f.mesh.material.opacity = .8 * (1 - p);
    if (p >= 1){
      scene.remove(f.mesh);
      f.mesh.geometry.dispose();
      f.mesh.material.dispose();
      fx.splice(i, 1);
    }
  }
}

/* 看见本质：在所有互动点上方亮起金环（只建一次，之后开关显隐） */
function ensureReveal(){
  if (skill.revealGroup) return skill.revealGroup;
  var g = new THREE.Group();
  var m = new THREE.MeshStandardMaterial({
    color: new THREE.Color('#ffd27a'), emissive: new THREE.Color('#ffb347'),
    emissiveIntensity: 1.8, roughness: .5, flatShading: true
  });
  interactables.forEach(function(it){
    if (!it.pos) return;
    var upv = it.pos.clone().normalize();
    var ring = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.022, 4, 14), m);
    ring.position.copy(upv).multiplyScalar(it.pos.length() + 0.05);
    ring.quaternion.setFromUnitVectors(new V3(0,0,1), upv);
    g.add(ring);
  });
  g.visible = false;
  scene.add(g);
  skill.revealGroup = g;
  return g;
}

/* 地理学家的测绘标杆：光柱 + 地面十字 + 红白标杆 + 小旗 */
function buildSurveyMark(){
  var g = new THREE.Group();
  var lineM = new THREE.MeshBasicMaterial({
    color: new THREE.Color('#f0d68a'), transparent: true, opacity: .9, depthWrite: false
  });
  var beam = new THREE.Mesh(
    new THREE.CylinderGeometry(0.042, 0.13, 3.4, 8, 1, true),
    new THREE.MeshBasicMaterial({
      color: new THREE.Color('#f2dfa8'), transparent: true, opacity: .28,
      depthWrite: false, side: THREE.DoubleSide
    })
  );
  beam.position.y = 1.7; g.add(beam);

  var c1 = pmBox(1.05, 0.012, 0.028, lineM), c2 = pmBox(0.028, 0.012, 1.05, lineM);
  c1.position.y = 0.022; c2.position.y = 0.022; g.add(c1, c2);
  var ring = new THREE.Mesh(new THREE.TorusGeometry(0.44, 0.012, 4, 24), lineM);
  ring.rotation.x = Math.PI/2; ring.position.y = 0.022; g.add(ring);

  for (var i=0;i<4;i++){
    var seg = pmCyl(0.018, 0.018, 0.13, 6, (i%2===0) ? PM('#ddd6c8', .9) : PM('#a33f38', .9));
    seg.position.y = 0.085 + i*0.13; g.add(seg);
  }
  var flag = new THREE.Group();
  var fl = pmBox(0.20, 0.11, 0.008, PM('#d8b45a', .8));
  fl.position.set(0.10, 0.035, 0); flag.add(fl);
  flag.position.y = 0.60; g.add(flag);

  var sheet = pmBox(0.24, 0.006, 0.17, PM('#efe6d0', .95));
  sheet.position.set(0.24, 0.018, 0.10); sheet.rotation.y = 0.42; g.add(sheet);

  g.userData.beam = beam; g.userData.flag = flag;
  g.visible = false;
  scene.add(g);
  return g;
}

function useSkill(){
  var name = state.char, S = SKILL_DEFS[name];
  if (!S) return;

/* ---------------------------------------------------------------- 尺寸 */
function getViewportSize(){
  var vv = window.visualViewport;
  var w = Math.round((vv && vv.width)  || document.documentElement.clientWidth  || window.innerWidth  || 360);
  var h = Math.round((vv && vv.height) || document.documentElement.clientHeight || window.innerHeight || 640);
  return { w: w, h: h };
}
var _vpApplied = { w: 0, h: 0 };
function onResize(){
  var s = getViewportSize(), w = s.w, h = s.h;
  _vpApplied.w = w; _vpApplied.h = h;
  camera.aspect = w/h;
  camera.fov = (h > w) ? 68 : 58;
  camera.updateProjectionMatrix();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  /* 有些 WebView 的 100vh 在转屏后不刷新，用真实像素兜底 */
  document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
  document.documentElement.style.setProperty('--vw', (w * 0.01) + 'px');
}
/* 转屏后 1.5s 内轮询：部分机型既不派发 resize，orientationchange 时宽高也还是旧值 */
var _vpTimer = null;
function watchViewport(){
  if (_vpTimer) clearInterval(_vpTimer);
  var t0 = Date.now(), last = getViewportSize();
  _vpTimer = setInterval(function(){
    var s = getViewportSize();
    if (s.w !== last.w || s.h !== last.h){ last = s; onResize(); }
    if (Date.now() - t0 > 1500){ clearInterval(_vpTimer); _vpTimer = null; }
  }, 100);
}
function onOrientChange(){
  onResize();
  watchViewport();
  setTimeout(onResize, 260);
  setTimeout(onResize, 620);
}
window.addEventListener('resize', onResize);
window.addEventListener('pageshow', onOrientChange);
window.addEventListener('focus', onOrientChange);
window.addEventListener('orientationchange', onOrientChange);
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
if (window.screen && screen.orientation && screen.orientation.addEventListener)
  screen.orientation.addEventListener('change', onOrientChange);
onResize();

/* 首次触摸：解除宿主 WebView 可能设置的竖屏锁定，并尝试全屏（失败静默）。
   不强制横屏，只是把"能不能转"交还给系统。 */
var _orientTried = false;
function tryEnableLandscape(){
  if (_orientTried) return;
  _orientTried = true;
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){}
  var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (touch){
    try {
      var el = document.documentElement;
      if (el.requestFullscreen && !document.fullscreenElement){
        var pr = el.requestFullscreen({ navigationUI: 'hide' });
        if (pr && pr.catch) pr.catch(function(){});
      }
    } catch(e){}
  }
  watchViewport();
}
window.addEventListener('pointerdown', tryEnableLandscape, { once: true, passive: true });
window.addEventListener('touchend', tryEnableLandscape, { once: true, passive: true });

/* 兜底看守：部分国产 WebView 转屏后既不发 resize 也不发 orientationchange，
   每 400ms 对比一次真实宽高，只要变了就重排。开销可忽略。 */
setInterval(function(){
  var s = getViewportSize();
  if (Math.abs(s.w - _vpApplied.w) > 1 || Math.abs(s.h - _vpApplied.h) > 1) onResize();
}, 400);

  cdisEl.textContent = '回家 ' + Math.round(dist);
