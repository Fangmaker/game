/* ---------------------------------------------------------------- 小羊行为 */
var _shR = new V3(), _shAxis = new V3(), _shM = new THREE.Matrix4(), _shQ = new QT();
var _shTmp = new V3(), _shPrevUp = new V3();
function updateSheep(dt){
  var s = sheep;
  var d2p = Math.acos(clamp(s.up.dot(playerUp), -1, 1)) * PLANET_R;
  _shPrevUp.copy(s.up);

  /* 玫瑰被动「带刺」：没骑的时候，羊靠太近会被扎退 */
  if (activeRig.kind === 'rose' && !ride.on && d2p < 1.55){
    var pk = s.up.clone().addScaledVector(playerUp, -s.up.dot(playerUp));
    if (pk.lengthSq() < 1e-6) pk.copy(heading);
    pk.normalize();
    s.up = stepDir(s.up, pk, 1.15*dt);
    s.dir.copy(pk).addScaledVector(s.up, -pk.dot(s.up)).normalize();
    if (Date.now() - skill.prickCd > 650){
      skill.prickCd = Date.now();
      spawnSparkle(s.up.clone().multiplyScalar(s.r + 0.32), s.up, 4, '#d7f0b8');
    }
  }

  if (ride.on){
    if (rideMoving){
      var tgt = _shTmp.copy(rideMove).addScaledVector(s.up, -rideMove.dot(s.up));
      if (tgt.lengthSq() > 1e-8){
        tgt.normalize();
        /* 视觉朝向：限速转向，留出自然偏角 */
        s.dir.addScaledVector(s.up, -s.dir.dot(s.up));
        if (s.dir.lengthSq() < 1e-8) s.dir.copy(tgt); else s.dir.normalize();
        var ang = Math.acos(clamp(s.dir.dot(tgt), -1, 1));
        if (ang > 1e-4){
          /* 切平面内按固定角速度转：对跖点不再因 lerp 退化而永远转不过身或 ±180° 跳变 */
          _shAxis.crossVectors(s.dir, tgt);
          if (_shAxis.lengthSq() < 1e-8) _shAxis.crossVectors(s.up, s.dir);
          if (_shAxis.lengthSq() < 1e-8) _shAxis.set(1,0,0).cross(s.up);
          s.dir.applyAxisAngle(_shAxis.normalize(), Math.min(ang, 3.0*dt));
          s.dir.addScaledVector(s.up, -s.dir.dot(s.up)).normalize();
        }
        /* 位置直接按输入推进：想去哪就去哪 */
        s.up = stepDir(s.up, tgt, 7.0*dt);
      }
      s.moving = damp(s.moving, 1, 7, dt);
    } else {
      s.moving = damp(s.moving, 0, 7, dt);
    }
  } else if (s.friend){
    if (d2p > 2.1){
      var toP = playerUp.clone().addScaledVector(s.up, -playerUp.dot(s.up));
      if (toP.lengthSq() > 1e-8){
        toP.normalize();
        s.dir.lerp(toP, 1 - Math.exp(-4*dt)).normalize();
        var spd = Math.min(3.6, 1.4 + (d2p - 2.1) * 1.5);
        s.up = stepDir(s.up, s.dir, spd*dt);
        s.moving = damp(s.moving, 1, 6, dt);
      }
    } else {
      s.moving = damp(s.moving, 0, 6, dt);
    }
  } else {
    s.timer -= dt;
    var away = Math.acos(clamp(s.up.dot(SHEEP_HOME), -1, 1)) * PLANET_R;
    if (s.timer <= 0 || away > 5.5 || s.dir.lengthSq() < 0.1){
      s.timer = 2.4 + Math.random()*3.2;
      var tgt = (away > 5.5) ? SHEEP_HOME
        : dirNear(s.up, (Math.random()-0.5)*7, (Math.random()-0.5)*7);
      var toT = tgt.clone().addScaledVector(s.up, -tgt.dot(s.up));
      if (toT.lengthSq() > 1e-8) s.dir.copy(toT.normalize());
    }
    s.up = stepDir(s.up, s.dir, 1.15*dt);
    s.moving = damp(s.moving, 0.85, 6, dt);
  }

  /* 实心阻挡：骑着也不能穿进火山 */
  _solidPos.copy(s.up).multiplyScalar(s.r);
  if (collideSolids(_solidPos, 0.52, true)) s.up.copy(_solidPos).normalize();

  /* 地形高度：坑要跟着下去，挖穿的洞不悬空 */
  var gR = groundRadiusAt(s.up);
  if (gR < 0){
    if (!ride.on && !s.air){ s.up.copy(_shPrevUp); s.moving = 0; }
    else s.air = true;
  } else if (!s.air){
    if (gR >= s.r) s.r = Math.min(gR, s.r + 7*dt);
    else if (s.r - gR > 0.45){ s.air = true; s.vr = 0; }
    else s.r = Math.max(gR, s.r - 7*dt);
  }
  if (s.air){
    s.vr -= 17*dt;
    s.r += s.vr*dt;
    if (gR >= 0 && s.r <= gR){
      s.r = gR; s.air = false; s.vr = 0;
    } else if (s.r < CORE_R + 0.9){
      /* 从星球另一头掉出来：落到真实地面，朝向按新法线重投影，别让羊横躺在洞里 */
      s.up.copy(findLandingDir(s.up.clone().negate()));
      s.air = false; s.vr = 0;
      s.r = Math.max(groundRadiusAt(s.up), PLANET_R - DIG_DEPTH_MAX) + 0.30;
      if (!ride.on) toast('小羊从星球另一头钻了出来。');
    }
  }

  /* 清掉 dir 在 up 上的径向分量：up 每帧沿球面前进后 dir 会带一点径向分量，
     不清理会让 makeBasis 拿到非正交基，四元数不再单位化（姿态轻微扭曲、帧间转角虚高） */
  s.dir.addScaledVector(s.up, -s.dir.dot(s.up));
  if (s.dir.lengthSq() < 1e-8) s.dir.set(1,0,0).cross(s.up);
  if (s.dir.lengthSq() < 1e-8) s.dir.set(0,0,1).cross(s.up);
  s.dir.normalize();
  _shR.crossVectors(s.up, s.dir);
  if (_shR.lengthSq() < 1e-8){
    /* dir 被地形/碰撞推到与 up 共线时，重建一个切向，避免 makeBasis 拿到零向量 */
    s.dir.set(1,0,0).cross(s.up);
    if (s.dir.lengthSq() < 1e-8) s.dir.set(0,0,1).cross(s.up);
    s.dir.normalize();
    _shR.crossVectors(s.up, s.dir);
  }
  _shR.normalize();
  _shM.makeBasis(_shR, s.up, s.dir);
  _shQ.setFromRotationMatrix(_shM);
  s.group.quaternion.copy(_shQ);
  s.group.position.copy(s.up).multiplyScalar(s.r).addScaledVector(s.up, -0.02);
  s.group.position.addScaledVector(s.up, Math.abs(Math.sin(s.phase*2))*0.02*s.moving);

  s.phase += dt * (ride.on ? 15 : 9) * s.moving;
  for (var i=0;i<s.legs.length;i++){
    s.legs[i].rotation.x = Math.sin(s.phase + i*1.7) * 0.55 * s.moving;
  }
}

/* ---------------------------------------------------------------- 骑乘 */
function mount(){
  if (ride.on || !sheep.friend) return;
  ride.on = true;
  rideMoving = false;
  playerUp.copy(sheep.up);
  playerR = sheep.r + 0.30;
  headingQ.copy(sheep.group.quaternion);
  ghost.visible = false;
  toast('骑上小羊了。摇杆直接指挥它。');
  refreshInv();
  refreshQuests();
}
function dismount(){
  if (!ride.on) return;
  var side = new V3().crossVectors(sheep.up, sheep.dir);
  if (side.lengthSq() < 1e-6) side.set(1, 0, 0);
  side.normalize();
  var spot = null;
  for (var i=0;i<2;i++){
    var d = stepDir(sheep.up, side.clone().multiplyScalar(i ? -1 : 1), 1.4);
    if (groundRadiusAt(d) < 0) continue;
    spot = d;
    break;
  }
  if (!spot){ toast('这边站不下，往前走两步再下。'); return; }
  ride.on = false;
  var p = spot.clone().multiplyScalar(PLANET_R);
  collideSolids(p, 0.34);
  playerUp.copy(p).normalize();
  snapHeadingToUp();
  var gR2 = groundRadiusAt(playerUp);
  playerR = gR2 < 0 ? PLANET_R : gR2;
  falling = false; playerVR = 0;
  ghost.visible = false;
  toast('下羊了。');
  refreshInv();
  refreshQuests();
}


/* ---------------------------------------------------------------- 主循环 */
var tmpV1 = new V3(), tmpV2 = new V3(), tmpV3 = new V3();
var tmpQ1 = new QT(), tmpM1 = new THREE.Matrix4();
var _prevUp = new V3(), _newUp = new V3(), _right = new V3();
var _actKey = '';

/* playerUp 瞬间改写（掉穿到另一头、下羊）后，把角色骨架直接对齐新法线。
   不强转的话 headingQ 只在移动时才插值，站着不动就会一直横躺在地表上。 */
function snapHeadingToUp(){
  var f = new V3(0, 0, 1).applyQuaternion(headingQ);
  f.addScaledVector(playerUp, -f.dot(playerUp));
  if (f.lengthSq() < 1e-6){
    f.set(0, 0, 1).addScaledVector(playerUp, -playerUp.z);
    if (f.lengthSq() < 1e-6) f.set(1, 0, 0).addScaledVector(playerUp, -playerUp.x);
  }
  f.normalize();
  heading.copy(f);
  tmpV3.crossVectors(playerUp, f).normalize();
  tmpM1.makeBasis(tmpV3, playerUp, f);
  headingQ.setFromRotationMatrix(tmpM1);
}

/* 穿出通洞后找一个真正有地面的落点：避免直接落在另一个洞口/坑壁上 */
function findLandingDir(u){
  if (groundRadiusAt(u) >= 0) return u.clone();
  var t1 = new V3().crossVectors(u, new V3(0,1,0));
  if (t1.lengthSq() < 1e-8) t1.set(1,0,0).cross(u);
  t1.normalize();
  var t2 = new V3().crossVectors(u, t1).normalize();
  for (var rad = 0.35; rad <= 1.7; rad += 0.25){
    for (var k = 0; k < 8; k++){
      var a = k * Math.PI / 4;
      var d = stepDir(u, t1.clone().multiplyScalar(Math.cos(a)).addScaledVector(t2, Math.sin(a)), rad);
      if (groundRadiusAt(d) >= 0) return d;
    }
  }
  return u.clone();
}

/* 站在地表：贴地、能迈上一层台阶；没有支撑就掉下去 */
function updatePlayerGround(dt){
  var gR = groundRadiusAt(playerUp);
  if (gR < 0){
    falling = true;
    if (!fallCam){
      /* 第一次踩空：记下洞口上方的机位，下落期间镜头就留在这儿看角色落下去 */
      fallCam = true;
      fallCamPos.copy(camera.position);
      if (fallCamPos.length() < PLANET_R + 0.35) fallCamPos.setLength(PLANET_R + Math.max(2.4, camDist*0.55));
    }
  } else if (!falling){
    if (gR >= playerR){
      playerR = Math.min(gR, playerR + 7.0*dt);
    } else if (playerR - gR > 0.42){
      falling = true; playerVR = 0;
    } else {
      playerR = Math.max(gR, playerR - 7.0*dt);
    }
  }
  if (falling){
    /* 小王子被动：围巾兜风，下落速度减半 */
    playerVR -= (activeRig.kind === 'prince' ? 8.5 : 17) * dt;
    playerR += playerVR*dt;
    if (gR >= 0 && playerR <= gR){
      playerR = gR;
      falling = false; playerVR = 0;
      /* 落地姿态兜底：只有明显歪了才掰正，正常行走插值不覆盖 */
      if (new V3(0,1,0).applyQuaternion(headingQ).dot(playerUp) < 0.98) snapHeadingToUp();
      spawnDust(playerUp.clone().multiplyScalar(playerR), playerUp);
    } else if (playerR < CORE_R + 0.9){
      /* 挖穿掉下去：落到内核前从星球另一头出来，不落进虚空 */
      playerUp.copy(findLandingDir(playerUp.clone().negate()));
      snapHeadingToUp();
      /* 直接贴在新地面的实际高度上，避免 0.5 的二次跌落触发 falling */
      var lg = groundRadiusAt(playerUp);
      playerR = Math.max(lg, PLANET_R - DIG_DEPTH_MAX) + 0.04;
      playerVR = 0; falling = false;
      state.fell = true;
      var cp = playerUp.clone().multiplyScalar(playerR);
      spawnSparkle(cp, playerUp, 16, '#cfe4ff');
      toast('穿过星球，从另一头落了出来。');
      /* 镜头立刻搬到新位置，避免穿过球体 */
      var nf = new V3().copy(heading).addScaledVector(playerUp, -heading.dot(playerUp));
      if (nf.lengthSq() < 1e-6) nf.set(0,1,0).cross(playerUp);
      nf.normalize();
      camF.copy(nf);
      camera.position.copy(cp).addScaledVector(playerUp, 2.4).addScaledVector(nf, -3.4);
      persist();
      /* 让「穿过星球」的提示先说完，再结算任务奖励 */
      setTimeout(refreshQuests, 1600);
    }
  }
  if (!falling){ fallCam = false; }
}

/* ---------------------------------------------------------------- 怪物 / 战斗
   第二批：地表会刷新根须怪（猴面包树的根）。它们追人、贴脸咬人；
   玩家按 E / 空格（或右下动作键）攻击，耗尽血条后散成一堆星尘。
   死亡沿用 onPlayerDown：怪全清、回井边重来。 */
var MOB_MAX = 3;
var MOB_HP = 60, MOB_DMG = 8, MOB_ATK_CD = 1.1, MOB_RANGE = 1.35;
var MOB_SPEED = 1.8, MOB_AGGRO = 8.5, MOB_SPAWN_CD = 6.0, MOB_MIN_D = 9.5, MOB_MAX_D = 14.0;
/* 三种怪：根须怪（快、弱）、石甲虫（慢、硬、冲刺）、巨岩守卫（Boss，震地） */
var MOB_KIND = {
  root: { hp:60,  dmg:8,  atkCd:1.1, range:1.35, speed:1.80, aggro:8.5,  scale:1.00, name:'根须怪' },
  rock: { hp:104, dmg:12, atkCd:1.5, range:1.55, speed:1.05, aggro:6.5,  scale:1.16, name:'石甲虫' },
  boss: { hp:420, dmg:19, atkCd:2.0, range:2.10, speed:1.45, aggro:12.0, scale:2.05, name:'巨岩守卫' }
};
var HIT_DMG = 22, HIT_RANGE = 2.2, HIT_CD = 0.45;
var mobs = [], mobSpawnT = 4.0, atkCd = 0, MOB_ENABLED = true, mobHinted = false, mobHintedRock = false;
var bossSpawnT = 0;

function buildMob(kind){
  kind = kind || 'root';
  var K = MOB_KIND[kind] || MOB_KIND.root;
  var S = K.scale;
  var g = new THREE.Group();
  var bodyCol = kind === 'rock' ? '#6b7078' : (kind === 'boss' ? '#4b3a32' : '#453730');
  var rootCol = kind === 'rock' ? '#4a4e55' : (kind === 'boss' ? '#2f2622' : '#2c231f');
  var eyeCol  = kind === 'rock' ? '#7fe3ff' : (kind === 'boss' ? '#ffcf6b' : '#ff6a4d');
  var mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(bodyCol), roughness: 1, flatShading: true });
  var rootMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(rootCol), roughness: 1, flatShading: true });
  var eyeMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(eyeCol) });

  var body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42 * S, 1), mat);
  body.position.y = 0.56 * S;
  body.scale.set(1, 0.94, 1);
  g.add(body);
  /* 树瘤 / 石甲：背上的疙瘩 */
  for (var b=0;b<2;b++){
    var knot = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2 * S, 0), mat);
    knot.position.set((b?0.28:-0.26) * S, 0.68 * S, (b?0.1:-0.14) * S);
    knot.scale.set(1, 0.8, 1);
    g.add(knot);
  }
  /* 石甲虫：背上一排晶簇；Boss：肩甲 + 头角 */
  if (kind === 'rock'){
    var cryMat = new THREE.MeshStandardMaterial({ color: new THREE.Color('#9fe6f7'),
      emissive: new THREE.Color('#1d4a55'), roughness: .35, flatShading: true });
    for (var c=0;c<3;c++){
      var cry = new THREE.Mesh(new THREE.ConeGeometry(0.09 * S, 0.30 * S, 5), cryMat);
      cry.position.set((c-1) * 0.17 * S, (0.80 + (c===1?0.08:0)) * S, -0.02 * S);
      cry.rotation.x = -0.25;
      g.add(cry);
    }
  }
  if (kind === 'boss'){
    var plateMat = new THREE.MeshStandardMaterial({ color: new THREE.Color('#8a6440'), roughness: .95, flatShading: true });
    for (var q=0;q<5;q++){
      var ang = q / 5 * Math.PI * 2;
      var plate = new THREE.Mesh(new THREE.BoxGeometry(0.30 * S, 0.16 * S, 0.20 * S), plateMat);
      plate.position.set(Math.cos(ang) * 0.42 * S, 0.42 * S, Math.sin(ang) * 0.42 * S);
      plate.lookAt(new V3(0, 0, 0));
      g.add(plate);
    }
    for (var h=0;h<2;h++){
      var horn = new THREE.Mesh(new THREE.ConeGeometry(0.10 * S, 0.42 * S, 5), plateMat);
      horn.position.set((h?0.20:-0.20) * S, 0.95 * S, 0.10 * S);
      horn.rotation.z = (h ? -0.35 : 0.35);
      g.add(horn);
    }
  }
  /* 两只眼睛 */
  for (var e=0;e<2;e++){
    var eye = new THREE.Mesh(new THREE.SphereGeometry(0.045 * S, 6, 4), eyeMat);
    eye.position.set((e?0.13:-0.13) * S, 0.63 * S, 0.38 * S);
    g.add(eye);
  }
  /* 四条根须腿，会随走路摆动 */
  var legs = [];
  for (var l=0;l<4;l++){
    var hip = new THREE.Group();
    hip.position.set((l<2?0.22:-0.22) * S, 0.3 * S, (l%2?0.2:-0.2) * S);
    var leg = new THREE.Mesh(new THREE.ConeGeometry(0.075 * S, 0.42 * S, 5), rootMat);
    leg.position.y = -0.2 * S;
    hip.add(leg);
    g.add(hip);
    legs.push(hip);
  }
  /* 血条：背对镜头的两块小片，始终朝向相机 */
  var barG = new THREE.Group();
  barG.position.y = 0.97 * S;
  var bw = 0.86 * S;
  var bg = new THREE.Mesh(new THREE.PlaneGeometry(bw, 0.095 * S),
    new THREE.MeshBasicMaterial({ color: new THREE.Color('#160f0c'), transparent: true, opacity: .72, depthWrite: false }));
  var fill = new THREE.Mesh(new THREE.PlaneGeometry(bw, 0.095 * S),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(kind==='boss' ? '#ffb14d' : '#e0705a'), transparent: true, depthWrite: false }));
  fill.position.z = 0.002;
  barG.add(bg); barG.add(fill);
  g.add(barG);

  scene.add(g);
  return { group: g, mat: mat, body: body, legs: legs, barG: barG, bar: fill, bw: bw };
}

function spawnMob(kind){
  kind = kind || 'root';
  var K = MOB_KIND[kind] || MOB_KIND.root;
  var up = null;
  for (var t=0;t<10;t++){
    var axis = new V3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5);
    axis.addScaledVector(playerUp, -axis.dot(playerUp));
    if (axis.lengthSq() < 1e-6) continue;
    axis.normalize();
    var d = (kind === 'boss' ? 12.5 : MOB_MIN_D + Math.random() * (MOB_MAX_D - MOB_MIN_D));
    var cand = stepDir(playerUp, axis, d);
    if (groundRadiusAt(cand) > 0){ up = cand; break; }
  }
  if (!up) return null;
  var M = buildMob(kind);
  var m = {
    kind: kind, K: K,
    group: M.group, mat: M.mat, body: M.body, legs: M.legs, barG: M.barG, bar: M.bar,
    bw: M.bw, baseY: 0.56 * K.scale,
    up: up, r: groundRadiusAt(up), dir: new V3(), hp: K.hp, maxHp: K.hp,
    phase: Math.random() * 6.28, atkCd: K.atkCd, hurt: 0, lunge: 0, dead: 0, slam: 0, slamHit: false, dash: 0
  };
  m.dir = new V3().crossVectors(m.up, new V3(0, 1, 0));
  if (m.dir.lengthSq() < 1e-6) m.dir.set(1, 0, 0);
  m.dir.normalize();
  mobs.push(m);
  m.bornD = mobDist(m);
  m.bornP = playerUp.clone();
  if (kind === 'boss'){
    toast('地底传来闷响——巨岩守卫醒了。它会在脚下震地，别贴太近。', 'quest');
  } else if (kind === 'rock' && !mobHintedRock){
    mobHintedRock = true;
    toast('石甲虫钻出来了：比根须怪硬，会蓄力冲刺。打碎了掉矿石。');
  } else if (kind === 'root' && !mobHinted){
    mobHinted = true;
    toast('土里拱出来一只根须怪——按 E / 右下动作键揍它。');
  }
  return m;
}

/* 怪物离玩家多远（米，沿球面弧长） */
function mobDist(m){
  return Math.acos(clamp(m.up.dot(playerUp), -1, 1)) * PLANET_R;
}
function mobInRange(range){
  for (var i=0;i<mobs.length;i++){
    if (!mobs[i].dead && mobDist(mobs[i]) < range) return true;
  }
  return false;
}
function killMob(m, cause){
  if (m.dead) return;
  m.dead = 1;
  m.barG.visible = false;
  if (cause === 'down' || cause === 'test') return;
  var kind = m.kind || 'root';
  state.kills = (state.kills || 0) + 1;
  if (kind === 'boss'){
    state.inv[3] = (state.inv[3]|0) + 6;
    state.inv[2] = (state.inv[2]|0) + 2;
    state.dust += 15;
    state.bossDown = 1;
    gainXp(XP_KILL * 6);
    toast('巨岩守卫碎了：+15 星尘、6 矿石、2 木材。它不会再醒了。', 'quest');
  } else if (kind === 'rock'){
    state.inv[3] = (state.inv[3]|0) + 2;
    state.dust += 2;
    gainXp(XP_KILL * 2);
    toast('石甲虫碎了，捡到 2 矿石、2 星尘。');
  } else {
    state.dust += 3;
    gainXp(XP_KILL);
    toast('根须怪散了，捡到 3 星尘。');
  }
  refreshChips();
  if (typeof refreshInv === 'function') refreshInv();
  if (typeof refreshCraft === 'function') refreshCraft();
  persist();
  queueUnlockCheck(900);
}
function clearMobs(cause){
  for (var i=0;i<mobs.length;i++) killMob(mobs[i], cause || 'down');
  mobSpawnT = 4.0;
}
/* 玩家出手：命中最近的怪，掉血、硬直、击退 */
function attackNearby(){
  if (!MOB_ENABLED || ride.on || sunset.active || state.hp <= 0) return false;
  if (atkCd > 0) return false;
  var best = null, bd = 1e9;
  for (var i=0;i<mobs.length;i++){
    var m = mobs[i];
    if (m.dead) continue;
    var d = mobDist(m);
    if (d < HIT_RANGE && d < bd){ bd = d; best = m; }
  }
  if (!best) return false;
  atkCd = HIT_CD;
  best.hp -= hitDmg();
  best.hurt = 0.16;
  best.atkCd = Math.max(best.atkCd, 0.55);
  best.lunge = 0.22;
  /* 打退半步，别被贴身咬死 */
  var away = new V3().crossVectors(playerUp, best.up);
  if (away.lengthSq() < 1e-6) away.copy(heading);
  away.normalize();
  var nudged = stepDir(best.up, away, 0.26);
  if (groundRadiusAt(nudged) > 0) best.up.copy(nudged);
  var hitP = best.up.clone().multiplyScalar(best.r + 0.55);
  spawnSparkle(hitP, best.up, 8, '#ffd0a8');
  if (best.hp <= 0) killMob(best);
  return true;
}

function updateMobs(dt){
  if (atkCd > 0) atkCd -= dt;
  if (MOB_ENABLED && !sunset.active && state.hp > 0){
    /* 小怪上限只数非 Boss：Boss 不占名额 */
    var basic = 0, hasBoss = false;
    for (var bi=0;bi<mobs.length;bi++){
      if (mobs[bi].dead) continue;
      if (mobs[bi].kind === 'boss') hasBoss = true; else basic++;
    }
    mobSpawnT -= dt;
    if (mobSpawnT <= 0 && basic < MOB_MAX){
      mobSpawnT = MOB_SPAWN_CD;
      /* 打过 2 只以后，自然刷新开始混入石甲虫 */
      var pickRock = (state.kills|0) >= 2 && Math.random() < 0.45;
      spawnMob(pickRock ? 'rock' : 'root');
    }
    /* Boss：击杀满 6 只后觉醒，只出一次 */
    if (!state.bossDown && !hasBoss){
      if (bossSpawnT > 0) bossSpawnT -= dt;
      if ((state.kills|0) >= 6 && bossSpawnT <= 0){
        bossSpawnT = 20;
        spawnMob('boss');
      }
    }
  }
  for (var i=mobs.length-1;i>=0;i--){
    var m = mobs[i];
    if (m.dead){
      m.dead += dt * 2.2;
      var s = Math.max(0.0001, 1 - m.dead);
      m.group.scale.setScalar(s);
      m.group.position.y += dt * 0.6;
      if (m.dead >= 1){ scene.remove(m.group); mobs.splice(i, 1); }
      continue;
    }
    if (m.hurt > 0){
      m.hurt -= dt;
      m.mat.emissive.setHex(m.hurt > 0 ? 0xd8553a : 0x000000);
    }
    m.atkCd -= dt;
    if (m.lunge > 0) m.lunge -= dt;
    if (m.dash > 0) m.dash -= dt;
    if (m.barG && m.kind === 'boss'){
      /* Boss 震地读条时，血条微微放大当预警 */
      m.barG.scale.setScalar(m.slam > 0 ? 1.25 : 1);
    }

    var K = m.K || MOB_KIND.root;
    var range = K.range, aggro = K.aggro;
    var d = mobDist(m);
    /* 石甲虫：慢吞吞靠近，隔一段距离蓄力冲刺一次 */
    if (m.kind === 'rock' && !ride.on && state.hp > 0 && m.dash <= 0 &&
        m.atkCd <= 0 && d > range * 1.2 && d < 5.5){
      m.dash = 0.55;
      m.atkCd = 3.0;
      toast('石甲虫蓄力了——先闪开。');
    }
    var chase = d < aggro && d > range * 0.9 && !sunset.active && state.hp > 0 && !ride.on;
    if (!ride.on && state.hp > 0 && d > range * 0.9 && d < aggro){
      var toP = new V3().copy(playerUp).addScaledVector(m.up, -playerUp.dot(m.up));
      if (toP.lengthSq() > 1e-8){
        toP.normalize();
        m.dir.lerp(toP, 1 - Math.exp(-6 * dt));
        if (m.dir.lengthSq() > 1e-8){
          m.dir.addScaledVector(m.up, -m.dir.dot(m.up));
          if (m.dir.lengthSq() > 1e-8) m.dir.normalize();
        }
        if (chase){
          var spd = K.speed * (m.dash > 0 ? 2.8 : 1);
          m.up.copy(stepDir(m.up, toP, Math.min(spd * dt, Math.max(0, d - range * 0.85))));
          m.phase += dt * (m.dash > 0 ? 14 : 7);
        }
      }
      var gr = groundRadiusAt(m.up);
      m.r = gr > 0 ? gr : PLANET_R - DIG_DEPTH_MAX;
    } else {
      m.phase += dt * 1.6;
    }
    /* Boss：贴到 4.2 米就震地，落点结算一圈伤害 */
    if (m.kind === 'boss'){
      if (!ride.on && state.hp > 0 && d <= 4.2 && m.atkCd <= 0 && m.slam <= 0){
        m.slam = 0.6;
        m.slamHit = false;
        m.atkCd = 3.2;
        m.lunge = 0.35;
        spawnSparkle(m.up.clone().multiplyScalar(m.r + 0.3), m.up, 20, '#ffb14d');
        toast('巨岩守卫抬起了脚——震地！');
      }
      if (m.slam > 0){
        m.slam -= dt;
        if (m.slam <= 0 && !m.slamHit){
          m.slamHit = true;
          var ringP = m.up.clone().multiplyScalar(m.r + 0.12);
          spawnSparkle(ringP, m.up, 26, '#ffcf6b');
          if (!ride.on && state.hp > 0 && mobDist(m) < 4.0) hurtPlayer(K.dmg + 6, 'mob');
        }
      }
    }
    /* 贴脸咬人（Boss 用震地，不咬） */
    if (m.kind !== 'boss' && !ride.on && state.hp > 0 && d <= range && m.atkCd <= 0){
      m.atkCd = K.atkCd;
      m.lunge = 0.3;
      var mouth = m.up.clone().multiplyScalar(m.r + 0.4);
      spawnSparkle(mouth, m.up, 10, '#ff8a6a');
      hurtPlayer(K.dmg, 'mob');
    }
    /* 摆姿态 */
    var p = m.up.clone().multiplyScalar(m.r);
    m.group.position.copy(p);
    var mx = new V3().crossVectors(m.up, m.dir);
    mx.normalize();
    if (mx.lengthSq() > 1e-8){
      tmpM1.makeBasis(mx, m.up, m.dir);
      m.group.quaternion.setFromRotationMatrix(tmpM1);
    }
    var bobK = K.scale || 1;
    m.body.position.y = (m.baseY || 0.56) + Math.sin(m.phase) * 0.03 * bobK;
    m.body.rotation.z = Math.sin(m.phase * 0.5) * 0.06;
    for (var l=0;l<4;l++){
      m.legs[l].rotation.x = Math.sin(m.phase + l * 1.6) * 0.32;
    }
    m.group.position.addScaledVector(m.up, Math.sin(m.phase * 0.5) * 0.02 + (m.lunge > 0 ? 0.05 : 0) +
      (m.slam > 0 ? -Math.sin(m.slam / 0.6 * Math.PI) * 0.10 : 0));
    /* 血条：朝向相机、按血量缩 */
    if (m.barG){
      m.barG.visible = d < (m.kind === 'boss' ? 40 : 26);
      m.barG.quaternion.copy(m.group.quaternion).invert().multiply(camera.quaternion);
      var ratio = Math.max(0.001, m.hp / m.maxHp);
      m.bar.scale.x = ratio;
      m.bar.position.x = -(1 - ratio) * (m.bw || 0.86) * 0.5;
    }
    if (m.hurt <= 0 && m.mat.emissive.getHex() !== 0x000000) m.mat.emissive.setHex(0x000000);
  }
}

function updatePlanet(dt){
  var ix = 0, iy = 0;
  if (keys.KeyW || keys.ArrowUp) iy += 1;
  if (keys.KeyS || keys.ArrowDown) iy -= 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  ix += joy.x; iy += joy.y;
  var ilen = Math.hypot(ix, iy);
  if (ilen > 1){ ix /= ilen; iy /= ilen; ilen = 1; }
  if (ilen < 0.06){ ix = 0; iy = 0; ilen = 0; }

  var fwd = tmpV1.copy(camF).applyAxisAngle(playerUp, camYaw).normalize();
  /* camF 与当地 up 共线时给稳定切向，避免 right 退化后角色乱转 */
  if (tmpV2.crossVectors(fwd, playerUp).lengthSq() < 1e-8){
    fwd.copy(heading).addScaledVector(playerUp, -heading.dot(playerUp));
    if (fwd.lengthSq() < 1e-8){
      fwd.set(0,0,1).cross(playerUp);
      if (fwd.lengthSq() < 1e-8) fwd.set(1,0,0).cross(playerUp);
    }
    fwd.normalize();
  }
  _camFwdNow.copy(fwd);
  var right = tmpV2.crossVectors(fwd, playerUp).normalize();

  var move = tmpV3.set(0,0,0);
  if (ilen > 0){
    move.addScaledVector(fwd, iy).addScaledVector(right, ix);
    if (move.lengthSq() > 1e-6) move.normalize();
  }

  var moving = ilen > 0.06;
  var prevUp = _prevUp.copy(playerUp);

  if (ride.on){
    rideMove.copy(move);
    rideMoving = moving;
  } else {
    if (moving && !falling){
      /* 解析式球面推进：up' = normalize(up·cosθ + moveDir·sinθ) */
      /* 蛇被动「阴凉」：钻到坑里 / 洞里比平地快 25% */
      var snakeIn = (activeRig.kind === 'snake' && playerR < PLANET_R - 0.25) ? 1.25 : 1;
      var spd = 5.2 * (activeRig.kind === 'fox' ? 1.12 : snakeIn);
      var theta = (spd * dt) / PLANET_R;
      var newUp = _newUp.copy(playerUp).multiplyScalar(Math.cos(theta))
        .addScaledVector(move, Math.sin(theta)).normalize();
      playerUp.copy(newUp);

      var r = _right.crossVectors(playerUp, move).normalize();
      tmpM1.makeBasis(r, playerUp, move);
      tmpQ1.setFromRotationMatrix(tmpM1);
      headingQ.slerp(tmpQ1, 1 - Math.exp(-11*dt));
      heading.copy(move);
    }
    /* 实心物体挡人：沿轮廓推出去 = 贴着绕行 */
    _solidPos.copy(playerUp).multiplyScalar(playerR);
    if (collideSolids(_solidPos, 0.34)) playerUp.copy(_solidPos).normalize();
    updatePlayerGround(dt);
  }

  /* 小羊 / 骑乘：先同步玩家，再做镜头基准运输；否则骑乘时 prevUp===playerUp，camF 会永久冻结 */
  updateSheep(dt);
  if (ride.on){
    playerUp.copy(sheep.up);
    playerR = sheep.r + 0.30;
    falling = sheep.air;
    headingQ.copy(sheep.group.quaternion);
    heading.copy(sheep.dir);
  }

  /* 生存循环：口渴线性下降、干了掉血、体力回复。骑羊时也照走 */
  tickVitals(dt, moving);
  /* 怪物刷新 / 追击 / 咬人 */
  updateMobs(dt);

  /* 镜头基准平行运输，永不翻转。
     prevUp 与 playerUp 接近对跖（挖穿瞬移）时 setFromUnitVectors 轴不唯一，
     会把 camF 甩到随机方向 -> 镜头连续翻 180°，所以直接跳过，改用 heading 重建。 */
  var jump = prevUp.dot(playerUp) < -0.7;
  if (jump){
    camF.copy(heading).addScaledVector(playerUp, -heading.dot(playerUp));
    if (camF.lengthSq() < 1e-6){
      camF.set(0,0,1).cross(playerUp);
      if (camF.lengthSq() < 1e-8) camF.set(1,0,0).cross(playerUp);
    }
    camF.normalize();
  } else if (prevUp.distanceToSquared(playerUp) > 1e-12){
    tmpQ1.setFromUnitVectors(prevUp, playerUp);
    camF.applyQuaternion(tmpQ1);
    camF.addScaledVector(playerUp, -camF.dot(playerUp));
    if (camF.lengthSq() < 0.04){
      camF.copy(heading);
      camF.addScaledVector(playerUp, -camF.dot(playerUp));
    }
    if (camF.lengthSq() < 1e-8){
      camF.set(0,0,1).cross(playerUp);
      if (camF.lengthSq() < 1e-8) camF.set(1,0,0).cross(playerUp);
    }
    camF.normalize();
  }

  playerPos.copy(playerUp).multiplyScalar(playerR);

  princeRoot.position.copy(playerPos).addScaledVector(playerUp, -0.05);
  princeRoot.quaternion.copy(headingQ);

  moveAmount = damp(moveAmount, ride.on ? sheep.moving : (moving ? 1 : 0), 8, dt);
  walkPhase += dt * 10.5 * moveAmount;

  /* 角色姿态：每个角色各自的站姿 / 摆腿 / 骑乘坐姿 */
  var R = activeRig, B = rigBase(R), i, j;
  R.body.rotation.z = 0;
  if (ride.on){
    var P = RIDE_POSE[R.kind] || RIDE_POSE.prince;
    R.body.position.y = P.lift;
    if (P.type === 'fox'){
      /* 狐狸蜷在羊背上，四条腿收拢，不会出现人的坐姿 */
      for (i=0;i<R.legs.length;i++){
        R.legs[i].rotation.x = B.legX[i] + P.fold;
        R.legs[i].rotation.z = B.legZ[i];
      }
      if (R.parts.tail) R.parts.tail.rotation.x = P.tailX;
    } else if (P.type === 'rose'){
      /* 玫瑰没有胯：落低一点，根须腿盘在羊背两侧，玻璃罩先收进怀里 */
      for (i=0;i<R.legs.length;i++){
        R.legs[i].rotation.x = B.legX[i] - P.fold;
        R.legs[i].rotation.z = B.legZ[i] + (i === 0 ? P.spread : -P.spread);
      }
      if (R.parts.dome) R.parts.dome.visible = false;
      if (R.parts.domeRim) R.parts.domeRim.visible = false;
    } else if (P.type === 'snake'){
      /* 蛇没有腿：整盘压在羊背上，盘圈压扁一点，上半身往前探 */
      if (R.parts.coil) R.parts.coil.scale.set(1, P.coilY, 1);
      if (R.parts.sway) R.parts.sway.rotation.x = P.swayX;
    } else {
      /* 人形角色：按表里的高度 / 折腿 / 张开角度坐好，脚不沾地 */
      for (i=0;i<R.legs.length;i++){
        R.legs[i].rotation.x = B.legX[i] - P.fold;
        R.legs[i].rotation.z = B.legZ[i] + (i === 0 ? P.spread : -P.spread);
      }
      for (j=0;j<R.arms.length;j++) R.arms[j].rotation.x = B.armX[j] - P.armFold;
    }
  } else {
    R.body.position.y = Math.sin(walkPhase*2) * 0.034 * moveAmount;
    R.body.rotation.z = Math.sin(walkPhase) * 0.035 * moveAmount;
    if (R.kind === 'rose'){
      /* 下羊后把玻璃罩按换装设置戴回去 */
      if (R.parts.dome) R.parts.dome.visible = R._glass !== false;
      if (R.parts.domeRim) R.parts.domeRim.visible = R._glass !== false;
    }
    if (R.kind === 'fox'){
      /* 四足小跑：对角步态 */
      for (i=0;i<R.legs.length;i++){
        var sgn = (i === 0 || i === 3) ? 1 : -1;
        R.legs[i].rotation.x = B.legX[i] + Math.sin(walkPhase) * 0.58 * sgn * moveAmount;
        R.legs[i].rotation.z = B.legZ[i];
      }
    } else {
      if (R.legs[0]) R.legs[0].rotation.x = B.legX[0] + Math.sin(walkPhase) * 0.55 * moveAmount;
      if (R.legs[1]) R.legs[1].rotation.x = B.legX[1] - Math.sin(walkPhase) * 0.55 * moveAmount;
      for (i=0;i<R.legs.length;i++) R.legs[i].rotation.z = B.legZ[i];
      for (j=0;j<R.arms.length;j++){
        R.arms[j].rotation.x = B.armX[j] + (j === 0 ? -1 : 1) * Math.sin(walkPhase) * 0.42 * moveAmount;
      }
    }
  }
  if (R.parts.cape) R.parts.cape.rotation.x = 0.07 + Math.sin(elapsed*2.6)*0.03 + moveAmount*0.16;
  if (R.parts.tail && !ride.on) R.parts.tail.rotation.x = -0.22 + Math.sin(elapsed*2.2)*0.05 + moveAmount*0.10;
  if (R.parts.streamers) R.parts.streamers.rotation.x = Math.sin(elapsed*2.2)*0.06 + moveAmount*0.22;
  /* 蛇：脖子左右游、信子一闪一闪 */
  if (R.parts.sway){
    if (!ride.on) R.parts.sway.rotation.x = 0;
    R.parts.sway.rotation.y = Math.sin(elapsed*1.7)*0.075 + Math.sin(walkPhase*0.9)*0.05*moveAmount;
    R.parts.sway.rotation.z = Math.sin(elapsed*1.3)*0.03;
  }
  if (R.parts.coil && !ride.on) R.parts.coil.scale.y = 1;
  if (R.parts.tongue){
    R.parts.tongue.visible = (R._tongue !== false) && (Math.sin(elapsed*2.6) > 0.42);
    R.parts.tongue.rotation.x = 0.12 + Math.sin(elapsed*13)*0.05;
  }
  /* 商人：账本轻轻翻、耳后铅笔跟着算 */
  if (R.parts.ledger && !ride.on) R.parts.ledger.rotation.x = -0.35 + Math.sin(elapsed*1.5)*0.035;
  if (R.parts.pencil && !ride.on) R.parts.pencil.rotation.z = -0.62 + Math.sin(elapsed*2.4)*0.02;
  /* 地理学家：捧着书轻轻晃，像在核对手里的记录 */
  if (R.parts.book && !ride.on) R.parts.book.rotation.z = 0.08 + Math.sin(elapsed*1.1)*0.02;

  footShadow.position.copy(playerPos).addScaledVector(playerUp, 0.075);
  footShadow.quaternion.setFromUnitVectors(new V3(0,0,1), playerUp);
  footShadow.scale.setScalar(1 + Math.sin(walkPhase*2)*0.03*moveAmount);

  var camFwd = new V3().copy(camF).applyAxisAngle(playerUp, camYaw).normalize();
  var cdist = camDist + (ride.on ? 1.5 : 0);
  var camAnchor = new V3().copy(playerPos).addScaledVector(playerUp, ride.on ? 1.32 : activeRig.camH);
  var target = new V3().copy(playerPos)
    .addScaledVector(camFwd, -Math.cos(camPitch)*cdist)
    .addScaledVector(playerUp, Math.sin(camPitch)*cdist + (ride.on ? 0.3 : 0));
  var minR = Math.max(playerR + 0.9, PLANET_R + 0.45);
  /* 任何情况下机位都不许低于地壳（掉洞由 fallCam 单独处理），
     否则会顺着挖空的瓦片 / 洞口钻到地表下面看到地形背面 */
  if (target.length() < minR) target.setLength(minR);
  if (!camFree){
    if (fallCam){
      /* 掉进通洞：镜头留在洞口上方，只转视角看着角色落下去，不跟着入地 */
      camera.position.lerp(fallCamPos, 1 - Math.exp(-16*dt));
      camera.up.copy(playerUp);
      camera.lookAt(camAnchor);
    } else {
      /* 坑壁 / 山体 / 土墙遮挡：镜头沿视线采样，必要时向角色收紧 */
      var camWant = target.distanceTo(camAnchor);
      var occT = occludeCamera(camAnchor, target);
      /* 被挡到不足 72% 时会变成“贴脸机位”，整块土/坑壁横跨屏幕。
         先抬俯仰角；还不行就左右各试偏角，宁可换个角度也不贴脸。 */
      if (occT.distanceTo(camAnchor) < camWant*0.72){
        /* 不管是坑壁、土墙、井圈还是山体，被挡住就先抬俯仰角找机位 */
        for (var li=1; li<=7; li++){
          var pp = Math.min(1.42, camPitch + li*0.18);
          var lt = new V3().copy(playerPos)
            .addScaledVector(camFwd, -Math.cos(pp)*cdist)
            .addScaledVector(playerUp, Math.sin(pp)*cdist + (ride.on ? 0.3 : 0));
          if (lt.length() < minR) lt.setLength(minR);
          var lo = occludeCamera(camAnchor, lt);
          if (lo.distanceTo(camAnchor) > occT.distanceTo(camAnchor)) occT = lo;
          if (lo.distanceTo(lt) < 0.03) break;
        }
        if (occT.distanceTo(camAnchor) < camWant*0.72){
          for (var yi=0; yi<4; yi++){
            var yo = (yi % 2 ? -1 : 1) * (yi < 2 ? 0.22 : 0.44);
            var yoF = new V3().copy(camF).applyAxisAngle(playerUp, camYaw + yo).normalize();
            var yt = new V3().copy(playerPos)
              .addScaledVector(yoF, -Math.cos(camPitch)*cdist)
              .addScaledVector(playerUp, Math.sin(camPitch)*cdist + (ride.on ? 0.3 : 0));
            if (yt.length() < minR) yt.setLength(minR);
            var yo2 = occludeCamera(camAnchor, yt);
            if (yo2.distanceTo(camAnchor) > occT.distanceTo(camAnchor)) occT.copy(yo2);
          }
        }
      }
      camera.position.lerp(occT, 1 - Math.exp(-11*dt));
      /* 硬兜底：机位绝不停在土块里（那会看到整屏土壁的背面） */
      liftCameraOutOfSoil();
      camera.up.copy(playerUp);
      camera.lookAt(camAnchor);
    }
  }

  /* 交互探测：身边有怪时动作键先变成「攻击」 */
  var n = ride.on ? null : findNear();
  var mobNear = !ride.on && MOB_ENABLED && mobInRange(HIT_RANGE);
  nearTarget = mobNear ? null : n;
  var actKey = ride.on ? 'ride' : (mobNear ? 'mob|攻击' : (n ? n.type + '|' + n.label : ''));
  if (actKey !== _actKey){
    _actKey = actKey;
    if (ride.on){
      actBtn.classList.add('on');
      actLabel.textContent = '下来';
      setActIcon('ride');
    } else if (mobNear){
      actBtn.classList.add('on');
      actLabel.textContent = '攻击';
      setActIcon('hit');
    } else if (n){
      actBtn.classList.add('on');
      actLabel.textContent = n.label;
      setActIcon(n.icon);
    } else {
      actBtn.classList.remove('on');
    }
  }

  /* 猴面包树生长 / 消失 */
  for (var i=0;i<baobabs.length;i++){
    var b = baobabs[i];
    if (b.alive && b.grow < 1){
      b.grow = Math.min(1, b.grow + dt*1.8);
      var ge = 1 - Math.pow(1 - b.grow, 3);
      b.inner.scale.setScalar(Math.max(0.0001, ge));
      b.inner.rotation.z = (1-ge) * -0.4;
    }
    /* 浇水长大时整棵树平滑放大，别一帧跳变 */
    var _cs = b.root.scale.x;
    if (Math.abs(_cs - b.tscale) > 0.001){
      var _ns = damp(_cs, b.tscale, 7, dt);
      b.root.scale.setScalar(_ns);
    }
    if (!b.alive && b.anim > 0){
      b.anim += dt;
      var t = clamp(b.anim/0.4, 0, 1);
      b.inner.scale.setScalar(Math.max(0.0001, 1 - t));
      b.inner.rotation.z = t * 0.8;
      if (t >= 1){ b.root.visible = false; b.anim = 0; }
    }
  }

  /* 盖土的半透明预览 */
  updateGhost();

  /* 玫瑰 / 花园 */
  roseBloomScale = damp(roseBloomScale, ROSE_SCALES[state.roseStage], 5, dt);
  roseBloom.scale.setScalar(roseBloomScale * (1 + Math.sin(elapsed*1.6)*0.02));
  if (roseLight) roseLight.intensity = damp(roseLight.intensity, state.roseStage >= 3 ? (1.3 + Math.sin(elapsed*2.2)*0.15) : 0.2*state.roseStage, 4, dt);

  for (var g=0;g<gardenFlowers.length;g++){
    var f = gardenFlowers[g];
    if (Math.abs(f.open - f.target) < 0.002) continue;
    f.open = damp(f.open, f.target, 4, dt);
    f.group.visible = f.open > 0.02;
    f.group.scale.setScalar(Math.max(0.0001, f.open));
  }

  /* 玻璃罩碎裂 */
  if (domeBreak > 0 && roseDome && roseDome.visible){
    domeBreak += dt;
    var dp = clamp(domeBreak/0.6, 0, 1);
    roseDome.scale.setScalar(1 + dp*0.5);
    roseDome.material.opacity = 0.15 * (1 - dp);
    if (roseDomeRing) roseDomeRing.material.opacity = 0.5 * (1 - dp);
    if (dp >= 1){
      roseDome.visible = false;
      if (roseDomeRing) roseDomeRing.visible = false;
      domeBreak = 0;
    }
  }

  /* 灯塔呼吸：灯光、地面光斑、扫动光束一起做出“灯在转”的感觉 */
  if (beaconLanternMat) beaconLanternMat.emissiveIntensity = 1.4 + Math.sin(elapsed*1.8)*0.25;
  if (beacon.userData.halo) beacon.userData.halo.material.opacity = 0.45 + Math.sin(elapsed*1.8)*0.12;
  if (beacon.userData.halo2) beacon.userData.halo2.material.opacity = 0.13 + Math.sin(elapsed*1.4 + 1.1)*0.05;
  if (beacon.userData.pool) beacon.userData.pool.material.opacity = 0.14 + Math.sin(elapsed*1.6)*0.045;
  if (beacon.userData.sweep) beacon.userData.sweep.rotation.y = elapsed*0.55;

  /* 井水/池水微光 + 池面萤火飘动 */
  if (wellWaterMat) wellWaterMat.emissiveIntensity = .68 + Math.sin(elapsed*1.3)*.10;
  if (pondWaterMat) pondWaterMat.emissiveIntensity = .58 + Math.sin(elapsed*1.1)*.09;
  if (pondGlow) pondGlow.material.opacity = .11 + Math.sin(elapsed*0.8 + 0.6)*.05;
  for (var pf=0;pf<pondFlies.length;pf++){
    var F = pondFlies[pf];
    var fa = elapsed*0.32 + F.ph;
    F.sp.position.set(Math.cos(fa)*F.r, F.h + Math.sin(elapsed*0.9 + F.ph)*0.09, Math.sin(fa)*F.r);
    F.sp.material.opacity = 0.35 + (Math.sin(elapsed*1.6 + F.ph*2.0)*0.5 + 0.5)*0.42;
  }

  /* 星光碎片 */
  for (var s=0;s<shards.length;s++){
    var sh = shards[s];
    if (sh.taken) continue;
    sh.group.rotation.y = elapsed*0.9 + sh.phase;
    var bobY = 0.62 + Math.sin(elapsed*1.7 + sh.phase)*0.12;
    sh.group.position.copy(sh.dir).multiplyScalar(PLANET_R + bobY);
    if (playerPos.distanceTo(sh.pos) < 2.0){
      sh.taken = true;
      sh.group.visible = false;
      state.shards[s] = 1;
      state.dust += 1;
      spawnSparkle(sh.dir.clone().multiplyScalar(PLANET_R + 0.7), sh.dir.clone(), 12, '#ffe3ac');
      toast('拾到一枚星光。+1 星尘');
      refreshChips();
      refreshQuests();
      persist();
      var gotAll = true;
      for (var q=0;q<shards.length;q++) if (!shards[q].taken) { gotAll = false; break; }
      if (gotAll){
        if (starMat) starMat.opacity = 1.0;
        toast('十二枚星光都回到了天上。');
      }
    }
  }

  /* 火山脉动 */
  for (var v=0;v<volcGlow.length;v++){
    var vg = volcGlow[v];
    var vf = 0.65 + Math.sin(elapsed*2.2 + vg.phase)*0.35;
    vg.mesh.material.opacity = 0.32 + vf*0.28;
    vg.light.intensity = 1.7 + vf*1.4;
  }

  updateCompass(fwd);
}

function tick(){
  requestAnimationFrame(tick);
  var dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  if (!sunset.active){
    applySky(skystate.mix * 0.35, baseElev);
  }
  updateSunset(dt);
  updatePlanet(dt);
  netTick(dt);
  updateSkills(dt);
  updateFx(dt);
  updateSkillHud(false);
  updateParticles(dt);
  if (terrainDirty){
    rebuildBase();
    rebuildOverlay();
    updateTufts();
    reseatPlanted();
    terrainDirty = false;
  }

  renderer.render(scene, camera);

  if (dbgEl){
    var gotS = 0;
    for (var i=0;i<shards.length;i++) if (shards[i].taken) gotS++;
    dbgEl.textContent =
      'pos ' + playerPos.x.toFixed(2) + ', ' + playerPos.y.toFixed(2) + ', ' + playerPos.z.toFixed(2) +
      '\nr=' + playerR.toFixed(3) +
      '\nnear ' + (nearTarget ? nearTarget.type : '-') +
      '\nday ' + state.day + '  rose ' + state.roseStage + '  garden ' + state.garden +
      '\nwater ' + state.water + '  dust ' + state.dust + '  shards ' + gotS +
      '\nh ' + tiles[findTile(playerUp)].h.toFixed(2) + '  dug ' + state.digs + '  put ' + state.placed +
      '\ninv ' + state.inv[0] + '/' + state.inv[1] + '  sel ' + state.sel +
      '\nride ' + (ride.on ? 1 : 0) + '  fall ' + (falling ? 1 : 0) + '  sheep ' + sheep.r.toFixed(2);
  }
}

/* 启动 */
var dbgEl = null;
/* 调试传送：把角色放到球面方向 u 上（tp / tpDir 共用） */
function teleportUp(u){
  playerUp.copy(u);
  playerR = Math.max(groundRadiusAt(u), PLANET_R - DIG_DEPTH_MAX);
  falling = false; playerVR = 0;
  snapHeadingToUp();
  var cf = new V3().crossVectors(u, new V3(0,1,0)).normalize();
  camF.copy(cf).negate();
  camera.position.copy(playerUp).multiplyScalar(playerR + 2.2).addScaledVector(cf, -3.6);
}
if (/[?&]dbg=1/.test(location.search)){
  dbgEl = document.createElement('div');
  dbgEl.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:60;font:11px/1.4 monospace;color:#9f9;background:rgba(0,0,0,.55);padding:5px 7px;border-radius:4px;white-space:pre;';
  document.body.appendChild(dbgEl);
  window.__b612 = {
    pos: function(){ return playerPos.toArray(); },
    up: function(){ return playerUp.toArray(); },
    r: function(){ return playerR; },
    R: function(){ return PLANET_R; },
    landmarks: function(){ return { beacon: beacon.position.toArray(), well: well.position.toArray(), pond: pond.position.toArray() }; },
    tileDetail: function(){ return TILE_DETAIL; },
    triCount: function(){ return tiles.length; },
    tile: function(){
      var T = tiles[findTile(playerUp)];
      var cr = null;
      for (var i=0;i<craters.length;i++){
        var ang = Math.acos(clamp(playerUp.dot(craters[i].c), -1, 1)) * PLANET_R;
        if (ang < CR_R){ cr = craters[i]; break; }
      }
      return { h: T.h, removed: T.removed, crater: cr ? { d: +cr.d.toFixed(3), p: cr.p } : null };
    },
    state: state,
    groundDir: function(x, y, z){
      var u = new V3(x, y, z).normalize();
      return +groundRadiusAt(u).toFixed(3);
    },
    ride: function(){ return ride.on; },
    maxH: function(){ var m = 0; for (var i=0;i<tiles.length;i++) if (tiles[i].h > m) m = tiles[i].h; return +m.toFixed(3); },
    sheep: function(){ return { r: sheep.r, up: sheep.up.toArray(), friend: sheep.friend }; },
    sol: function(){ return solids; },
    tp: function(lat, lon, d){
      var u = dirFromLatLon(lat, lon);
      if (d !== undefined && d !== null){
        var f = new V3().crossVectors(u, new V3(0,1,0)).normalize();
        u = stepDir(u, f, d);
      }
      teleportUp(u);
    },
    tpDir: function(v){ teleportUp(new V3(v[0], v[1], v[2]).normalize()); },
    tpSheep: function(v){
      var u = new V3(v[0], v[1], v[2]).normalize();
      sheep.up.copy(u);
      sheep.r = Math.max(groundRadiusAt(u), PLANET_R - DIG_DEPTH_MAX);
      sheep.air = false; sheep.vr = 0;
      sheep.dir.copy(new V3().crossVectors(u, new V3(0,1,0)).normalize());
      if (ride.on){ playerUp.copy(u); playerR = sheep.r + 0.30; snapHeadingToUp(); }
    },
    craterDir: function(){ return craters.length ? craters[craters.length-1].c.toArray() : null; },
    craters: function(){
      return craters.map(function(c){
        return { c: c.c.toArray().map(function(v){ return +v.toFixed(3); }), d: +c.d.toFixed(2), p: !!c.p };
      });
    },
    /* 固定步长跑一段时间，不受浏览器帧率/后台节流影响 */
    sim: function(sec, codes){
      var codesAll = ['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
      codesAll.forEach(function(c){ keys[c] = false; });
      (codes || []).forEach(function(c){ keys[c] = true; });
      var n = Math.max(1, Math.round(sec * 60));
      for (var i=0;i<n;i++) updatePlanet(1/60);
      var snap = { rm: +rideMove.length().toFixed(3),
                   rmv: rideMove.toArray().map(function(v){ return +v.toFixed(2); }),
                   sd: sheep.dir.toArray().map(function(v){ return +v.toFixed(2); }),
                   lat: +(PLANET_R * Math.sin(Math.acos(clamp(playerUp.dot(solids[0].up), -1, 1)))).toFixed(2) };
      codesAll.forEach(function(c){ keys[c] = false; });
      return { r: +playerR.toFixed(3), h: +tiles[findTile(playerUp)].h.toFixed(2),
               removed: tiles[findTile(playerUp)].removed, fall: falling,
               inv: state.inv.slice(), dug: state.digs, put: state.placed,
               ride: ride.on, sr: +sheep.r.toFixed(2),
               rm: snap.rm, rmv: snap.rmv, sd: snap.sd, lat: snap.lat };
    },
    distTo: function(lat, lon){
      var A = dirFromLatLon(lat, lon);
      var d = Math.min(1, Math.max(-1, playerUp.dot(A)));
      return +(PLANET_R * Math.sin(Math.acos(d))).toFixed(2);
    },
    face: function(lat, lon){
      var A = dirFromLatLon(lat, lon);
      var t = A.clone().addScaledVector(playerUp, -A.dot(playerUp));
      if (t.lengthSq() < 1e-8) t.copy(camF);
      camF.copy(t.normalize());
      camYaw = 0;
    },
    befriend: function(){ sheep.friend = true; state.sheepFriend = true; refreshQuests(); persist(); },
    goSheep: function(){
      var t = new V3().crossVectors(sheep.up, new V3(0,1,0));
      if (t.lengthSq() < 1e-8) t.set(1,0,0);
      t.normalize();
      playerUp.copy(stepDir(sheep.up, t, 1.5));
      playerR = PLANET_R;
      falling = false; playerVR = 0;
      camF.copy(t);
      camYaw = 0;
    },
    sheepDist: function(){
      var d = Math.min(1, Math.max(-1, playerUp.dot(sheep.up)));
      return +(PLANET_R * Math.sin(Math.acos(d))).toFixed(2);
    },
    sheepUp: function(){ return sheep.up.toArray(); },
    rideInfo: function(){
      return { on: ride.on, rm: rideMoving, rml: +rideMove.length().toFixed(3),

    ghost: function(){
      var a = ghost.geometry.attributes.position;
      var A = new V3().fromBufferAttribute(a, 0),
          B = new V3().fromBufferAttribute(a, 1),
          C = new V3().fromBufferAttribute(a, 2);
      var mid = new V3().addVectors(A, B).add(C).multiplyScalar(1/3);
      /* 屏幕占比：预览片到底糊住多少画面、会不会遮住角色（中心点） */
      var W = innerWidth, H = innerHeight;
      function px(v){
        var q = v.clone().project(camera);
        return [ (q.x*0.5+0.5)*W, (1-(q.y*0.5+0.5))*H ];
      }
      function metric(V){
        var p0 = px(V[0]), p1 = px(V[1]), p2 = px(V[2]);
        var tri = Math.abs((p1[0]-p0[0])*(p2[1]-p0[1]) - (p2[0]-p0[0])*(p1[1]-p0[1])) / 2;
        var s = function(a,b,c){ return (a[0]-c[0])*(b[1]-c[1]) - (b[0]-c[0])*(a[1]-c[1]); };
        var d1 = s([W/2,H/2],p0,p1), d2 = s([W/2,H/2],p1,p2), d3 = s([W/2,H/2],p2,p0);
        return { cover: +(100*tri/(W*H)).toFixed(2),
                 center: !((d1<0||d2<0||d3<0) && (d1>0||d2>0||d3>0)),
                 px: p0.concat(p1, p2).map(function(v){ return Math.round(v); }) };
      }
      var now = metric([A, B, C]);
      /* 同一视角还原修复前的整格尺寸（1/0.5 倍），纯测量不改状态，用来量化"以前糊了多少屏" */
      function grow(v){ return mid.clone().addScaledVector(v.clone().sub(mid), 1/0.5); }
      var was = metric([grow(A), grow(B), grow(C)]);
      return { on: ghost.visible, ok: !!ghost.userData.ok, why: ghost.userData.why || '',
               op: ghost.material.opacity, dw: ghost.material.depthWrite,
               side: ghost.material.side, col: ghost.material.color.getHexString(),
               edge: [+A.distanceTo(B).toFixed(2), +B.distanceTo(C).toFixed(2), +C.distanceTo(A).toFixed(2)],
               camD: +camera.position.distanceTo(mid).toFixed(2),
               cover: now.cover, center: now.center, px: now.px,
               coverOld: was.cover, centerOld: was.center,
               inv: state.inv.slice(), sel: state.sel,
               planet: { base: [baseMesh.material.transparent, baseMesh.material.depthWrite],
                         over: [overMesh.material.transparent, overMesh.material.depthWrite],
                         core: [coreMesh.material.transparent, coreMesh.material.depthWrite] } };
    },
    /* 取证：场景里所有可见的透明网格（排查"地表能看穿"到底是谁） */
    mats: function(){
      var out = [];
      scene.traverse(function(o){
        if (!o.isMesh || !o.visible || !o.material || !o.material.transparent) return;
        out.push((o.name || o.type) + '|' + (o.material.color ? o.material.color.getHexString() : '-')
                 + '|op' + o.material.opacity + '|dw' + o.material.depthWrite);
      });
      return out;
    },
    /* 地形取证：坑、改过的瓦片、树苗、花 */
    world: function(){
      var mods = [];
      for (var i=0;i<tiles.length;i++){
        var T = tiles[i];
        if (T.h !== 0 || T.removed) mods.push([i, +T.h.toFixed(2), T.removed ? 1 : 0]);
      }
      var alive = 0;
      for (var j=0;j<baobabs.length;j++) if (baobabs[j].alive) alive++;
      return {
        craters: craters.map(function(cr){
          return { c: cr.c.toArray().map(function(v){ return +v.toFixed(3); }),
                   d: +cr.d.toFixed(2), p: !!cr.p };
        }),
        mods: mods,
        treesAlive: alive, pulled: state.pulledToday.slice(),
        trees: baobabs.map(function(b, i){
          return { i: i, alive: b.alive, pos: b.pos.toArray().map(function(v){ return +v.toFixed(3); }) };
        }),
        roseDir: ROSE_DIR.toArray().map(function(v){ return +v.toFixed(4); }),
        roseStage: state.roseStage, garden: state.garden,
        dug: state.digs, placed: state.placed
      };
    },
    netJoin: function(room, server){
      if (room !== undefined && room !== null) netRoomEl.value = room;
      if (server) netServerEl.value = server;
      netConnect();
      return true;
    },
    netLeave: function(){ netDisconnect(); return true; },
    digTile: function(lat, lon, n){
      var u = dirFromLatLon(lat, lon);
      var T = tiles[findTile(u)];
      for (var i=0;i<n;i++){
        if (T.removed) break;
        T.h = +(T.h - DIG_STEP).toFixed(3);
        if (T.h <= -DIG_DEPTH_MAX + 1e-4){ T.h = -DIG_DEPTH_MAX; T.removed = true; }
      }
      markTerrain(); persist();
      return { h: T.h, removed: T.removed };
    },
    sheepAt: function(lat, lon, d){
      var u = dirFromLatLon(lat, lon);
      if (d){
        var f = new V3().crossVectors(u, new V3(0,1,0)).normalize();
        u = stepDir(u, f, d);
      }
      sheep.up.copy(u);
      sheep.r = Math.max(groundRadiusAt(u), PLANET_R - DIG_DEPTH_MAX);
      sheep.air = false; sheep.vr = 0;
      sheep.dir.copy(new V3().crossVectors(u, new V3(0,1,0)).normalize());
      if (ride.on){ playerUp.copy(sheep.up); playerR = sheep.r + 0.30; }
    }
  };
}
refreshQuests();
applySky(0, baseElev);
camera.position.copy(playerPos).addScaledVector(playerUp, 2.5).addScaledVector(camF, -6.0);
camera.up.copy(playerUp);
camera.lookAt(playerPos);
tick();

var boot = document.getElementById('boot');
setTimeout(function(){ boot.classList.add('off'); }, 260);
setTimeout(function(){
  if (state.sunsets > 0 || state.roseStage > 0 || state.dust > 0){
    toast('欢迎回来。第 ' + state.day + ' 天。');
  }
}, 900);
setTimeout(function(){ document.getElementById('hint').classList.add('hide'); }, 7500);

})();
</script>
